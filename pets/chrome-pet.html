<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Chrome Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  .stage {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: transparent;
  }

  #petWrap {
    transition: transform 0.2s ease-out;
    transform-origin: center bottom;
    transform: scale(var(--pet-scale, 1));
  }

  svg {
    width: 140px;
    height: auto;
    overflow: visible;
    cursor: pointer;
  }

  /* ================= shadow ================= */
  #shadow {
    transform-origin: 150px 248px;
    animation: shadowIdle 3.4s ease-in-out infinite;
  }
  #shadow.jump { animation: shadowHop 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes shadowIdle {
    0%, 100% { transform: scaleX(1);    opacity: 0.32; }
    50%      { transform: scaleX(0.94); opacity: 0.26; }
  }
  @keyframes shadowHop {
    0%   { transform: scaleX(1);    opacity: 0.35; }
    30%  { transform: scaleX(0.55); opacity: 0.14; }
    100% { transform: scaleX(1);    opacity: 0.35; }
  }

  /* ================= outer group: idle sway (always on) ================= */
  #cone-root {
    transform-origin: 150px 248px;
    animation: idleSway 3.4s ease-in-out infinite;
  }
  #cone-root.jump { animation: hopOnce 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes idleSway {
    0%, 100% { transform: translateY(0)   rotate(0deg); }
    50%      { transform: translateY(-4px) rotate(1.2deg); }
  }
  @keyframes hopOnce {
    0%   { transform: translateY(0)     scale(1, 1)      rotate(0deg); }
    14%  { transform: translateY(2px)   scale(1.07, 0.9)  rotate(0deg); }
    45%  { transform: translateY(-58px) scale(0.94, 1.08) rotate(-3deg); }
    72%  { transform: translateY(0)     scale(1.1, 0.88)  rotate(3deg); }
    86%  { transform: translateY(-5px)  scale(0.98, 1.03) rotate(-1deg); }
    100% { transform: translateY(0)     scale(1, 1)       rotate(0deg); }
  }

  /* ================= inner group: hover response ================= */
  #cone-hover {
    transform-origin: 150px 248px;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    cursor: pointer;
  }
  #cone-hit:hover #cone-hover {
    transform: scale(1.055) rotate(-1.5deg);
  }

  /* eyes widen + glint pops on hover */
  #face { transition: transform 0.3s ease; transform-origin: 150px 148px; }
  #cone-hit:hover #face { transform: scale(1.08); }

  /* ================= blink (independent, continuous) ================= */
  #blink {
    animation: blink 4.2s ease-in-out infinite;
    transform-origin: 150px 148px;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.05); }
    97%           { transform: scaleY(1); }
  }

  #glint { animation: sparkle 2.6s ease-in-out infinite; }
  @keyframes sparkle {
    0%, 100% { opacity: 0.55; }
    22%      { opacity: 1; }
    36%      { opacity: 0.4; }
  }

  /* little dust puffs on landing */
  .puff {
    opacity: 0;
    transform-origin: center;
  }
  .puff.show {
    animation: puff 0.55s ease-out 1;
  }
  @keyframes puff {
    0%   { opacity: 0;   transform: scale(0.2) translateY(0); }
    25%  { opacity: 0.55; }
    100% { opacity: 0;   transform: scale(1.4) translateY(-6px); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
<div id="petWrap">
<svg id="chromePetSvg" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- centre disc + legs: Chrome blue (#4285F4 family), bright top-left fading to
         a deep indigo bottom-right -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#7BAAF7"/>
      <stop offset="100%" stop-color="#1A56DB"/>
    </linearGradient>

    <!-- the three outer arcs. Same light-from-top-left diagonal as tileGrad, so all
         four body gradients share one light direction. Each pair straddles its Google
         brand hue (mean lands on ~#EA4335 / ~#FBBC05 / ~#34A853) instead of muting it,
         because at this render size the hue has to survive a 65px glance. -->
    <linearGradient id="redArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F2665A"/>
      <stop offset="100%" stop-color="#C5221F"/>
    </linearGradient>

    <linearGradient id="yellowArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#FFCE45"/>
      <stop offset="100%" stop-color="#F09300"/>
    </linearGradient>

    <linearGradient id="greenArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#4CBF6B"/>
      <stop offset="100%" stop-color="#167C3C"/>
    </linearGradient>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B5C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF6B5C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="puffGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3BE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE3BE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse id="shadow" cx="150" cy="266" rx="66" ry="12" fill="url(#shadowGrad)"/>

  <!-- landing dust puffs -->
  <circle class="puff" id="puffL" cx="112" cy="252" r="14" fill="url(#puffGrad)"/>
  <circle class="puff" id="puffR" cx="188" cy="252" r="14" fill="url(#puffGrad)"/>

  <g id="cone-root">
   <g id="cone-hit">
    <!-- invisible larger hit-area so hover/click feel generous -->
    <rect x="30" y="0" width="240" height="420" fill="transparent"/>
    <g id="cone-hover">

      <!-- legs: stubby rounded feet, anchored under the mark's own two bottom arms
           (measured fill at native y=23 gives two segments centered ~x9 and ~x14.3,
           i.e. final x~117-137 and x~158-178), so they echo the mark's natural
           two-pronged bottom instead of floating past its edge -->
      <rect x="116" y="228" width="22" height="44" rx="10" fill="url(#tileGrad)" stroke="#0B2E73" stroke-width="2"/>
      <rect x="156" y="228" width="22" height="44" rx="10" fill="url(#tileGrad)" stroke="#0B2E73" stroke-width="2"/>

      <!-- the pet's whole body IS the official Google Chrome mark, scaled up from its
           native 24x24 viewBox (Simple Icons "googlechrome" glyph). Same translate/scale
           as the old single-path version, so the silhouette is unchanged: outer radius
           12*7.5 = 90px about centre (150,145), inner disc radius 4.364*7.5 = 32.7px.
           What changed is that the mark is now split into its real parts - three colour
           arcs pinwheeled around a blue centre disc - instead of one flat blue fill.

           Geometry (angles measured clockwise from 12 o'clock):
             each arc spans 114.3 deg of the outer circle, leaving three 5.7 deg white
             seams; red is centred on 6 deg (top), yellow on 126 deg (lower right),
             green on 246 deg (lower left). Every arc is the same four-sided shape:
             a tangent edge leaving the inner circle (r 5.455), the outer arc (r 12),
             a chord edge tangent to the blue disc (r 4.364), then back along the inner
             circle. Yellow and green are red rotated 120 and 240 deg, so all twelve
             corner points land exactly on r=12 or r=5.455 - the seams cannot gap. -->
      <g transform="translate(60,55) scale(7.5)">
        <!-- white body disc: the seams between the arcs and the ring around the centre
             are this circle showing through, so they read white over any wallpaper
             rather than punching holes to the desktop the way the old path did -->
        <circle cx="12" cy="12" r="12" fill="#FFFFFF"/>

        <path fill="url(#redArcGrad)"
              d="M12 6.545 L22.6885 6.545 A12 12 0 0 0 2.6315 4.5013 L6.5842 11.3475 A5.455 5.455 0 0 1 12 6.545Z"/>
        <path fill="url(#yellowArcGrad)"
              d="M16.7242 14.7275 L11.3799 23.984 A12 12 0 0 0 23.1783 7.636 L15.273 7.636 A5.455 5.455 0 0 1 16.7242 14.7275Z"/>
        <path fill="url(#greenArcGrad)"
              d="M7.2758 14.7275 L1.9316 5.471 A12 12 0 0 0 10.1902 23.8627 L14.1428 17.0165 A5.455 5.455 0 0 1 7.2758 14.7275Z"/>

        <!-- blue centre disc. The 1.09-wide white ring between it and the arcs' inner
             edge is what stops the mark reading as a generic pinwheel -->
        <circle cx="12" cy="12" r="4.364" fill="url(#tileGrad)" stroke="#0B2E73" stroke-width="0.36"/>

        <!-- house dark rim, same colour and width the single-path version stroked with -->
        <circle cx="12" cy="12" r="12" fill="none" stroke="#0B2E73" stroke-width="0.53"/>
      </g>

      <!-- face sits in the solid inner disc (native circle radius 4.364 centered
           at 12,12 -> final center 150,145, radius ~33), clear of the three
           radial gaps that separate the mark's outer blades -->
      <g id="face">
        <ellipse cx="138" cy="150" rx="6" ry="4" fill="url(#cheekGrad)"/>
        <ellipse cx="162" cy="150" rx="6" ry="4" fill="url(#cheekGrad)"/>

        <g id="blink">
          <ellipse cx="144" cy="135" rx="6" ry="8" fill="#08205A"/>
          <ellipse cx="156" cy="135" rx="6" ry="8" fill="#08205A"/>
          <circle id="glint" cx="142" cy="131" r="2.2" fill="#FFFFFF"/>
          <circle cx="154" cy="131" r="2" fill="#FFFFFF" opacity="0.9"/>
        </g>

        <path d="M142 163 Q150 171 158 163" stroke="#08205A" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
    </g>
   </g>
  </g>
</svg>
</div>
</div>

<script>
  const pet      = document.getElementById('chromePetSvg');
  const petWrap  = document.getElementById('petWrap');
  const coneRoot = document.getElementById('cone-root');
  const shadow   = document.getElementById('shadow');
  const puffL    = document.getElementById('puffL');
  const puffR    = document.getElementById('puffR');

  // Callable from Python (settings window) to live-resize the pet.
  function applyPetScale(pct) {
    petWrap.style.setProperty('--pet-scale', (parseInt(pct, 10) / 100 || 1).toString());
  }

  // Seed size from saved config once the bridge is ready.
  window.addEventListener('pywebviewready', () => {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.get_pet_config) {
      window.pywebview.api.get_pet_config().then((cfg) => {
        if (cfg && cfg.size) applyPetScale(cfg.size);
      });
    }
  });

  function triggerJump() {
    // restart even if mid-jump: strip classes, force reflow, re-add
    coneRoot.classList.remove('jump');
    shadow.classList.remove('jump');
    puffL.classList.remove('show');
    puffR.classList.remove('show');
    void coneRoot.offsetWidth; // reflow trick to allow re-trigger

    coneRoot.classList.add('jump');
    shadow.classList.add('jump');

    // puffs appear right around landing
    setTimeout(() => {
      puffL.classList.add('show');
      puffR.classList.add('show');
    }, 430);
  }

  coneRoot.addEventListener('animationend', (e) => {
    if (e.animationName === 'hopOnce') {
      coneRoot.classList.remove('jump');
      shadow.classList.remove('jump');
    }
  });

  function handlePetClick() {
    triggerJump();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_app) {
      window.pywebview.api.open_app();
    }
  }

  // ---- drag & drop (moves the actual native window via Python) --------
  let dragStartX, dragStartY, isDragging = false, movedDistance = 0;
  const DRAG_THRESHOLD = 6;

  pet.addEventListener('mousedown', (e) => {
    if (e.button !== 0) {           // middle/right must not start a drag
      if (e.button === 1) e.preventDefault();  // block middle-click autoscroll
      return;
    }
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    movedDistance = 0;
    isDragging = false;
    if (window.pywebview && window.pywebview.api && window.pywebview.api.start_drag) {
      window.pywebview.api.start_drag();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (dragStartX === undefined) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    movedDistance += Math.abs(dx) + Math.abs(dy);
    if (movedDistance > DRAG_THRESHOLD) {
      isDragging = true;
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drag_move) {
        window.pywebview.api.drag_move(dx, dy);
      }
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    }
  });

  window.addEventListener('mouseup', () => {
    if (dragStartX === undefined) return;
    if (isDragging) {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drop) {
        window.pywebview.api.drop();
      }
    } else {
      handlePetClick();
    }
    dragStartX = undefined;
    isDragging = false;
  });

  // Middle-click (scroll-wheel click) the pet -> open the native settings window.
  pet.addEventListener('auxclick', (e) => {
    if (e.button !== 1) return;
    e.preventDefault();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_settings_window) {
      window.pywebview.api.open_settings_window();
    }
  });
</script>
</body>
</html>
