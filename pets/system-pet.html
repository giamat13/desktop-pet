<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>System Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  .stage {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: transparent;
  }

  #petWrap {
    transition: transform 0.2s ease-out;
    transform-origin: center bottom;
    transform: scale(var(--pet-scale, 1));
    position: relative;
  }

  svg#systemPetSvg {
    width: 140px;
    height: auto;
    overflow: visible;
    cursor: pointer;
  }

  #shadow {
    transform-origin: 150px 236px;
    animation: shadowIdle 3.4s ease-in-out infinite;
  }
  #shadow.jump { animation: shadowHop 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes shadowIdle {
    0%, 100% { transform: scaleX(1);    opacity: 0.32; }
    50%      { transform: scaleX(0.94); opacity: 0.26; }
  }
  @keyframes shadowHop {
    0%   { transform: scaleX(1);    opacity: 0.35; }
    30%  { transform: scaleX(0.55); opacity: 0.14; }
    100% { transform: scaleX(1);    opacity: 0.35; }
  }

  #cone-root {
    transform-origin: 150px 236px;
    animation: idleSway 3.4s ease-in-out infinite;
  }
  #cone-root.jump { animation: hopOnce 0.62s cubic-bezier(.36,0,.15,1) 1; }
  /* Runs hotter -> breathes faster. See pollHealth(). */
  #cone-root.hot { animation-duration: 1.5s; }

  @keyframes idleSway {
    0%, 100% { transform: translateY(0)   rotate(0deg); }
    50%      { transform: translateY(-4px) rotate(1.2deg); }
  }
  @keyframes hopOnce {
    0%   { transform: translateY(0)     scale(1, 1)      rotate(0deg); }
    14%  { transform: translateY(2px)   scale(1.07, 0.9)  rotate(0deg); }
    45%  { transform: translateY(-58px) scale(0.94, 1.08) rotate(-3deg); }
    72%  { transform: translateY(0)     scale(1.1, 0.88)  rotate(3deg); }
    86%  { transform: translateY(-5px)  scale(0.98, 1.03) rotate(-1deg); }
    100% { transform: translateY(0)     scale(1, 1)       rotate(0deg); }
  }

  #cone-hover {
    transform-origin: 150px 236px;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    cursor: pointer;
  }
  #cone-hit:hover #cone-hover {
    transform: scale(1.055) rotate(-1.5deg);
  }

  #face { transition: transform 0.3s ease; transform-origin: 150px 152px; }
  #cone-hit:hover #face { transform: scale(1.08); }

  #blink {
    animation: blink 4.2s ease-in-out infinite;
    transform-origin: 150px 152px;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.05); }
    97%           { transform: scaleY(1); }
  }

  #glint { animation: sparkle 2.6s ease-in-out infinite; }
  @keyframes sparkle {
    0%, 100% { opacity: 0.55; }
    22%      { opacity: 1; }
    36%      { opacity: 0.4; }
  }

  /* The pulse trace scrolling across the die is this pet's mouth AND its CPU
     readout: pollHealth() sets --ecg-dur straight from cpu_pct, so an idle
     machine ambles at ~2.2s per beat and a pegged one races at ~0.6s. Body
     reacting to load, not a badge bolted beside it. */
  #ecg {
    animation: ecgScroll var(--ecg-dur, 2.1s) linear infinite;
  }
  @keyframes ecgScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50px); }
  }

  .puff {
    opacity: 0;
    transform-origin: center;
  }
  .puff.show {
    animation: puff 0.55s ease-out 1;
  }
  @keyframes puff {
    0%   { opacity: 0;   transform: scale(0.2) translateY(0); }
    25%  { opacity: 0.55; }
    100% { opacity: 0;   transform: scale(1.4) translateY(-6px); }
  }

  /* sweat drop, shown only once CPU is pegged - same idea as claude_pet's
     near-limit sweat, just fed by CPU% instead of usage% */
  #sweat { opacity: 0; transition: opacity .25s; }
  #sweat.shown { opacity: 1; animation: sweatDrip 1.1s ease-in infinite; }
  @keyframes sweatDrip {
    0%   { transform: translateY(0);   opacity: 0.9; }
    100% { transform: translateY(10px); opacity: 0; }
  }

  /* die heat haze: continuous ramp from ~55% CPU, not an on/off threshold, so
     the pet visibly warms up before it starts sweating */
  #dieHeat { opacity: 0; transition: opacity .6s ease; }

  /* Corner gauges: fixed size, siblings of petWrap so they never ride the
     pet-size slider or bob animation - same convention as claude_pet.html's
     usage gauges (see the .gauge comment there for the full reasoning).
     Restyled here as package-coloured discs with a brass bezel so they read as
     instrumentation on the same machine rather than generic HUD chrome. */
  .gauge {
    position: absolute;
    top: 2px;
    opacity: 0;
    transition: opacity .25s;
  }
  #gaugeCpu { left: 6px; }
  #gaugeRam { right: 6px; }
  .gaugeText {
    font-family: 'Courier New', monospace;
    fill: #F2F7F5;
    paint-order: stroke;
    stroke: #0E1519;
    stroke-width: 3px;
    stroke-linejoin: round;
  }

  /* battery: an actual battery outline with a fill level, in the same brass as
     the chip's pins, rather than a floating text pill */
  #battery {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity .25s;
    box-sizing: border-box;
    width: 62px;
    height: 18px;
    border: 2px solid #B99549;
    border-radius: 5px;
    background: #16232CE6;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #battery.shown { opacity: 1; }
  #battery::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 4px;
    width: 4px;
    height: 8px;
    border-radius: 0 2px 2px 0;
    background: #B99549;
  }
  /* level is driven by scaleX, not width, so the 2s refresh never relayouts.
     Only the left corners are rounded, so scaling can't distort the radius. */
  #batteryFill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 100%;
    border-radius: 3px 0 0 3px;
    opacity: 0.55;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform .4s ease, background .4s ease;
  }
  #batteryText {
    position: relative;
    font: bold 10px 'Courier New', monospace;
    color: #F2F7F5;
    white-space: nowrap;
    text-shadow: 0 0 3px #0E1519, 0 0 3px #0E1519;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
<div id="petWrap">
<!-- Motif: the pet is an IC package - a chip in a plastic body with brass pins
     down both sides and two chunky front pins for legs, and a lit silicon die
     for a face. Chosen over the alternatives (a monitor-shaped head reads as
     "an app with a screen", which is what every other pet here already is; a
     bare heartbeat line is decoration with no silhouette to hang a face on)
     because it is the one motif whose OUTLINE alone says "this is the machine",
     it supplies its own legs instead of bolting rounded rects under a tile, and
     its die gives the vitals somewhere to live inside the character. -->
<svg id="systemPetSvg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Package: graphite epoxy. Stops straddle the target #2F3E4B rather than
         starting there and only darkening - #48596A and #16232C average to
         rgb(47,62,75), so the body's perceived colour is the slate we picked,
         not a muddy shadow of it. Deliberately not any app's brand colour,
         since this pet fronts the hardware, not a product. -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#48596A"/>
      <stop offset="100%" stop-color="#16232C"/>
    </linearGradient>

    <!-- Die: lit silicon. #2FB8A2 / #0A5A50 average to rgb(28,137,121) - deep
         enough teal that the mint face and pulse trace read as emitted light. -->
    <linearGradient id="dieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2FB8A2"/>
      <stop offset="100%" stop-color="#0A5A50"/>
    </linearGradient>

    <!-- Pins: brass. #E8C173 / #8A6A1F average to rgb(185,149,73). -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E8C173"/>
      <stop offset="100%" stop-color="#8A6A1F"/>
    </linearGradient>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Hot die. Deliberately a full opaque replacement gradient cross-faded
         over the teal one, not a translucent orange wash: orange at partial
         alpha over teal lands on olive-brown, which reads as "dirty" rather
         than "hot". Same light-to-dark diagonal as dieGrad so the cross-fade
         keeps the die's shading. -->
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF9A57"/>
      <stop offset="100%" stop-color="#A82419"/>
    </linearGradient>

    <radialGradient id="puffGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3BE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE3BE" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="dieClip">
      <rect x="94" y="128" width="112" height="72" rx="11"/>
    </clipPath>
  </defs>

  <ellipse id="shadow" cx="150" cy="236" rx="72" ry="12" fill="url(#shadowGrad)"/>

  <circle class="puff" id="puffL" cx="106" cy="226" r="14" fill="url(#puffGrad)"/>
  <circle class="puff" id="puffR" cx="194" cy="226" r="14" fill="url(#puffGrad)"/>

  <g id="cone-root">
   <g id="cone-hit">
    <rect x="30" y="0" width="240" height="400" fill="transparent"/>
    <g id="cone-hover">

      <!-- side pins -->
      <g fill="url(#pinGrad)" stroke="#0E1519" stroke-width="2.5">
        <rect x="60" y="128" width="24" height="11" rx="4"/>
        <rect x="60" y="152" width="24" height="11" rx="4"/>
        <rect x="60" y="176" width="24" height="11" rx="4"/>
        <rect x="60" y="200" width="24" height="11" rx="4"/>
        <rect x="216" y="128" width="24" height="11" rx="4"/>
        <rect x="216" y="152" width="24" height="11" rx="4"/>
        <rect x="216" y="176" width="24" height="11" rx="4"/>
        <rect x="216" y="200" width="24" height="11" rx="4"/>
      </g>

      <!-- front pins double as the pet's legs: the motif supplies its own feet
           instead of tucking generic rounded rects under a tile -->
      <g fill="url(#pinGrad)" stroke="#0E1519" stroke-width="2.5">
        <rect x="118" y="216" width="22" height="26" rx="6"/>
        <rect x="160" y="216" width="22" height="26" rx="6"/>
      </g>

      <!-- package body -->
      <rect id="petBody" x="76" y="104" width="148" height="122" rx="20"
            fill="url(#tileGrad)" stroke="#0E1519" stroke-width="4"/>
      <!-- pin-1 notch: the one detail that makes a dark rounded rect read
           specifically as a chip and not as a generic tile -->
      <circle cx="92" cy="118" r="6" fill="#0E1519" opacity="0.55"/>
      <!-- package etching under the die -->
      <rect x="102" y="209" width="96" height="3" rx="1.5" fill="#FFFFFF" opacity="0.10"/>
      <rect x="118" y="216" width="64" height="3" rx="1.5" fill="#FFFFFF" opacity="0.07"/>

      <!-- the die: this pet's screen, and the only lit surface on it -->
      <rect x="94" y="128" width="112" height="72" rx="11" fill="url(#dieGrad)"/>
      <rect id="dieHeat" x="94" y="128" width="112" height="72" rx="11" fill="url(#heatGrad)"/>
      <rect x="94" y="128" width="112" height="72" rx="11" fill="none"
            stroke="#0E1519" stroke-width="3.5"/>

      <g id="face">
        <g id="blink">
          <rect x="116" y="145" width="20" height="14" rx="4" fill="#9FFFE4"/>
          <rect x="164" y="145" width="20" height="14" rx="4" fill="#9FFFE4"/>
          <circle id="glint" cx="122" cy="149" r="2.2" fill="#FFFFFF"/>
          <circle cx="170" cy="149" r="2" fill="#FFFFFF" opacity="0.9"/>
        </g>

        <!-- its mouth IS its pulse: one trace, five periods wide, scrolled one
             period per cycle and clipped to the die so it loops seamlessly -->
        <g clip-path="url(#dieClip)">
          <path id="ecg" fill="none" stroke="#9FFFE4" stroke-width="3.5"
                stroke-linecap="round" stroke-linejoin="round"
                d="M44 182 h16 l4 -13 l5 24 l4 -11 h21
                   M94 182 h16 l4 -13 l5 24 l4 -11 h21
                   M144 182 h16 l4 -13 l5 24 l4 -11 h21
                   M194 182 h16 l4 -13 l5 24 l4 -11 h21
                   M244 182 h16 l4 -13 l5 24 l4 -11 h21"/>
        </g>
      </g>

      <!-- clears the package's top-right corner: on the dark epoxy this was
           invisible, off the edge it silhouettes against the desktop -->
      <text id="sweat" x="220" y="112" font-size="26">&#128167;</text>
    </g>
   </g>
  </g>
</svg>
</div>

<!-- CPU / RAM gauges - same ring+percentage construction as claude_pet.html's
     usage gauges, just fed by psutil instead of the usage.json bridge, and
     re-skinned into the chip's graphite + brass so they read as this machine's
     own instrumentation. Ring r=19/stroke 6, tri-colour threshold from
     gaugeColor() below. -->
<svg id="gaugeCpu" class="gauge" width="68" height="72" viewBox="0 0 68 72">
  <rect x="19" y="1" width="30" height="17" rx="8.5" fill="#16232CE6" stroke="#B99549" stroke-width="1.5"/>
  <text x="34" y="14" class="gaugeText" font-size="11" font-weight="bold" text-anchor="middle">CPU</text>
  <circle cx="34" cy="47" r="23" fill="#16232CE6" stroke="#B99549" stroke-width="1.5"/>
  <circle cx="34" cy="47" r="19" fill="none" stroke="#FFFFFF26" stroke-width="6"/>
  <circle id="gaugeCpuArc" cx="34" cy="47" r="19" fill="none" stroke="#3FC98A" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 34 47)" stroke-dasharray="0 119.4"/>
  <text id="gaugeCpuValue" x="34" y="53" class="gaugeText" font-size="17" font-weight="bold" text-anchor="middle">0%</text>
</svg>
<svg id="gaugeRam" class="gauge" width="68" height="72" viewBox="0 0 68 72">
  <rect x="19" y="1" width="30" height="17" rx="8.5" fill="#16232CE6" stroke="#B99549" stroke-width="1.5"/>
  <text x="34" y="14" class="gaugeText" font-size="11" font-weight="bold" text-anchor="middle">RAM</text>
  <circle cx="34" cy="47" r="23" fill="#16232CE6" stroke="#B99549" stroke-width="1.5"/>
  <circle cx="34" cy="47" r="19" fill="none" stroke="#FFFFFF26" stroke-width="6"/>
  <circle id="gaugeRamArc" cx="34" cy="47" r="19" fill="none" stroke="#3FC98A" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 34 47)" stroke-dasharray="0 119.4"/>
  <text id="gaugeRamValue" x="34" y="53" class="gaugeText" font-size="17" font-weight="bold" text-anchor="middle">0%</text>
</svg>
<div id="battery"><span id="batteryFill"></span><span id="batteryText"></span></div>
</div>

<script>
  const pet         = document.getElementById('systemPetSvg');
  const petWrap     = document.getElementById('petWrap');
  const coneRoot    = document.getElementById('cone-root');
  const shadow      = document.getElementById('shadow');
  const puffL       = document.getElementById('puffL');
  const puffR       = document.getElementById('puffR');
  const sweat       = document.getElementById('sweat');
  const dieHeat     = document.getElementById('dieHeat');
  const battery     = document.getElementById('battery');
  const batteryFill = document.getElementById('batteryFill');
  const batteryText = document.getElementById('batteryText');

  function applyPetScale(pct) {
    petWrap.style.setProperty('--pet-scale', (parseInt(pct, 10) / 100 || 1).toString());
  }

  window.addEventListener('pywebviewready', () => {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.get_pet_config) {
      window.pywebview.api.get_pet_config().then((cfg) => {
        if (cfg && cfg.size) applyPetScale(cfg.size);
      });
    }
    pollHealth();
    setInterval(pollHealth, 2000); // psutil's own sampling is coarse; no point polling faster
  });

  const GAUGE_CIRC = 2 * Math.PI * 19;
  const HOT_CPU_PCT  = 90; // pegged enough to sweat + speed up the idle bob
  const WARM_CPU_PCT = 55; // where the die starts visibly glowing

  function gaugeColor(pct) {
    if (pct >= 90) return '#E05C3A';
    if (pct >= 70) return '#F0B94A';
    return '#3FC98A';
  }

  function setGauge(id, pct) {
    const g = document.getElementById(id);
    if (pct == null) { g.style.opacity = '0'; return; }
    const clamped = Math.max(0, Math.min(100, pct));
    const arc = document.getElementById(id + 'Arc');
    arc.setAttribute('stroke-dasharray', `${(clamped / 100 * GAUGE_CIRC).toFixed(2)} ${GAUGE_CIRC}`);
    arc.setAttribute('stroke', gaugeColor(clamped));
    document.getElementById(id + 'Value').textContent = Math.round(clamped) + '%';
    g.style.opacity = '1';
  }

  // pulse rate and die glow are both straight functions of CPU%, so the body
  // itself is the primary readout and the ring gauge is only the precise number
  function setLoad(cpu) {
    if (cpu == null) {
      petWrap.style.removeProperty('--ecg-dur');
      dieHeat.style.opacity = '0';
      return;
    }
    const c = Math.max(0, Math.min(100, cpu));
    petWrap.style.setProperty('--ecg-dur', (2.2 - 1.6 * (c / 100)).toFixed(2) + 's');
    dieHeat.style.opacity =
      (Math.max(0, c - WARM_CPU_PCT) / (100 - WARM_CPU_PCT) * 0.92).toFixed(3);
  }

  function pollHealth() {
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.get_system_health)) return;
    window.pywebview.api.get_system_health().then((h) => {
      if (!h) {
        setGauge('gaugeCpu', null);
        setGauge('gaugeRam', null);
        setLoad(null);
        battery.classList.remove('shown');
        sweat.classList.remove('shown');
        coneRoot.classList.remove('hot');
        return;
      }
      setGauge('gaugeCpu', h.cpu_pct);
      setGauge('gaugeRam', h.ram_pct);
      setLoad(h.cpu_pct);
      const hot = h.cpu_pct != null && h.cpu_pct >= HOT_CPU_PCT;
      sweat.classList.toggle('shown', hot);
      coneRoot.classList.toggle('hot', hot);
      if (h.battery_pct == null) {
        battery.classList.remove('shown');
      } else {
        const b = Math.max(0, Math.min(100, h.battery_pct));
        batteryFill.style.transform = 'scaleX(' + (b / 100).toFixed(3) + ')';
        batteryFill.style.background = b <= 15 ? '#E05C3A' : b <= 35 ? '#F0B94A' : '#3FC98A';
        batteryText.textContent = Math.round(b) + '%' + (h.on_battery ? ' \u{1F50B}' : ' \u{26A1}');
        battery.classList.add('shown');
      }
    }).catch(() => {});
  }

  function triggerJump() {
    coneRoot.classList.remove('jump');
    shadow.classList.remove('jump');
    puffL.classList.remove('show');
    puffR.classList.remove('show');
    void coneRoot.offsetWidth;

    coneRoot.classList.add('jump');
    shadow.classList.add('jump');

    setTimeout(() => {
      puffL.classList.add('show');
      puffR.classList.add('show');
    }, 430);
  }

  coneRoot.addEventListener('animationend', (e) => {
    if (e.animationName === 'hopOnce') {
      coneRoot.classList.remove('jump');
      shadow.classList.remove('jump');
    }
  });

  function handlePetClick() {
    triggerJump();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_app) {
      window.pywebview.api.open_app();
    }
  }

  let dragStartX, dragStartY, isDragging = false, movedDistance = 0;
  const DRAG_THRESHOLD = 6;

  pet.addEventListener('mousedown', (e) => {
    if (e.button !== 0) {
      if (e.button === 1) e.preventDefault();
      return;
    }
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    movedDistance = 0;
    isDragging = false;
    if (window.pywebview && window.pywebview.api && window.pywebview.api.start_drag) {
      window.pywebview.api.start_drag();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (dragStartX === undefined) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    movedDistance += Math.abs(dx) + Math.abs(dy);
    if (movedDistance > DRAG_THRESHOLD) {
      isDragging = true;
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drag_move) {
        window.pywebview.api.drag_move(dx, dy);
      }
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    }
  });

  window.addEventListener('mouseup', () => {
    if (dragStartX === undefined) return;
    if (isDragging) {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drop) {
        window.pywebview.api.drop();
      }
    } else {
      handlePetClick();
    }
    dragStartX = undefined;
    isDragging = false;
  });

  pet.addEventListener('auxclick', (e) => {
    if (e.button !== 1) return;
    e.preventDefault();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_settings_window) {
      window.pywebview.api.open_settings_window();
    }
  });
</script>
</body>
</html>
