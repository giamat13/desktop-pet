<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>System Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  .stage {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: transparent;
  }

  #petWrap {
    transition: transform 0.2s ease-out;
    transform-origin: center bottom;
    transform: scale(var(--pet-scale, 1));
    position: relative;
  }

  svg#systemPetSvg {
    width: 140px;
    height: auto;
    overflow: visible;
    cursor: pointer;
  }

  #shadow {
    transform-origin: 150px 236px;
    animation: shadowIdle 3.4s ease-in-out infinite;
  }
  #shadow.jump { animation: shadowHop 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes shadowIdle {
    0%, 100% { transform: scaleX(1);    opacity: 0.32; }
    50%      { transform: scaleX(0.94); opacity: 0.26; }
  }
  @keyframes shadowHop {
    0%   { transform: scaleX(1);    opacity: 0.35; }
    30%  { transform: scaleX(0.55); opacity: 0.14; }
    100% { transform: scaleX(1);    opacity: 0.35; }
  }

  #cone-root {
    transform-origin: 150px 236px;
    animation: idleSway 3.4s ease-in-out infinite;
  }
  #cone-root.jump { animation: hopOnce 0.62s cubic-bezier(.36,0,.15,1) 1; }
  /* Runs hotter -> breathes faster. See pollHealth(). */
  #cone-root.hot { animation-duration: 1.5s; }

  @keyframes idleSway {
    0%, 100% { transform: translateY(0)   rotate(0deg); }
    50%      { transform: translateY(-4px) rotate(1.2deg); }
  }
  @keyframes hopOnce {
    0%   { transform: translateY(0)     scale(1, 1)      rotate(0deg); }
    14%  { transform: translateY(2px)   scale(1.07, 0.9)  rotate(0deg); }
    45%  { transform: translateY(-58px) scale(0.94, 1.08) rotate(-3deg); }
    72%  { transform: translateY(0)     scale(1.1, 0.88)  rotate(3deg); }
    86%  { transform: translateY(-5px)  scale(0.98, 1.03) rotate(-1deg); }
    100% { transform: translateY(0)     scale(1, 1)       rotate(0deg); }
  }

  #cone-hover {
    transform-origin: 150px 236px;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    cursor: pointer;
  }
  #cone-hit:hover #cone-hover {
    transform: scale(1.055) rotate(-1.5deg);
  }

  #face { transition: transform 0.3s ease; transform-origin: 150px 152px; }
  #cone-hit:hover #face { transform: scale(1.08); }

  .blinkEye {
    /* Duration is data-driven, not decorative - see applyBlinkMetric()/
       updateBlinkRates() in the script below. Each eye keeps its own
       --blink-dur (set directly on #blinkL / #blinkR), so left and right
       can run at different paces when they're on different metrics.
       --blink-dur defaults to the original fixed pace until the first
       health poll lands. transform-origin is set inline per eye above. */
    animation: blink var(--blink-dur, 4.2s) ease-in-out infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.05); }
    97%           { transform: scaleY(1); }
  }

  #glint { animation: sparkle 2.6s ease-in-out infinite; }
  @keyframes sparkle {
    0%, 100% { opacity: 0.55; }
    22%      { opacity: 1; }
    36%      { opacity: 0.4; }
  }

  /* The trace across the die is this pet's mouth AND a real CPU history
     graph: drawCpuGraph() redraws it from an actual rolling buffer of sampled
     cpu_pct values every poll, so the shape you see is the machine's own last
     ~60s of load, not a decorative animation. */
  #ecg {
    transition: d 0.15s linear;
  }

  .puff {
    opacity: 0;
    transform-origin: center;
  }
  .puff.show {
    animation: puff 0.55s ease-out 1;
  }
  @keyframes puff {
    0%   { opacity: 0;   transform: scale(0.2) translateY(0); }
    25%  { opacity: 0.55; }
    100% { opacity: 0;   transform: scale(1.4) translateY(-6px); }
  }

  /* sweat drop, shown only once CPU is pegged - same idea as claude_pet's
     near-limit sweat, just fed by CPU% instead of usage% */
  #sweat { opacity: 0; transition: opacity .25s; }
  #sweat.shown { opacity: 1; animation: sweatDrip 1.1s ease-in infinite; }
  @keyframes sweatDrip {
    0%   { transform: translateY(0);   opacity: 0.9; }
    100% { transform: translateY(10px); opacity: 0; }
  }

  /* die heat haze: continuous ramp from ~55% CPU, not an on/off threshold, so
     the pet visibly warms up before it starts sweating */
  #dieHeat { opacity: 0; transition: opacity .6s ease; }

  /* Corner gauges: fixed size, siblings of petWrap so they never ride the
     pet-size slider or bob animation - same convention as claude_pet.html's
     usage gauges (see the .gauge comment there for the full reasoning).
     Restyled here as package-coloured discs with a brass bezel so they read as
     instrumentation on the same machine rather than generic HUD chrome. */
  .gauge {
    position: absolute;
    top: 2px;
    opacity: 0;
    transition: opacity .25s;
  }
  #gaugeLeft { left: 6px; }
  #gaugeRight { right: 6px; }
  .gaugeText {
    font-family: 'Courier New', monospace;
    fill: #F2F7F5;
    paint-order: stroke;
    stroke: #0E1519;
    stroke-width: 3px;
    stroke-linejoin: round;
  }

  /* Boost button: a lightning badge riding the top edge of the package,
     independent of the whole-body click (which opens Task Manager). */
  #boostBtn { cursor: pointer; }
  #boostBtn circle { transition: fill 0.15s; }
  #boostBtn:hover circle { fill: #23343EE6; }
  #boostBtn.busy circle { animation: boostPulse 0.6s ease-in-out infinite; }
  @keyframes boostPulse {
    0%, 100% { fill: #16232CE6; }
    50%      { fill: #F0B94A; }
  }

  /* Download / upload arrows flanking the pet - fixed size and position like
     the corner gauges, so they don't ride the pet-size slider or bob. Bounce
     speed is driven straight from measured net throughput (--arrow-dur, set
     in setNetArrow()): idle traffic ambles, a saturated link bounces fast. */
  .netArrow {
    position: absolute;
    top: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    opacity: 0;
    transition: opacity .25s;
  }
  #netDown { left: 30px; }
  #netUp   { right: 30px; }
  .netArrow.shown { opacity: 1; }
  .arrowGlyph {
    font-size: 28px;
    line-height: 1;
    color: #9FFFE4;
    text-shadow: 0 0 3px #0E1519, 0 0 3px #0E1519;
    animation: arrowBounce var(--arrow-dur, 2.4s) ease-in-out infinite;
  }
  #netUp .arrowGlyph { color: #F0B94A; }
  @keyframes arrowBounce {
    0%, 100% { transform: translateY(-4px); opacity: .45; }
    50%      { transform: translateY(7px);  opacity: 1; }
  }
  .netLabel {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: bold;
    color: #F2F7F5;
    text-shadow: 0 0 3px #0E1519, 0 0 3px #0E1519;
    white-space: nowrap;
  }
  /* Pins in use right now (updatePinUsage()): brass swaps for the same lit
     teal as the die, so a "populated socket" reads as "live" the same way
     the screen does, not just a brighter brass. */
  #pinsL rect.pin-lit, #pinsR rect.pin-lit {
    fill: url(#dieGrad);
    filter: drop-shadow(0 0 3px #2FB8A2);
  }

  /* battery: an actual battery outline with a fill level, in the same brass as
     the chip's pins, rather than a floating text pill */
  #battery {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity .25s;
    box-sizing: border-box;
    width: 62px;
    height: 18px;
    border: 2px solid #B99549;
    border-radius: 5px;
    background: #16232CE6;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #battery.shown { opacity: 1; }
  #battery::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 4px;
    width: 4px;
    height: 8px;
    border-radius: 0 2px 2px 0;
    background: #B99549;
  }
  /* level is driven by scaleX, not width, so the 2s refresh never relayouts.
     Only the left corners are rounded, so scaling can't distort the radius. */
  #batteryFill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 100%;
    border-radius: 3px 0 0 3px;
    opacity: 0.55;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform .4s ease, background .4s ease;
  }
  #batteryText {
    position: relative;
    font: bold 10px 'Courier New', monospace;
    color: #F2F7F5;
    white-space: nowrap;
    text-shadow: 0 0 3px #0E1519, 0 0 3px #0E1519;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
<div id="petWrap">
<!-- Motif: the pet is an IC package - a chip in a plastic body with brass pins
     down both sides and two chunky front pins for legs, and a lit silicon die
     for a face. Chosen over the alternatives (a monitor-shaped head reads as
     "an app with a screen", which is what every other pet here already is; a
     bare heartbeat line is decoration with no silhouette to hang a face on)
     because it is the one motif whose OUTLINE alone says "this is the machine",
     it supplies its own legs instead of bolting rounded rects under a tile, and
     its die gives the vitals somewhere to live inside the character. -->
<svg id="systemPetSvg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Package: graphite epoxy. Stops straddle the target #2F3E4B rather than
         starting there and only darkening - #48596A and #16232C average to
         rgb(47,62,75), so the body's perceived colour is the slate we picked,
         not a muddy shadow of it. Deliberately not any app's brand colour,
         since this pet fronts the hardware, not a product. -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#48596A"/>
      <stop offset="100%" stop-color="#16232C"/>
    </linearGradient>

    <!-- Die: lit silicon. #2FB8A2 / #0A5A50 average to rgb(28,137,121) - deep
         enough teal that the mint face and pulse trace read as emitted light. -->
    <linearGradient id="dieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2FB8A2"/>
      <stop offset="100%" stop-color="#0A5A50"/>
    </linearGradient>

    <!-- Pins: brass. #E8C173 / #8A6A1F average to rgb(185,149,73). -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E8C173"/>
      <stop offset="100%" stop-color="#8A6A1F"/>
    </linearGradient>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Hot die. Deliberately a full opaque replacement gradient cross-faded
         over the teal one, not a translucent orange wash: orange at partial
         alpha over teal lands on olive-brown, which reads as "dirty" rather
         than "hot". Same light-to-dark diagonal as dieGrad so the cross-fade
         keeps the die's shading. -->
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF9A57"/>
      <stop offset="100%" stop-color="#A82419"/>
    </linearGradient>

    <radialGradient id="puffGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3BE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE3BE" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="dieClip">
      <rect x="94" y="128" width="112" height="72" rx="11"/>
    </clipPath>
  </defs>

  <ellipse id="shadow" cx="150" cy="236" rx="72" ry="12" fill="url(#shadowGrad)"/>

  <circle class="puff" id="puffL" cx="106" cy="226" r="14" fill="url(#puffGrad)"/>
  <circle class="puff" id="puffR" cx="194" cy="226" r="14" fill="url(#puffGrad)"/>

  <g id="cone-root">
   <g id="cone-hit">
    <rect x="30" y="0" width="240" height="400" fill="transparent"/>
    <g id="cone-hover">

      <!-- side pins: dynamically rendered by renderPins() below, not static
           markup - count and spacing depend on the fixed hardware spec
           (RAM/cores) chosen in settings, so the two <g> containers start
           empty and get populated once get_pet_config() reports the specs. -->
      <g id="pinsL" fill="url(#pinGrad)" stroke="#0E1519" stroke-width="2.5"></g>
      <g id="pinsR" fill="url(#pinGrad)" stroke="#0E1519" stroke-width="2.5"></g>

      <!-- front pins double as the pet's legs: the motif supplies its own feet
           instead of tucking generic rounded rects under a tile -->
      <g fill="url(#pinGrad)" stroke="#0E1519" stroke-width="2.5">
        <rect x="118" y="216" width="22" height="26" rx="6"/>
        <rect x="160" y="216" width="22" height="26" rx="6"/>
      </g>

      <!-- package body -->
      <rect id="petBody" x="76" y="104" width="148" height="122" rx="20"
            fill="url(#tileGrad)" stroke="#0E1519" stroke-width="4"/>
      <!-- pin-1 notch: the one detail that makes a dark rounded rect read
           specifically as a chip and not as a generic tile -->
      <circle cx="92" cy="118" r="6" fill="#0E1519" opacity="0.55"/>
      <!-- package etching under the die -->
      <rect x="102" y="209" width="96" height="3" rx="1.5" fill="#FFFFFF" opacity="0.10"/>
      <rect x="118" y="216" width="64" height="3" rx="1.5" fill="#FFFFFF" opacity="0.07"/>

      <!-- the die: this pet's screen, and the only lit surface on it -->
      <rect x="94" y="128" width="112" height="72" rx="11" fill="url(#dieGrad)"/>
      <rect id="dieHeat" x="94" y="128" width="112" height="72" rx="11" fill="url(#heatGrad)"/>
      <rect x="94" y="128" width="112" height="72" rx="11" fill="none"
            stroke="#0E1519" stroke-width="3.5"/>

      <g id="face">
        <!-- Each eye blinks on its own group/origin now - independent left/
             right blink metrics (applyBlinkMetric(side, metric)) need
             separate transforms, not one shared scaleY over both eyes. -->
        <g id="blinkL" class="blinkEye" style="transform-origin: 126px 152px;">
          <rect x="116" y="145" width="20" height="14" rx="4" fill="#9FFFE4"/>
          <circle id="glint" cx="122" cy="149" r="2.2" fill="#FFFFFF"/>
        </g>
        <g id="blinkR" class="blinkEye" style="transform-origin: 174px 152px;">
          <rect x="164" y="145" width="20" height="14" rx="4" fill="#9FFFE4"/>
          <circle cx="170" cy="149" r="2" fill="#FFFFFF" opacity="0.9"/>
        </g>

        <!-- its mouth IS its pulse: one trace, five periods wide, scrolled one
             period per cycle and clipped to the die so it loops seamlessly -->
        <g clip-path="url(#dieClip)">
          <path id="ecg" fill="none" stroke="#9FFFE4" stroke-width="3.5"
                stroke-linecap="round" stroke-linejoin="round"
                d="M44 182 h16 l4 -13 l5 24 l4 -11 h21
                   M94 182 h16 l4 -13 l5 24 l4 -11 h21
                   M144 182 h16 l4 -13 l5 24 l4 -11 h21
                   M194 182 h16 l4 -13 l5 24 l4 -11 h21
                   M244 182 h16 l4 -13 l5 24 l4 -11 h21"/>
        </g>
      </g>

      <!-- clears the package's top-right corner: on the dark epoxy this was
           invisible, off the edge it silhouettes against the desktop -->
      <text id="sweat" x="220" y="112" font-size="26">&#128167;</text>

      <!-- Boost button: downloads + runs 100RAMoptimal in QuickClean (fast)
           mode. Own mousedown/click handlers stop propagation so it never
           triggers the whole-body drag/click behaviour underneath it. -->
      <g id="boostBtn" transform="translate(150,90)">
        <circle r="19" fill="#16232CE6" stroke="#B99549" stroke-width="2"/>
        <text x="0" y="9" font-size="24" text-anchor="middle">&#9889;</text>
      </g>
    </g>
   </g>
  </g>
</svg>
</div>

<!-- Corner gauges - same ring+percentage construction as claude_pet.html's
     usage gauges, just fed by psutil instead of the usage.json bridge, and
     re-skinned into the chip's graphite + brass so they read as this machine's
     own instrumentation. Ring r=19/stroke 6, tri-colour threshold from
     gaugeColor() below. Each shows whatever metric settings.html assigned it
     (applyGaugeMetric()) - CPU/RAM by default, not hardwired to them. -->
<svg id="gaugeLeft" class="gauge" width="68" height="72" viewBox="0 0 68 72">
  <rect x="19" y="1" width="30" height="17" rx="8.5" fill="#16232CE6" stroke="#B99549" stroke-width="1.5"/>
  <text id="gaugeLeftLabel" x="34" y="14" class="gaugeText" font-size="11" font-weight="bold" text-anchor="middle">CPU</text>
  <circle cx="34" cy="47" r="23" fill="#16232CE6" stroke="#B99549" stroke-width="1.5"/>
  <circle cx="34" cy="47" r="19" fill="none" stroke="#FFFFFF26" stroke-width="6"/>
  <circle id="gaugeLeftArc" cx="34" cy="47" r="19" fill="none" stroke="#3FC98A" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 34 47)" stroke-dasharray="0 119.4"/>
  <text id="gaugeLeftValue" x="34" y="53" class="gaugeText" font-size="17" font-weight="bold" text-anchor="middle">0%</text>
</svg>
<svg id="gaugeRight" class="gauge" width="68" height="72" viewBox="0 0 68 72">
  <rect x="19" y="1" width="30" height="17" rx="8.5" fill="#16232CE6" stroke="#B99549" stroke-width="1.5"/>
  <text id="gaugeRightLabel" x="34" y="14" class="gaugeText" font-size="11" font-weight="bold" text-anchor="middle">RAM</text>
  <circle cx="34" cy="47" r="23" fill="#16232CE6" stroke="#B99549" stroke-width="1.5"/>
  <circle cx="34" cy="47" r="19" fill="none" stroke="#FFFFFF26" stroke-width="6"/>
  <circle id="gaugeRightArc" cx="34" cy="47" r="19" fill="none" stroke="#3FC98A" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 34 47)" stroke-dasharray="0 119.4"/>
  <text id="gaugeRightValue" x="34" y="53" class="gaugeText" font-size="17" font-weight="bold" text-anchor="middle">0%</text>
</svg>
<div id="battery"><span id="batteryFill"></span><span id="batteryText"></span></div>
<div id="netDown" class="netArrow"><span class="arrowGlyph">&#8595;</span><span class="netLabel" id="netDownLabel">--</span></div>
<div id="netUp" class="netArrow"><span class="arrowGlyph">&#8593;</span><span class="netLabel" id="netUpLabel">--</span></div>
</div>

<script>
  const pet         = document.getElementById('systemPetSvg');
  const petWrap     = document.getElementById('petWrap');
  const coneRoot    = document.getElementById('cone-root');
  const shadow      = document.getElementById('shadow');
  const puffL       = document.getElementById('puffL');
  const puffR       = document.getElementById('puffR');
  const sweat       = document.getElementById('sweat');
  const dieHeat     = document.getElementById('dieHeat');
  const battery     = document.getElementById('battery');
  const batteryFill = document.getElementById('batteryFill');
  const batteryText = document.getElementById('batteryText');
  const ecgPath     = document.getElementById('ecg');
  const boostBtn    = document.getElementById('boostBtn');
  const netDown     = document.getElementById('netDown');
  const netUp       = document.getElementById('netUp');

  function applyPetScale(pct) {
    petWrap.style.setProperty('--pet-scale', (parseInt(pct, 10) / 100 || 1).toString());
  }

  // Which metric each corner gauge shows - settings.html picks these; default
  // to the original CPU/RAM pair until get_pet_config() says otherwise.
  let leftMetric = 'cpu';
  let rightMetric = 'ram';
  let graphMetric = 'cpu';
  let blinkMetricL = 'cpu';
  let blinkMetricR = 'cpu';
  function applyGaugeMetric(side, metric) {
    if (side === 'left') leftMetric = metric; else rightMetric = metric;
  }
  function applyGraphMetric(metric) {
    graphMetric = metric;
    graphHistory = []; // switching metric mid-flight would otherwise plot a mixed trace
  }
  function applyBlinkMetric(side, metric) {
    if (side === 'left') {
      blinkMetricL = metric;
      windowStateL.lastSwitches = null; // re-baseline so switching INTO 'window' mid-flight can't read a stale jump
    } else {
      blinkMetricR = metric;
      windowStateR.lastSwitches = null;
    }
  }

  // Pins: a populated-socket motif over a fixed hardware spec, not a live
  // gauge - ramTotalGb/cpuCores are read once at startup (get_pet_config,
  // system pet only) since they never change while the pet runs. 4GB per pin
  // under 'ram', 2 logical cores per pin under 'cores'. The pin count itself
  // (not a fixed 8 with some dimmed) scales with the spec - a 64GB machine
  // gets 8 per side - and each side's pins are laid out centered in the
  // body's pin band rather than pinned to the top.
  let pinMetric = 'ram';
  let ramTotalGb = null;
  let cpuCores = null;

  const PIN_X_L = 60, PIN_X_R = 216, PIN_W = 24, PIN_H = 11;
  const PIN_MAX_PITCH = 24;      // spacing used whenever this many pins fit at the original pitch
  const PIN_AREA_TOP = 114, PIN_AREA_BOTTOM = 220; // vertical band pins center within (inside the body's left/right edge)
  const PIN_MAX_PER_SIDE = 8;    // 64GB / 4GB-per-pin -> 8 per side, the example this was sized for

  function computePinTotal() {
    const raw = pinMetric === 'cores'
      ? (cpuCores != null ? cpuCores / 2 : null)
      : (ramTotalGb != null ? ramTotalGb / 4 : null);
    // Spec unknown (psutil missing): fall back to the original 4-per-side look.
    if (raw == null) return 8;
    return Math.max(2, Math.min(PIN_MAX_PER_SIDE * 2, Math.round(raw)));
  }

  // Pin y-positions for one side, centered in PIN_AREA_TOP..BOTTOM. Spacing
  // shrinks below PIN_MAX_PITCH only once more pins need to fit than the
  // original design (4 per side) allowed for.
  function layoutPinYs(n) {
    if (n <= 0) return [];
    const room = PIN_AREA_BOTTOM - PIN_AREA_TOP;
    const pitch = n > 1 ? Math.min(PIN_MAX_PITCH, (room - PIN_H) / (n - 1)) : 0;
    const groupH = pitch * (n - 1) + PIN_H;
    const startY = PIN_AREA_TOP + (room - groupH) / 2;
    const ys = [];
    for (let i = 0; i < n; i++) ys.push(startY + pitch * i);
    return ys;
  }

  const SVG_NS = 'http://www.w3.org/2000/svg';
  function fillPinGroup(group, x, ys) {
    group.textContent = ''; // clears prior render before re-laying-out
    const rects = [];
    ys.forEach((y) => {
      const r = document.createElementNS(SVG_NS, 'rect');
      r.setAttribute('x', x);
      r.setAttribute('y', y.toFixed(1));
      r.setAttribute('width', PIN_W);
      r.setAttribute('height', PIN_H);
      r.setAttribute('rx', 4);
      group.appendChild(r);
      rects.push(r);
    });
    return rects;
  }

  // Every pin rect, in one flat list (left top-to-bottom, then right
  // top-to-bottom) - the order updatePinUsage() lights through.
  let allPinRects = [];

  function renderPins() {
    const total = computePinTotal();
    const left = Math.ceil(total / 2);   // odd totals give the left side the extra pin
    const right = Math.floor(total / 2);
    const leftRects = fillPinGroup(document.getElementById('pinsL'), PIN_X_L, layoutPinYs(left));
    const rightRects = fillPinGroup(document.getElementById('pinsR'), PIN_X_R, layoutPinYs(right));
    allPinRects = leftRects.concat(rightRects);
    lastPinPct = null; // force a re-light against the new pin count
  }

  function applyPinMetric(metric) {
    pinMetric = metric;
    renderPins();
  }

  // Pins double as a usage meter: the fraction of pins "electrified" tracks
  // how much of the spec they represent is actually in use right now (RAM%
  // under 'ram', CPU% under 'cores') - not a live value each pin carries,
  // just how many of the fixed sockets are lit.
  let lastPinPct = null;
  function updatePinUsage(h) {
    const pct = h ? Math.max(0, Math.min(100, (pinMetric === 'cores' ? h.cpu_pct : h.ram_pct) || 0)) : 0;
    if (pct === lastPinPct) return;
    lastPinPct = pct;
    const lit = Math.round(allPinRects.length * pct / 100);
    allPinRects.forEach((r, i) => r.classList.toggle('pin-lit', i < lit));
  }

  window.addEventListener('pywebviewready', () => {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.get_pet_config) {
      window.pywebview.api.get_pet_config().then((cfg) => {
        if (!cfg) return;
        if (cfg.size) applyPetScale(cfg.size);
        if (cfg.gauge_left) leftMetric = cfg.gauge_left;
        if (cfg.gauge_right) rightMetric = cfg.gauge_right;
        if (cfg.graph_metric) graphMetric = cfg.graph_metric;
        if (cfg.blink_metric_left) blinkMetricL = cfg.blink_metric_left;
        if (cfg.blink_metric_right) blinkMetricR = cfg.blink_metric_right;
        if (cfg.pin_metric) pinMetric = cfg.pin_metric;
        if (cfg.ram_total_gb != null) ramTotalGb = cfg.ram_total_gb;
        if (cfg.cpu_cores != null) cpuCores = cfg.cpu_cores;
        if (cfg.speed_unit) speedUnit = cfg.speed_unit;
        renderPins();
      });
    }
    pollHealth();
    setInterval(pollHealth, 2000); // psutil's own sampling is coarse; no point polling faster
  });

  const GAUGE_CIRC = 2 * Math.PI * 19;
  const HOT_CPU_PCT  = 90; // pegged enough to sweat + speed up the idle bob
  const WARM_CPU_PCT = 55; // where the die starts visibly glowing

  function gaugeColor(pct) {
    if (pct >= 90) return '#E05C3A';
    if (pct >= 70) return '#F0B94A';
    return '#3FC98A';
  }

  // What each selectable metric is called, its percent-ring cap, and how its
  // raw value should read as text. net_down/net_up have no natural 0-100% -
  // the ring caps at NET_GAUGE_MAX_KBPS (a saturated home connection), the
  // text always shows the real, uncapped speed.
  const NET_GAUGE_MAX_KBPS = 5000; // ~40 Mbps -> ring reads "full"
  // Disk throughput saturates a much bigger number than a home connection -
  // ~100MB/s is a comfortable "full ring" mark for a spinning/SATA-ish drive
  // without pegging the gauge on every NVMe burst.
  const DISK_GAUGE_MAX_KBPS = 100000;
  const TEMP_GAUGE_MAX_C = 100;
  const METRIC_META = {
    cpu:        { label: 'CPU', max: 100 },
    ram:        { label: 'RAM', max: 100 },
    battery:    { label: 'BAT', max: 100 },
    net_down:   { label: 'DN',  max: NET_GAUGE_MAX_KBPS },
    net_up:     { label: 'UP',  max: NET_GAUGE_MAX_KBPS },
    disk_read:  { label: 'DR',  max: DISK_GAUGE_MAX_KBPS },
    disk_write: { label: 'DW',  max: DISK_GAUGE_MAX_KBPS },
    temp:       { label: 'TMP', max: TEMP_GAUGE_MAX_C },
  };

  function metricRaw(h, key) {
    switch (key) {
      case 'cpu': return h.cpu_pct;
      case 'ram': return h.ram_pct;
      case 'battery': return h.battery_pct;
      case 'net_down': return h.net_down_kbps;
      case 'net_up': return h.net_up_kbps;
      case 'disk_read': return h.disk_read_kbps;
      case 'disk_write': return h.disk_write_kbps;
      case 'temp': return h.cpu_temp_c;
      default: return null;
    }
  }

  // 'MB' (default): kbps is already KB/s as sampled from bytes. 'Mb': ×8 to
  // read in bits, matching how ISPs advertise connection speed.
  let speedUnit = 'MB';
  function applySpeedUnit(unit) {
    speedUnit = unit;
  }
  function formatKbps(kbps) {
    const v = speedUnit === 'Mb' ? kbps * 8 : kbps;
    const big = speedUnit === 'Mb' ? 'Mb' : 'MB';
    const small = speedUnit === 'Mb' ? 'Kb' : 'KB';
    return v >= 1024 ? (v / 1024).toFixed(1) + big : Math.round(v) + small;
  }

  function formatMetric(key, raw) {
    if (key === 'net_down' || key === 'net_up' || key === 'disk_read' || key === 'disk_write') return formatKbps(raw);
    if (key === 'temp') return Math.round(raw) + '°C';
    return Math.round(raw) + '%';
  }

  function setGauge(id, key, raw) {
    const g = document.getElementById(id);
    const meta = METRIC_META[key] || METRIC_META.cpu;
    document.getElementById(id + 'Label').textContent = meta.label;
    if (raw == null) { g.style.opacity = '0'; return; }
    const pct = Math.max(0, Math.min(100, (raw / meta.max) * 100));
    const arc = document.getElementById(id + 'Arc');
    arc.setAttribute('stroke-dasharray', `${(pct / 100 * GAUGE_CIRC).toFixed(2)} ${GAUGE_CIRC}`);
    arc.setAttribute('stroke', gaugeColor(pct));
    document.getElementById(id + 'Value').textContent = formatMetric(key, raw);
    g.style.opacity = '1';
  }

  // Real sensor temp (WARM/HOT in °C) when psutil can read one - Windows
  // usually can't without a vendor tool, so this stays the exception, not
  // the rule. CPU% remains the fallback proxy, same thresholds as before.
  const WARM_TEMP_C = 55;
  const HOT_TEMP_C  = 80;

  // die glow tracks real CPU temp when the sensor is available, falling back
  // to CPU% as a proxy otherwise - so the body is the primary readout either
  // way, and the ring gauge is only the precise number
  function setLoad(h) {
    if (!h || h.cpu_pct == null) { dieHeat.style.opacity = '0'; return; }
    if (h.cpu_temp_c != null) {
      const t = Math.max(0, Math.min(HOT_TEMP_C, h.cpu_temp_c));
      dieHeat.style.opacity =
        (Math.max(0, t - WARM_TEMP_C) / (HOT_TEMP_C - WARM_TEMP_C) * 0.92).toFixed(3);
      return;
    }
    const c = Math.max(0, Math.min(100, h.cpu_pct));
    dieHeat.style.opacity =
      (Math.max(0, c - WARM_CPU_PCT) / (100 - WARM_CPU_PCT) * 0.92).toFixed(3);
  }

  // Real, live history graph drawn into the die - not a decorative loop.
  // Each poll appends the latest sample of whichever metric settings.html
  // picked (applyGraphMetric()) and redraws the whole polyline, so the trace
  // is always exactly that metric's last ~HISTORY_LEN*2 seconds.
  const HISTORY_LEN = 30; // ~60s of history at the 2s poll interval
  const DIE = { x: 94, y: 128, w: 112, h: 72, pad: 8 };
  let graphHistory = [];

  function drawGraph(h) {
    const meta = METRIC_META[graphMetric] || METRIC_META.cpu;
    const raw = h ? metricRaw(h, graphMetric) : null;
    const pct = raw == null ? 0 : Math.max(0, Math.min(100, (raw / meta.max) * 100));
    graphHistory.push(pct);
    if (graphHistory.length > HISTORY_LEN) graphHistory.shift();
    if (graphHistory.length < 2) { ecgPath.setAttribute('d', ''); return; }
    const innerW = DIE.w - DIE.pad * 2;
    const innerH = DIE.h - DIE.pad * 2;
    const n = graphHistory.length;
    // Normalize x by the current sample count, not the full buffer size, so
    // the trace always spans the whole die - a half-full buffer right after
    // startup reads as "history so far", not a stub stuck on the left edge.
    const pts = graphHistory.map((v, i) => {
      const x = DIE.x + DIE.pad + (i / (n - 1)) * innerW;
      const y = DIE.y + DIE.pad + innerH - (v / 100) * innerH;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    ecgPath.setAttribute('d', 'M' + pts.join(' L'));
  }

  function formatSpeed(kbps) {
    return kbps == null ? '--' : formatKbps(kbps) + '/s';
  }

  // How fast each eye blinks - settings.html picks which live metric drives
  // each one independently (applyBlinkMetric(side, metric)), default 'cpu'
  // for both (so they stay in sync out of the box, same as the old shared
  // blink). Every metric reduces to a 0..1 "excitement" level, then that
  // level is lerped between a calm default pace and an alert one.
  const BLINK_CALM_S  = 4.2; // original fixed pace, kept as the 0% floor
  const BLINK_ALERT_S = 1.1; // fastest blink, at 100% excitement
  const blinkElL = document.getElementById('blinkL');
  const blinkElR = document.getElementById('blinkR');
  // 'window' state is tracked per side (not shared) so each eye's excite
  // window is independent even though both read the same window_switches
  // counter - when both sides use 'window' they see the same counter move
  // at the same poll and so land back in sync naturally, same as any other
  // metric picked for both sides.
  const windowStateL = { lastSwitches: null, exciteUntil: 0 };
  const windowStateR = { lastSwitches: null, exciteUntil: 0 };

  function blinkExcitement(h, metric, state) {
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    switch (metric) {
      case 'ram':
        return clamp01((h.ram_pct || 0) / 100);
      case 'net': {
        const kbps = Math.max(h.net_down_kbps || 0, h.net_up_kbps || 0);
        return clamp01(Math.log2(1 + kbps / 64) / 8); // same log curve as the arrow speed, cheap transfers barely register
      }
      case 'disk': {
        const kbps = Math.max(h.disk_read_kbps || 0, h.disk_write_kbps || 0);
        return clamp01(Math.log2(1 + kbps / 1024) / 8); // same log shape as 'net', rebased for disk's much bigger KB/s range
      }
      case 'window': {
        // Not a gauge value - a brief speed-up right when the foreground
        // window actually changes, calm otherwise. window_switches is a
        // running count (see pet_app.py) so a switch that happened between
        // two polls still shows up as the number moving.
        if (h.window_switches != null) {
          if (state.lastSwitches !== null && h.window_switches > state.lastSwitches) {
            state.exciteUntil = performance.now() + 1500;
          }
          state.lastSwitches = h.window_switches;
        }
        return performance.now() < state.exciteUntil ? 1 : 0;
      }
      case 'cpu':
      default:
        return clamp01((h.cpu_pct || 0) / 100);
    }
  }

  function updateBlinkRates(h) {
    const excL = h ? blinkExcitement(h, blinkMetricL, windowStateL) : 0;
    const excR = h ? blinkExcitement(h, blinkMetricR, windowStateR) : 0;
    blinkElL.style.setProperty('--blink-dur', (BLINK_CALM_S - (BLINK_CALM_S - BLINK_ALERT_S) * excL).toFixed(2) + 's');
    blinkElR.style.setProperty('--blink-dur', (BLINK_CALM_S - (BLINK_CALM_S - BLINK_ALERT_S) * excR).toFixed(2) + 's');
  }

  // Bounce speed scales with real throughput: idle traffic ambles at the
  // 2.4s CSS default, a saturated link bounces near the 0.3s floor.
  function setNetArrow(el, kbps) {
    el.querySelector('.netLabel').textContent = formatSpeed(kbps);
    if (kbps == null) { el.classList.remove('shown'); return; }
    el.classList.add('shown');
    const dur = Math.max(0.3, 2.4 - 0.55 * Math.log2(1 + Math.max(0, kbps) / 32));
    el.querySelector('.arrowGlyph').style.setProperty('--arrow-dur', dur.toFixed(2) + 's');
  }

  function pollHealth() {
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.get_system_health)) return;
    window.pywebview.api.get_system_health().then((h) => {
      if (!h) {
        setGauge('gaugeLeft', leftMetric, null);
        setGauge('gaugeRight', rightMetric, null);
        setLoad(null);
        battery.classList.remove('shown');
        sweat.classList.remove('shown');
        coneRoot.classList.remove('hot');
        setNetArrow(netDown, null);
        setNetArrow(netUp, null);
        updateBlinkRates(null);
        updatePinUsage(null);
        return;
      }
      setGauge('gaugeLeft', leftMetric, metricRaw(h, leftMetric));
      setGauge('gaugeRight', rightMetric, metricRaw(h, rightMetric));
      setLoad(h);
      drawGraph(h);
      setNetArrow(netDown, h.net_down_kbps);
      setNetArrow(netUp, h.net_up_kbps);
      updateBlinkRates(h);
      updatePinUsage(h);
      const hot = h.cpu_pct != null && h.cpu_pct >= HOT_CPU_PCT;
      sweat.classList.toggle('shown', hot);
      coneRoot.classList.toggle('hot', hot);
      if (h.battery_pct == null) {
        battery.classList.remove('shown');
      } else {
        const b = Math.max(0, Math.min(100, h.battery_pct));
        batteryFill.style.transform = 'scaleX(' + (b / 100).toFixed(3) + ')';
        batteryFill.style.background = b <= 15 ? '#E05C3A' : b <= 35 ? '#F0B94A' : '#3FC98A';
        batteryText.textContent = Math.round(b) + '%' + (h.on_battery ? ' \u{1F50B}' : ' \u{26A1}');
        battery.classList.add('shown');
      }
    }).catch(() => {});
  }

  // Own handlers so a boost click never starts the whole-body drag/click.
  boostBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  boostBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.run_boost)) return;
    boostBtn.classList.add('busy');
    window.pywebview.api.run_boost().finally(() => {
      setTimeout(() => boostBtn.classList.remove('busy'), 1500);
    });
  });

  function triggerJump() {
    coneRoot.classList.remove('jump');
    shadow.classList.remove('jump');
    puffL.classList.remove('show');
    puffR.classList.remove('show');
    void coneRoot.offsetWidth;

    coneRoot.classList.add('jump');
    shadow.classList.add('jump');

    setTimeout(() => {
      puffL.classList.add('show');
      puffR.classList.add('show');
    }, 430);
  }

  coneRoot.addEventListener('animationend', (e) => {
    if (e.animationName === 'hopOnce') {
      coneRoot.classList.remove('jump');
      shadow.classList.remove('jump');
    }
  });

  function handlePetClick() {
    triggerJump();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_app) {
      window.pywebview.api.open_app();
    }
  }

  let dragStartX, dragStartY, isDragging = false, movedDistance = 0;
  const DRAG_THRESHOLD = 6;

  pet.addEventListener('mousedown', (e) => {
    if (e.button !== 0) {
      if (e.button === 1) e.preventDefault();
      return;
    }
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    movedDistance = 0;
    isDragging = false;
    if (window.pywebview && window.pywebview.api && window.pywebview.api.start_drag) {
      window.pywebview.api.start_drag();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (dragStartX === undefined) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    movedDistance += Math.abs(dx) + Math.abs(dy);
    if (movedDistance > DRAG_THRESHOLD) {
      isDragging = true;
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drag_move) {
        window.pywebview.api.drag_move(dx, dy);
      }
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    }
  });

  window.addEventListener('mouseup', () => {
    if (dragStartX === undefined) return;
    if (isDragging) {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drop) {
        window.pywebview.api.drop();
      }
    } else {
      handlePetClick();
    }
    dragStartX = undefined;
    isDragging = false;
  });

  pet.addEventListener('auxclick', (e) => {
    if (e.button !== 1) return;
    e.preventDefault();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_settings_window) {
      window.pywebview.api.open_settings_window();
    }
  });
</script>
</body>
</html>
