<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>VLC Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  .stage {
    position: relative; /* anchors #mediaBar, which sits outside petWrap */
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: transparent;
  }

  /* Now-playing bar. Deliberately a sibling of #petWrap, not part of the SVG:
     the pet rides a size slider and a hop animation, and the bar must not.
     Near-opaque dark backing with light text on purpose - the pet floats over
     whatever is behind it, so anything relying on the backdrop's own contrast
     is unreadable half the time. */
  #mediaBar {
    position: absolute;
    top: 4px;
    left: 12px;
    right: 12px;
    opacity: 0;
    transition: opacity 0.3s ease-out;
    pointer-events: none;
    background: #12100FE6;
    border-radius: 10px;
    padding: 6px 10px 7px;
    font-family: 'Courier New', monospace;
    color: #FFFFFF;
  }
  /* Class-driven, never an inline opacity: `paused` has to be able to win
     over `shown`, and an inline style would beat both. */
  #mediaBar.shown { opacity: 1; }
  #mediaBar.shown.paused { opacity: 0.62; }
  /* Title and elapsed share one row on purpose. Stacked on three rows the bar
     was ~55px tall and ran under the sprite, which paints over it (the pet is
     later in the DOM) - the right third of the track was simply invisible. */
  #mediaTop {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 5px;
  }
  #mediaTitle {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #mediaTrack {
    height: 6px;
    border-radius: 3px;
    background: #FFFFFF33;
    overflow: hidden;
  }
  #mediaFill {
    height: 100%;
    width: 100%;
    background: #FF8A2A;
    /* scaleX, not width: this is an always-on overlay that ticks once a
       second forever, and transform stays off the layout path entirely.
       #mediaTrack's overflow:hidden supplies the rounded ends. */
    transform: scaleX(0);
    transform-origin: left center;
    /* matches the 1s poll, so the bar creeps instead of stepping */
    transition: transform 1s linear;
  }
  #mediaTime {
    flex: none;
    font-size: 11px;
    font-weight: bold;
    opacity: 0.9;
  }

  #petWrap {
    transition: transform 0.2s ease-out;
    transform-origin: center bottom;
    transform: scale(var(--pet-scale, 1));
  }

  svg {
    width: 140px;
    height: auto;
    overflow: visible;
    cursor: pointer;
  }

  /* ================= shadow ================= */
  #shadow {
    transform-origin: 150px 372px;
    animation: shadowIdle 3.4s ease-in-out infinite;
  }
  #shadow.jump { animation: shadowHop 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes shadowIdle {
    0%, 100% { transform: scaleX(1);    opacity: 0.32; }
    50%      { transform: scaleX(0.94); opacity: 0.26; }
  }
  @keyframes shadowHop {
    0%   { transform: scaleX(1);    opacity: 0.35; }
    30%  { transform: scaleX(0.55); opacity: 0.14; }
    100% { transform: scaleX(1);    opacity: 0.35; }
  }

  /* ================= outer group: idle sway (always on) ================= */
  #cone-root {
    transform-origin: 150px 372px;
    animation: idleSway 3.4s ease-in-out infinite;
  }
  @keyframes idleSway {
    0%, 100% { transform: translateY(0)   rotate(0deg); }
    50%      { transform: translateY(-4px) rotate(1.2deg); }
  }
  /* While VLC is actually playing, the cone itself grooves to it instead of
     just idling underneath a progress bar - the bar alone left the character
     looking untouched by what it was supposedly reporting on. Paused/no-media
     falls back to idleSway, same as before.
     --groove-scale is set from JS each poll off VLC's own volume (see
     pollMedia below) - one continuous animation gets bigger/faster at higher
     volume rather than swapping between discrete named animations. Clamped
     to >= 0.5 on the JS side so the duration calc below never divides by
     (near-)zero. */
  #cone-root.playing {
    animation: vlcGroove calc(0.58s / var(--groove-scale, 1)) ease-in-out infinite;
  }
  @keyframes vlcGroove {
    0%, 100% { transform: translateY(0) rotate(calc(-4deg * var(--groove-scale, 1))); }
    50%      { transform: translateY(calc(-10px * var(--groove-scale, 1))) rotate(calc(4deg * var(--groove-scale, 1))); }
  }
  /* Last ~15s of a playing track: a quicker, more anxious wobble instead of
     the steady groove, so "about to end" reads on the cone itself rather
     than only from watching the bar's fill creep to the right edge.
     Declared after .playing so it wins the specificity tie while active. */
  #cone-root.near-end {
    animation: vlcNearEnd 0.35s ease-in-out infinite;
  }
  @keyframes vlcNearEnd {
    0%, 100% { transform: translateY(0)   rotate(-6deg); }
    50%      { transform: translateY(-4px) rotate(6deg); }
  }
  /* One-shot startle for a sudden seek/skip in the timeline (position jumped
     far more than one second's worth of playback since the last poll) -
     the bar's fill would otherwise just silently teleport with no reaction
     from the character at all. */
  #cone-root.startle { animation: vlcStartle 0.45s ease-out 1; }
  @keyframes vlcStartle {
    0%   { transform: translateY(0)    scale(1, 1)    rotate(0deg); }
    30%  { transform: translateY(-14px) scale(0.9, 1.1) rotate(-8deg); }
    60%  { transform: translateY(0)    scale(1.05, 0.92) rotate(6deg); }
    100% { transform: translateY(0)    scale(1, 1)    rotate(0deg); }
  }
  /* Declared AFTER .playing/.near-end on purpose: same specificity, so a
     click-jump (transient) still wins over an in-progress groove/anticipation
     (continuous) whenever both classes are briefly present together. */
  #cone-root.jump { animation: hopOnce 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes hopOnce {
    0%   { transform: translateY(0)     scale(1, 1)      rotate(0deg); }
    14%  { transform: translateY(2px)   scale(1.07, 0.9)  rotate(0deg); }
    45%  { transform: translateY(-58px) scale(0.94, 1.08) rotate(-3deg); }
    72%  { transform: translateY(0)     scale(1.1, 0.88)  rotate(3deg); }
    86%  { transform: translateY(-5px)  scale(0.98, 1.03) rotate(-1deg); }
    100% { transform: translateY(0)     scale(1, 1)       rotate(0deg); }
  }

  /* ================= inner group: hover response ================= */
  #cone-hover {
    transform-origin: 150px 372px;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    cursor: pointer;
  }
  #cone-hit:hover #cone-hover {
    transform: scale(1.055) rotate(-1.5deg);
  }

  /* eyes widen + glint pops on hover */
  #face { transition: transform 0.3s ease; transform-origin: 150px 210px; }
  #cone-hit:hover #face { transform: scale(1.08); }

  /* ================= blink (independent, continuous) ================= */
  #blink {
    animation: blink 4.2s ease-in-out infinite;
    transform-origin: 150px 210px;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.05); }
    97%           { transform: scaleY(1); }
  }

  #glint { animation: sparkle 2.6s ease-in-out infinite; }
  @keyframes sparkle {
    0%, 100% { opacity: 0.55; }
    22%      { opacity: 1; }
    36%      { opacity: 0.4; }
  }

  /* little dust puffs on landing */
  .puff {
    opacity: 0;
    transform-origin: center;
  }
  .puff.show {
    animation: puff 0.55s ease-out 1;
  }
  @keyframes puff {
    0%   { opacity: 0;   transform: scale(0.2) translateY(0); }
    25%  { opacity: 0.55; }
    100% { opacity: 0;   transform: scale(1.4) translateY(-6px); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
<!-- Now playing in VLC, via its localhost HTTP interface (see read_vlc_media()
     in pet_app.py). dir="ltr" because filenames and track titles are mostly
     latin and the time reads "0:12 / 3:45" left to right regardless. -->
<div id="mediaBar" dir="ltr">
  <div id="mediaTop"><span id="mediaTitle"></span><span id="mediaTime"></span></div>
  <div id="mediaTrack"><div id="mediaFill"></div></div>
</div>
<div id="petWrap">
<svg id="vlcPetSvg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#FFB25C"/>
      <stop offset="35%" stop-color="#FF8A2A"/>
      <stop offset="70%" stop-color="#F26A00"/>
      <stop offset="100%" stop-color="#C24E00"/>
    </linearGradient>

    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#E85E00"/>
      <stop offset="100%" stop-color="#A83E00"/>
    </linearGradient>

    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF7EC"/>
      <stop offset="100%" stop-color="#F2E4D0"/>
    </linearGradient>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B5C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF6B5C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="puffGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3BE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE3BE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse id="shadow" cx="150" cy="374" rx="72" ry="14" fill="url(#shadowGrad)"/>

  <!-- landing dust puffs -->
  <circle class="puff" id="puffL" cx="108" cy="360" r="16" fill="url(#puffGrad)"/>
  <circle class="puff" id="puffR" cx="192" cy="360" r="16" fill="url(#puffGrad)"/>

  <g id="cone-root">
   <g id="cone-hit">
    <!-- invisible larger hit-area so hover/click feel generous -->
    <rect x="40" y="0" width="220" height="400" fill="transparent"/>
    <g id="cone-hover">

      <!-- base plate -->
      <g>
        <rect x="70" y="352" width="160" height="22" rx="6" fill="url(#baseGrad)"/>
        <rect x="70" y="352" width="160" height="7" rx="3" fill="#FF9640" opacity="0.6"/>
      </g>

      <!-- cone body -->
      <path d="M150 40 L206 352 L94 352 Z"
            fill="url(#bodyGrad)" stroke="#8A3300" stroke-width="2" stroke-linejoin="round"/>

      <path d="M150 40 L94 352 L110 352 L150 60 Z" fill="#000000" opacity="0.14"/>
      <path d="M150 40 L206 352 L192 352 L150 60 Z" fill="#FFFFFF" opacity="0.12"/>

      <path d="M133 150 L167 150 L182 210 L118 210 Z" fill="url(#stripeGrad)" stroke="#D8C7AE" stroke-width="1.5"/>
      <path d="M104 280 L196 280 L206 320 L94 320 Z" fill="url(#stripeGrad)" stroke="#D8C7AE" stroke-width="1.5"/>

      <ellipse cx="120" cy="300" rx="5" ry="8" fill="#8A3300" opacity="0.25"/>
      <ellipse cx="178" cy="255" rx="4" ry="6" fill="#8A3300" opacity="0.2"/>

      <ellipse cx="150" cy="40" rx="14" ry="12" fill="#FFC98A"/>
      <ellipse cx="150" cy="36" rx="8" ry="6" fill="#FFFFFF" opacity="0.7"/>

      <g id="face">
        <ellipse cx="112" cy="222" rx="14" ry="9" fill="url(#cheekGrad)"/>
        <ellipse cx="188" cy="222" rx="14" ry="9" fill="url(#cheekGrad)"/>

        <g id="blink">
          <ellipse cx="132" cy="210" rx="11" ry="13" fill="#241505"/>
          <ellipse cx="168" cy="210" rx="11" ry="13" fill="#241505"/>
          <circle id="glint" cx="128" cy="205" r="3.4" fill="#FFFFFF"/>
          <circle cx="164" cy="205" r="3.4" fill="#FFFFFF" opacity="0.9"/>
        </g>

        <path d="M124 234 Q150 252 176 234" stroke="#241505" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>
    </g>
   </g>
  </g>
</svg>
</div>
</div>

<script>
  const pet      = document.getElementById('vlcPetSvg');
  const petWrap  = document.getElementById('petWrap');
  const coneRoot = document.getElementById('cone-root');
  const shadow   = document.getElementById('shadow');
  const puffL    = document.getElementById('puffL');
  const puffR    = document.getElementById('puffR');

  // Callable from Python (settings window) to live-resize the pet.
  function applyPetScale(pct) {
    petWrap.style.setProperty('--pet-scale', (parseInt(pct, 10) / 100 || 1).toString());
  }

  // Seed size from saved config once the bridge is ready.
  window.addEventListener('pywebviewready', () => {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.get_pet_config) {
      window.pywebview.api.get_pet_config().then((cfg) => {
        if (cfg && cfg.size) applyPetScale(cfg.size);
      });
    }
    pollMedia();
    setInterval(pollMedia, 1000);
  });

  // ---- now-playing bar ------------------------------------------------
  function fmtTime(secs) {
    const s = Math.max(0, Math.floor(secs));
    const h = Math.floor(s / 3600);
    const m = Math.floor(s / 60) % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
  }

  // How close to the end counts as "about to finish".
  const NEAR_END_SECS = 15;
  // The poll is on a ~1s timer, so one second of real playback is expected
  // between reads; anything past this slack is an actual seek, not just
  // ordinary timer jitter.
  const SEEK_JUMP_SECS = 4;
  let lastPosition = null;

  function pollMedia() {
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.get_media)) return;
    window.pywebview.api.get_media().then((m) => {
      const bar = document.getElementById('mediaBar');
      // Nothing loaded, VLC closed, or the HTTP interface is off: no bar at
      // all rather than an empty one pretending to be at 0:00.
      if (!m || !m.duration) {
        bar.classList.remove('shown');
        coneRoot.classList.remove('playing');
        coneRoot.classList.remove('near-end');
        lastPosition = null;
        return;
      }
      document.getElementById('mediaTitle').textContent = m.title || '';
      const frac = Math.max(0, Math.min(1, m.position / m.duration));
      document.getElementById('mediaFill').style.transform = `scaleX(${frac})`;
      document.getElementById('mediaTime').textContent =
        `${fmtTime(m.position)} / ${fmtTime(m.duration)}`;
      bar.classList.toggle('paused', !m.playing);
      bar.classList.add('shown');
      // Don't re-add unconditionally: that would restart the groove loop
      // from its 0% frame on every 1s poll instead of letting it run.
      if (m.playing !== coneRoot.classList.contains('playing')) {
        coneRoot.classList.toggle('playing', m.playing);
      }

      // Louder VLC volume -> a bigger, faster groove. m.volume is 0-1 (or
      // absent, e.g. a malformed <volume> element) - missing/unknown volume
      // keeps the pre-existing intensity rather than treating it as silence.
      // Floor of 0.5 keeps this off both the CSS calc's denominator (a scale
      // of 0 there would divide the animation duration by zero) and away
      // from a groove so tiny it reads as broken rather than "quiet".
      const grooveScale = (typeof m.volume === 'number')
        ? Math.max(0.5, Math.min(1.6, 0.5 + m.volume * 1.1))
        : 1;
      coneRoot.style.setProperty('--groove-scale', grooveScale.toFixed(2));

      const nearEnd = m.playing && (m.duration - m.position) <= NEAR_END_SECS && (m.duration - m.position) > 0;
      if (nearEnd !== coneRoot.classList.contains('near-end')) {
        coneRoot.classList.toggle('near-end', nearEnd);
      }

      // A seek/skip: the position moved far more than the ~1s that should
      // have elapsed since the last poll (in either direction).
      if (lastPosition != null && m.playing && Math.abs(m.position - (lastPosition + 1)) > SEEK_JUMP_SECS) {
        coneRoot.classList.remove('startle');
        void coneRoot.offsetWidth; // reflow trick to allow re-trigger
        coneRoot.classList.add('startle');
      }
      lastPosition = m.position;
    }).catch(() => {});
  }

  function triggerJump() {
    // restart even if mid-jump: strip classes, force reflow, re-add
    coneRoot.classList.remove('jump');
    shadow.classList.remove('jump');
    puffL.classList.remove('show');
    puffR.classList.remove('show');
    void coneRoot.offsetWidth; // reflow trick to allow re-trigger

    coneRoot.classList.add('jump');
    shadow.classList.add('jump');

    // puffs appear right around landing
    setTimeout(() => {
      puffL.classList.add('show');
      puffR.classList.add('show');
    }, 430);
  }

  coneRoot.addEventListener('animationend', (e) => {
    if (e.animationName === 'hopOnce') {
      coneRoot.classList.remove('jump');
      shadow.classList.remove('jump');
    } else if (e.animationName === 'vlcStartle') {
      coneRoot.classList.remove('startle');
    }
  });

  function handlePetClick() {
    triggerJump();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_app) {
      window.pywebview.api.open_app();
    }
  }

  // ---- drag & drop (moves the actual native window via Python) --------
  let dragStartX, dragStartY, isDragging = false, movedDistance = 0;
  const DRAG_THRESHOLD = 6;

  pet.addEventListener('mousedown', (e) => {
    if (e.button !== 0) {           // middle/right must not start a drag
      if (e.button === 1) e.preventDefault();  // block middle-click autoscroll
      return;
    }
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    movedDistance = 0;
    isDragging = false;
    if (window.pywebview && window.pywebview.api && window.pywebview.api.start_drag) {
      window.pywebview.api.start_drag();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (dragStartX === undefined) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    movedDistance += Math.abs(dx) + Math.abs(dy);
    if (movedDistance > DRAG_THRESHOLD) {
      isDragging = true;
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drag_move) {
        window.pywebview.api.drag_move(dx, dy);
      }
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    }
  });

  window.addEventListener('mouseup', () => {
    if (dragStartX === undefined) return;
    if (isDragging) {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drop) {
        window.pywebview.api.drop();
      }
    } else {
      handlePetClick();
    }
    dragStartX = undefined;
    isDragging = false;
  });

  // Middle-click (scroll-wheel click) the pet -> open the native settings window.
  pet.addEventListener('auxclick', (e) => {
    if (e.button !== 1) return;
    e.preventDefault();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_settings_window) {
      window.pywebview.api.open_settings_window();
    }
  });
</script>
</body>
</html>
