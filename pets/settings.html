<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>הגדרות</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #FAECE7;
    font-family: 'Courier New', monospace;
    color: #4A1B0C;
  }
  body {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px 20px;
    box-sizing: border-box;
  }
  h1 { margin: 0; font-size: 16px; color: #B94A24; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  /* An author `display: flex` outranks the UA stylesheet's [hidden] rule, so
     without this a hidden row still takes up its full height. */
  .row[hidden] { display: none; }
  .label { font-weight: bold; font-size: 13px; }
  .modes { display: flex; gap: 8px; }
  .modes button {
    flex: 1;
    padding: 8px;
    border: 2px solid #D85A30;
    border-radius: 8px;
    background: #FFF7F0;
    color: #B94A24;
    font-family: inherit;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
  }
  .modes button.active { background: #D2703C; color: #FFF7F0; }
  input[type=range] { width: 100%; }
  .value { font-size: 12px; color: #B94A24; }
  #save {
    margin-top: 4px;
    background: #D2703C;
    color: #FFF7F0;
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-family: inherit;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
  }
  #save:active { transform: scale(0.98); }
</style>
</head>
<body>
  <h1>הגדרות החיה</h1>

  <div class="row">
    <span class="label">מיקום</span>
    <div class="modes" id="positionModes">
      <button id="modeDesktop" data-mode="desktop">על שולחן העבודה</button>
      <button id="modeTaskbar" data-mode="taskbar">על שורת המשימות</button>
    </div>
  </div>

  <!-- Claude only: no other pet has "several live sessions" to divide up.
       Hidden until get_pet_config() says which pet this window belongs to. -->
  <div class="row" id="sessionRow" hidden>
    <span class="label">כמה סשנים במקביל</span>
    <div class="modes" id="sessionModes">
      <button data-session-mode="split">פיצול הגוף</button>
      <button data-session-mode="lock">נעילה על סשן</button>
    </div>
  </div>

  <!-- Claude only, and only when the scheduled task exists. On by default:
       a refresh now costs ~1.2k Haiku tokens, ~0.4% of the weekly allowance
       at 10-minute intervals (it was ~57% before). Off, the gauges only
       update when you talk to Claude in a real terminal yourself. -->
  <div class="row" id="refreshRow" hidden>
    <span class="label">שעוני שימוש</span>
    <div class="modes" id="refreshModes">
      <button data-refresh="1">מתעדכנים לבד</button>
      <button data-refresh="0">כבויים</button>
    </div>
    <span class="value">רענון כל 10 דק׳ ≈ 0.4% מהמכסה השבועית (היה 57%). כבוי: מתעדכן רק כששולחים הודעה לקלוד בטרמינל.</span>
  </div>

  <!-- System pet only: pick what each corner gauge shows instead of the
       fixed CPU/RAM assignment. Hidden until get_pet_config() names the pet. -->
  <div class="row" id="gaugeRow" hidden>
    <span class="label">מה מוצג במדים</span>
    <div style="display:flex; gap:8px;">
      <select id="gaugeLeftSelect"></select>
      <select id="gaugeRightSelect"></select>
    </div>
  </div>

  <!-- System pet only: what the die's live history graph plots. -->
  <div class="row" id="graphRow" hidden>
    <span class="label">מה מוצג בגרף</span>
    <select id="graphSelect"></select>
  </div>

  <!-- System pet only: what drives how fast each eye blinks. Same metric on
       both = synced; different metrics = each eye blinks independently. -->
  <div class="row" id="blinkRow" hidden>
    <span class="label">מה קובע את קצב המצמוץ (עין ימין / שמאל)</span>
    <div style="display:flex; gap:8px;">
      <select id="blinkRightSelect"></select>
      <select id="blinkLeftSelect"></select>
    </div>
  </div>

  <!-- System pet only: what the 8 side pins represent (populated/
       unpopulated-socket readout of RAM or CPU cores). -->
  <div class="row" id="pinRow" hidden>
    <span class="label">מה מייצגים הפינים בצד</span>
    <select id="pinSelect"></select>
    <span class="value" id="pinValue"></span>
  </div>

  <!-- System pet only: unit for the net down/up arrow labels. -->
  <div class="row" id="speedRow" hidden>
    <span class="label">יחידת מהירות הרשת</span>
    <div class="modes" id="speedModes">
      <button data-speed="MB">MB (בייטים)</button>
      <button data-speed="Mb">Mb (סיביות)</button>
    </div>
  </div>

  <div class="row">
    <span class="label">כוונון עדין</span>
    <input id="margin" type="range" min="-80" max="180" value="46" />
    <span class="value" id="marginValue">46px</span>
  </div>

  <div class="row">
    <span class="label">גודל החיה</span>
    <input id="size" type="range" min="70" max="130" value="100" />
    <span class="value" id="sizeValue">100%</span>
  </div>

  <button id="save">סגור ✓</button>

<script>
  const marginSlider = document.getElementById('margin');
  const marginValue  = document.getElementById('marginValue');
  const sizeSlider   = document.getElementById('size');
  const sizeValue    = document.getElementById('sizeValue');
  // Scoped to #positionModes, not '.modes button': there is a second button
  // group now, and a stray match would let a session-mode click clear the
  // position highlight (and vice versa).
  const modeButtons    = [...document.querySelectorAll('#positionModes button')];
  const sessionRow     = document.getElementById('sessionRow');
  const sessionButtons = [...document.querySelectorAll('#sessionModes button')];
  const refreshRow     = document.getElementById('refreshRow');
  const refreshButtons = [...document.querySelectorAll('#refreshModes button')];
  const gaugeRow          = document.getElementById('gaugeRow');
  const gaugeLeftSelect   = document.getElementById('gaugeLeftSelect');
  const gaugeRightSelect  = document.getElementById('gaugeRightSelect');
  const graphRow          = document.getElementById('graphRow');
  const graphSelect       = document.getElementById('graphSelect');
  const blinkRow          = document.getElementById('blinkRow');
  const blinkLeftSelect   = document.getElementById('blinkLeftSelect');
  const blinkRightSelect  = document.getElementById('blinkRightSelect');
  const pinRow            = document.getElementById('pinRow');
  const pinSelect         = document.getElementById('pinSelect');
  const pinValue          = document.getElementById('pinValue');
  const speedRow          = document.getElementById('speedRow');
  const speedButtons      = [...document.querySelectorAll('#speedModes button')];
  const saveBtn        = document.getElementById('save');

  // System pet only - what each corner gauge can show instead of the fixed
  // CPU/RAM pair. Kept in sync with SettingsApi._ALLOWED_GAUGE_METRICS in pet_app.py.
  const GAUGE_METRICS = [
    ['cpu', 'מעבד (CPU)'],
    ['ram', 'זיכרון (RAM)'],
    ['battery', 'סוללה'],
    ['net_down', 'הורדה'],
    ['net_up', 'העלאה'],
  ];
  [gaugeLeftSelect, gaugeRightSelect, graphSelect].forEach((sel) => {
    GAUGE_METRICS.forEach(([value, label]) => {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      sel.appendChild(opt);
    });
  });
  gaugeLeftSelect.addEventListener('change', () => {
    if (api() && api().set_gauge_metric) api().set_gauge_metric('left', gaugeLeftSelect.value);
  });
  gaugeRightSelect.addEventListener('change', () => {
    if (api() && api().set_gauge_metric) api().set_gauge_metric('right', gaugeRightSelect.value);
  });
  graphSelect.addEventListener('change', () => {
    if (api() && api().set_graph_metric) api().set_graph_metric(graphSelect.value);
  });

  // Blink options are a separate, smaller set - not every gauge metric makes
  // sense as a blink rate, and 'window' isn't a gauge value at all (see
  // Api.set_blink_metric in pet_app.py). Kept in sync with
  // Api._ALLOWED_BLINK_METRICS there.
  const BLINK_METRICS = [
    ['cpu', 'מעבד (CPU)'],
    ['ram', 'זיכרון (RAM)'],
    ['net', 'העברת נתונים (רשת)'],
    ['window', 'החלפת חלון'],
  ];
  [blinkLeftSelect, blinkRightSelect].forEach((sel) => {
    BLINK_METRICS.forEach(([value, label]) => {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      sel.appendChild(opt);
    });
  });
  blinkLeftSelect.addEventListener('change', () => {
    if (api() && api().set_blink_metric) api().set_blink_metric('left', blinkLeftSelect.value);
  });
  blinkRightSelect.addEventListener('change', () => {
    if (api() && api().set_blink_metric) api().set_blink_metric('right', blinkRightSelect.value);
  });

  // Pins: fixed hardware spec, not a live gauge - see Api.set_pin_metric /
  // read_hardware_specs in pet_app.py. Kept in sync with
  // Api._ALLOWED_PIN_METRICS there.
  const PIN_METRICS = [
    ['ram', 'זיכרון (4GB לפין)'],
    ['cores', 'ליבות מעבד (2 לפין)'],
  ];
  PIN_METRICS.forEach(([value, label]) => {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = label;
    pinSelect.appendChild(opt);
  });
  pinSelect.addEventListener('change', () => {
    if (api() && api().set_pin_metric) api().set_pin_metric(pinSelect.value);
    updatePinValue();
  });

  function setSpeedUnit(unit) {
    speedButtons.forEach(b => b.classList.toggle('active', b.dataset.speed === unit));
  }
  speedButtons.forEach(b => b.addEventListener('click', () => {
    setSpeedUnit(b.dataset.speed);
    if (api() && api().set_speed_unit) api().set_speed_unit(b.dataset.speed);
  }));

  let currentSpecs = { ram_total_gb: null, cpu_cores: null };
  // Mirrors computePinTotal() in system-pet.html: 4GB or 2 cores per pin,
  // clamped to 2..16 total (8 per side max - the spec this was sized for).
  function pinTotalFor(spec, unit) {
    return spec == null ? null : Math.max(2, Math.min(16, Math.round(spec / unit)));
  }
  function updatePinValue() {
    if (pinSelect.value === 'cores') {
      const total = pinTotalFor(currentSpecs.cpu_cores, 2);
      pinValue.textContent = currentSpecs.cpu_cores != null
        ? `${currentSpecs.cpu_cores} ליבות → ${total} פינים (${Math.ceil(total / 2)}/${Math.floor(total / 2)})`
        : '';
    } else {
      const total = pinTotalFor(currentSpecs.ram_total_gb, 4);
      pinValue.textContent = currentSpecs.ram_total_gb != null
        ? `${currentSpecs.ram_total_gb}GB → ${total} פינים (${Math.ceil(total / 2)}/${Math.floor(total / 2)})`
        : '';
    }
  }

  function api() {
    return (window.pywebview && window.pywebview.api) || null;
  }

  function setActiveMode(mode) {
    modeButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }

  function seed(cfg) {
    cfg = cfg || {};
    const margin = parseInt(cfg.margin, 10);
    const size   = parseInt(cfg.size, 10) || 100;
    marginSlider.value = isNaN(margin) ? 46 : margin;
    marginValue.textContent = marginSlider.value + 'px';
    sizeSlider.value = size;
    sizeValue.textContent = size + '%';
    setActiveMode(cfg.position || 'taskbar');
    // "split" is the default everywhere, including a config that has never
    // been written - so an unset/unknown value must land on split, not lock.
    const sessionMode = cfg.session_mode === 'lock' ? 'lock' : 'split';
    sessionButtons.forEach(b => b.classList.toggle('active', b.dataset.sessionMode === sessionMode));
    sessionRow.hidden = cfg.pet !== 'claude';
    // null (task not registered) hides the row - nothing to toggle.
    refreshRow.hidden = cfg.usage_refresh === null || cfg.usage_refresh === undefined;
    setRefresh(cfg.usage_refresh ? '1' : '0');
    gaugeRow.hidden = cfg.pet !== 'system';
    gaugeLeftSelect.value = cfg.gauge_left || 'cpu';
    gaugeRightSelect.value = cfg.gauge_right || 'ram';
    graphRow.hidden = cfg.pet !== 'system';
    graphSelect.value = cfg.graph_metric || 'cpu';
    blinkRow.hidden = cfg.pet !== 'system';
    blinkLeftSelect.value = cfg.blink_metric_left || 'cpu';
    blinkRightSelect.value = cfg.blink_metric_right || 'cpu';
    pinRow.hidden = cfg.pet !== 'system';
    pinSelect.value = cfg.pin_metric || 'ram';
    currentSpecs = { ram_total_gb: cfg.ram_total_gb, cpu_cores: cfg.cpu_cores };
    updatePinValue();
    speedRow.hidden = cfg.pet !== 'system';
    setSpeedUnit(cfg.speed_unit || 'MB');
  }

  // pywebview injects the api asynchronously; wait for it, then load config.
  window.addEventListener('pywebviewready', () => {
    if (api() && api().get_pet_config) api().get_pet_config().then(seed);
  });

  let throttle = null;
  marginSlider.addEventListener('input', () => {
    const m = parseInt(marginSlider.value, 10);
    marginValue.textContent = m + 'px';
    setActiveMode('custom');
    if (throttle) return;
    throttle = setTimeout(() => {
      if (api() && api().set_margin) api().set_margin(m);
      throttle = null;
    }, 40);
  });

  sizeSlider.addEventListener('input', () => {
    const pct = parseInt(sizeSlider.value, 10);
    sizeValue.textContent = pct + '%';
    if (api() && api().set_size) api().set_size(pct);
  });

  modeButtons.forEach(b => b.addEventListener('click', () => {
    setActiveMode(b.dataset.mode);
    if (api() && api().set_position) {
      api().set_position(b.dataset.mode).then((margin) => {
        if (typeof margin === 'number') {
          marginSlider.value = margin;
          marginValue.textContent = margin + 'px';
        }
      });
    }
  }));

  function setRefresh(v) {
    refreshButtons.forEach(b => b.classList.toggle('active', b.dataset.refresh === v));
  }

  refreshButtons.forEach(b => b.addEventListener('click', () => {
    setRefresh(b.dataset.refresh);
    if (api() && api().set_usage_refresh) {
      // Re-sync from what the task actually reports: enabling can fail
      // (task removed, policy), and the buttons must not lie about it.
      api().set_usage_refresh(b.dataset.refresh === '1')
           .then(on => setRefresh(on ? '1' : '0'));
    }
  }));

  sessionButtons.forEach(b => b.addEventListener('click', () => {
    sessionButtons.forEach(o => o.classList.toggle('active', o === b));
    if (api() && api().set_session_mode) api().set_session_mode(b.dataset.sessionMode);
  }));

  saveBtn.addEventListener('click', () => {
    if (api() && api().close_settings) api().close_settings();
  });
</script>
</body>
</html>
