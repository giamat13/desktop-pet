<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bambu Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: transparent;
  }

  #petWrap {
    transition: transform 0.2s ease-out;
    transform-origin: center bottom;
    transform: scale(var(--pet-scale, 1));
    position: relative;
  }

  svg#bambuPetSvg {
    width: 300px;
    height: 420px;
    overflow: visible;
    cursor: pointer;
  }

  /* Soft drop shadow so the printer reads against any wallpaper. */
  #printer-hit { filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.35)); }

  /* ================= shadow + idle motion ================= */
  #shadow {
    transform-origin: 150px 236px;
    animation: shadowIdle 3.4s ease-in-out infinite;
  }
  #shadow.jump { animation: shadowHop 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes shadowIdle {
    0%, 100% { transform: scaleX(1);    opacity: 0.32; }
    50%      { transform: scaleX(0.94); opacity: 0.26; }
  }
  @keyframes shadowHop {
    0%   { transform: scaleX(1);    opacity: 0.35; }
    30%  { transform: scaleX(0.55); opacity: 0.14; }
    100% { transform: scaleX(1);    opacity: 0.35; }
  }

  #printer-root {
    transform-origin: 150px 236px;
    animation: idleSway 3.4s ease-in-out infinite;
  }
  #printer-root.jump { animation: hopOnce 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes idleSway {
    0%, 100% { transform: translateY(0)    rotate(0deg); }
    50%      { transform: translateY(-3px) rotate(0.8deg); }
  }
  @keyframes hopOnce {
    0%   { transform: translateY(0)     scale(1, 1)      rotate(0deg); }
    14%  { transform: translateY(2px)   scale(1.07, 0.9) rotate(0deg); }
    45%  { transform: translateY(-58px) scale(0.94, 1.08) rotate(-3deg); }
    72%  { transform: translateY(0)     scale(1.1, 0.88) rotate(3deg); }
    86%  { transform: translateY(-5px)  scale(0.98, 1.03) rotate(-1deg); }
    100% { transform: translateY(0)     scale(1, 1)      rotate(0deg); }
  }

  #screenPercent {
    font: 700 18px "Segoe UI", system-ui, sans-serif;
    text-anchor: middle;
    fill: #70efb6;
  }
  .controlButton { cursor: pointer; }
  .controlButton .btnBg { fill: #202733; stroke: #738096; stroke-width: 1; transition: fill 0.15s, stroke 0.15s; }
  .controlButton .btnIcon { fill: #e7ebf2; stroke: #e7ebf2; stroke-width: 0.8; stroke-linejoin: round; pointer-events: none; }
  .controlButton:hover .btnBg { fill: #354154; stroke: #9ba7be; }
  .controlButton:focus-visible .btnBg { stroke: #ffc45c; }
  .controlButton .resumeIcon { display: none; }

  /* Speed control styles */
  #speedControl {
    outline: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .speedTrackBg {
    fill: #141824;
    stroke: #3c4556;
    stroke-width: 0.8;
  }
  .speedTrackFill {
    fill: #70efb6;
    transition: width 0.12s ease-out, fill 0.2s ease-out;
  }
  .speedNotch {
    fill: #4c566b;
    stroke: #141824;
    stroke-width: 0.8;
    cursor: pointer;
    transition: fill 0.2s, r 0.15s;
    pointer-events: none;
  }
  .speedNotch.active {
    fill: #70efb6;
  }
  #speedThumb {
    cursor: pointer;
    pointer-events: none;
    transition: transform 0.14s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  #speedThumb.dragging {
    transition: none;
  }
  #speedThumb .thumbGlow {
    fill: #70efb6;
    opacity: 0.28;
    transition: fill 0.2s, opacity 0.2s, r 0.15s;
  }
  #speedThumb .thumbBody {
    fill: #161c26;
    stroke: #70efb6;
    stroke-width: 1.8;
    transition: stroke 0.2s;
  }
  #speedThumb .thumbDot {
    fill: #70efb6;
    transition: fill 0.2s;
  }
  #speedControl:hover #speedThumb .thumbGlow {
    opacity: 0.55;
    r: 8.5;
  }
  #speedControl:focus-visible #speedThumb .thumbBody {
    stroke: #ffd27a;
    stroke-width: 2.2;
  }
  #speedControl[data-level="1"] .speedTrackFill,
  #speedControl[data-level="1"] .speedNotch.active,
  #speedControl[data-level="1"] #speedThumb .thumbBody,
  #speedControl[data-level="1"] #speedThumb .thumbDot { stroke: #60cdff; fill: #60cdff; }
  #speedControl[data-level="1"] #speedThumb .thumbGlow { fill: #60cdff; }
  #speedControl[data-level="1"] #speedThumb .thumbBody { fill: #161c26; }

  #speedControl[data-level="2"] .speedTrackFill,
  #speedControl[data-level="2"] .speedNotch.active,
  #speedControl[data-level="2"] #speedThumb .thumbBody,
  #speedControl[data-level="2"] #speedThumb .thumbDot { stroke: #70efb6; fill: #70efb6; }
  #speedControl[data-level="2"] #speedThumb .thumbGlow { fill: #70efb6; }
  #speedControl[data-level="2"] #speedThumb .thumbBody { fill: #161c26; }

  #speedControl[data-level="3"] .speedTrackFill,
  #speedControl[data-level="3"] .speedNotch.active,
  #speedControl[data-level="3"] #speedThumb .thumbBody,
  #speedControl[data-level="3"] #speedThumb .thumbDot { stroke: #ffd27a; fill: #ffd27a; }
  #speedControl[data-level="3"] #speedThumb .thumbGlow { fill: #ffd27a; }
  #speedControl[data-level="3"] #speedThumb .thumbBody { fill: #161c26; }

  #speedControl[data-level="4"] .speedTrackFill,
  #speedControl[data-level="4"] .speedNotch.active,
  #speedControl[data-level="4"] #speedThumb .thumbBody,
  #speedControl[data-level="4"] #speedThumb .thumbDot { stroke: #ff8b96; fill: #ff8b96; }
  #speedControl[data-level="4"] #speedThumb .thumbGlow { fill: #ff8b96; }
  #speedControl[data-level="4"] #speedThumb .thumbBody { fill: #161c26; }

  #speedValueText {
    font: 700 8.5px "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.3px;
    transition: fill 0.2s ease-out;
    pointer-events: none;
  }
  #speedTitle {
    font: 700 7px "Segoe UI", system-ui, sans-serif;
    fill: #828b9c;
    letter-spacing: 0.6px;
    pointer-events: none;
  }
  .speedTickText {
    font: 700 6px "Segoe UI", system-ui, sans-serif;
    fill: #616b7e;
    text-anchor: middle;
    pointer-events: none;
  }
  .lightToggle { cursor: pointer; }
  .lightToggle rect { fill: #121720; stroke: #828b9c; stroke-width: 1.2; }
  .lightToggle:hover rect { fill: #252c3a; }
  .lightToggle .bulb { fill: none; stroke: #c9cfdd; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
  .lightToggle.on rect { stroke: #ffc45c; }
  .lightToggle.on .bulb { fill: #ffc45c; stroke: #ffc45c; }
  #sleepZzz { display: none; fill: #8dd5ff; font: 700 11px "Segoe UI", sans-serif; }
  #bambuPetSvg.sleeping #sleepZzz { display: inline; }
  #bambuPetSvg.sleeping .eye-idle { display: none; }
  #bambuPetSvg.sleeping .eye-sleep { display: inline; }
  #bambuPetSvg.sleeping .eye-open { display: none; }
  .eye-sleep { display: none; }

  .timeBadge { display: none; }
  .timeBadge.visible { display: inline; }
  .timeBadge rect {
    fill: #171b24;
    stroke-width: 1.5;
  }
  .timeBadge text {
    text-anchor: middle;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .timeBadge .timeLabel {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.6px;
  }
  .timeBadge .timeValue {
    font-size: 10px;
    font-weight: 700;
  }
  #elapsedBadge rect { stroke: #8dd5ff; }
  #elapsedBadge text { fill: #8dd5ff; }
  #remainingBadge rect { stroke: #7ff0bb; }
  #remainingBadge text { fill: #7ff0bb; }

  /* Temperature gauges: always visible round dials, filled by temp / target. */
  .temperatureGauge { display: inline; }
  .temperatureGauge .gaugeBack {
    fill: #171b24;
    stroke: #46505e;
    stroke-width: 1;
  }
  .temperatureGauge .gaugeTrack {
    fill: none;
    stroke: #0c1017;
    stroke-width: 4;
  }
  .temperatureGauge .gaugeFill {
    fill: none;
    stroke-width: 4;
    transition: stroke-dasharray 0.4s ease-out;
  }
  .temperatureGauge .gaugeLabel {
    text-anchor: middle;
    font: 700 5.5px "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.3px;
  }
  #nozzleBadge .gaugeFill { stroke: #ffc45c; }
  #nozzleBadge .gaugeLabel { fill: #ffc45c; }
  #bedBadge .gaugeFill { stroke: #8dd5ff; }
  #bedBadge .gaugeLabel { fill: #8dd5ff; }

  #firstLayerIndicator, #layerBadge { display: none; }
  #firstLayerIndicator.visible, #layerBadge.visible { display: inline; }
  #wifiIndicator { display: none; }
  #wifiIndicator.visible { display: inline; }
  #wifiIndicator .wifiBack {
    fill: #171b24;
    stroke: #505a6b;
    stroke-width: 1;
  }
  #wifiIndicator .wifiArc {
    fill: none;
    stroke: #414958;
    stroke-linecap: round;
    stroke-width: 2.5;
  }
  #wifiIndicator .wifiDot { fill: #414958; }
  #wifiIndicator[data-level="1"] .wifiInner { stroke: #ff8b76; }
  #wifiIndicator[data-level="1"] .wifiDot { fill: #ff8b76; }
  #wifiIndicator[data-level="2"] .wifiMiddle,
  #wifiIndicator[data-level="2"] .wifiInner { stroke: #ffd27a; }
  #wifiIndicator[data-level="2"] .wifiDot { fill: #ffd27a; }
  #wifiIndicator[data-level="3"] .wifiArc { stroke: #70efb6; }
  #wifiIndicator[data-level="3"] .wifiDot { fill: #70efb6; }
  #layerBadge text {
    fill: #ffc45c;
    font: 700 11px "Segoe UI", system-ui, sans-serif;
    text-anchor: middle;
  }

  #statusBadge {
    pointer-events: none;
  }
  #statusBadge rect {
    fill: #242934;
    stroke: #9ba3b4;
  }
  #statusBadge text {
    fill: #d3dae7;
    font: 700 8.5px "Segoe UI", system-ui, sans-serif;
  }
  #statusBadge circle {
    fill: #9ba3b4;
    animation: statusBlink 1.25s ease-in-out infinite;
  }
  #statusBadge[data-mood="run"] rect { fill: #124a39; stroke: #7ff0bb; }
  #statusBadge[data-mood="run"] text, #statusBadge[data-mood="run"] circle { fill: #7ff0bb; }
  #statusBadge[data-mood="pause"] rect { fill: #5d3e12; stroke: #ffd27a; }
  #statusBadge[data-mood="pause"] text, #statusBadge[data-mood="pause"] circle { fill: #ffd27a; }
  #statusBadge[data-mood="done"] rect { fill: #18415b; stroke: #8dd5ff; }
  #statusBadge[data-mood="done"] text, #statusBadge[data-mood="done"] circle { fill: #8dd5ff; }
  #statusBadge[data-mood="fail"], #statusBadge[data-mood="offline"] {
    color: #ff8b96;
  }
  #statusBadge[data-mood="fail"] rect, #statusBadge[data-mood="offline"] rect {
    fill: #64222b;
    stroke: #ff8b96;
  }
  #statusBadge[data-mood="fail"] text, #statusBadge[data-mood="fail"] circle,
  #statusBadge[data-mood="offline"] text, #statusBadge[data-mood="offline"] circle {
    fill: #ff8b96;
  }
  @keyframes statusBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* ================= printer face ================= */
  .eye-open {
    transform-origin: 150px 137px;
    animation: blink 4.2s ease-in-out infinite;
  }
  .eye-happy, .eye-pause, .eye-fail, .eye-idle { display: none; }
  .eye-near-finish { display: none; }
  #bambuPetSvg[data-mood="done"] .eye-open,
  #bambuPetSvg[data-mood="pause"] .eye-open,
  #bambuPetSvg[data-mood="fail"] .eye-open,
  #bambuPetSvg[data-mood="idle"] .eye-open { display: none; }
  #bambuPetSvg[data-mood="done"] .eye-happy,
  #bambuPetSvg[data-mood="pause"] .eye-pause,
  #bambuPetSvg[data-mood="fail"] .eye-fail,
  #bambuPetSvg[data-mood="idle"] .eye-idle { display: inline; }
  #bambuPetSvg[data-expression="near-finish"] .eye-open { display: none; }
  #bambuPetSvg[data-expression="near-finish"] .eye-near-finish { display: inline; }
  #bambuPetSvg.milestone-blink .eye-open {
    animation: milestoneBlink 380ms ease-in-out;
  }
  #mouth path, #mouth ellipse {
    display: none;
    fill: none;
    stroke: #70efb6;
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #bambuPetSvg[data-expression="happy"] #mouthSmile,
  #bambuPetSvg[data-expression="excited"] #mouthGrin,
  #bambuPetSvg[data-expression="near-finish"] #mouthGrin,
  #bambuPetSvg[data-expression="focused"] #mouthO,
  #bambuPetSvg[data-expression="worried"] #mouthWorried,
  #bambuPetSvg[data-expression="sad"] #mouthSad,
  #bambuPetSvg[data-expression="flat"] #mouthFlat,
  #bambuPetSvg[data-expression="neutral"] #mouthNeutral { display: inline; }
  #bambuPetSvg[data-expression="worried"] #mouth path,
  #bambuPetSvg[data-expression="sad"] #mouth path { stroke: #ff8b96; }
  #bambuPetSvg[data-expression="flat"] #mouth path,
  #bambuPetSvg[data-expression="neutral"] #mouth path { stroke: #9ba3b4; }
  #face, #mouth {
    transform-box: fill-box;
    transform-origin: center;
  }
  #bambuPetSvg.state-change #face,
  #bambuPetSvg.state-change #mouth {
    animation: stateReaction 620ms cubic-bezier(.2,.8,.25,1);
  }
  #bambuPetSvg.finish-reaction #face,
  #bambuPetSvg.finish-reaction #mouth {
    animation: finishReaction 900ms cubic-bezier(.2,.8,.25,1);
  }
  #printer-root.progress-hop {
    animation: progressHop 480ms cubic-bezier(.2,.8,.25,1);
  }
  #printer-root.layer-hop {
    animation: layerHop 620ms cubic-bezier(.2,.8,.25,1);
  }
  #shadow.progress-hop, #shadow.layer-hop {
    animation: progressShadow 480ms ease-out;
  }
  @keyframes stateReaction {
    0% { transform: translateY(0) scale(1); }
    38% { transform: translateY(-3px) scale(1.16); }
    72% { transform: translateY(1px) scale(0.96); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes finishReaction {
    0%, 100% { transform: translateY(0) scale(1); }
    24% { transform: translateY(-5px) scale(1.2); }
    48% { transform: translateY(0) scale(0.96); }
    72% { transform: translateY(-3px) scale(1.12); }
  }
  @keyframes progressHop {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    35% { transform: translateY(-7px) scale(0.98, 1.03); }
    68% { transform: translateY(0) scale(1.03, 0.97); }
  }
  @keyframes layerHop {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    28% { transform: translateY(-17px) scale(0.96, 1.08); }
    57% { transform: translateY(0) scale(1.08, 0.9); }
    78% { transform: translateY(-5px) scale(0.99, 1.02); }
  }
  @keyframes progressShadow {
    0%, 100% { transform: scaleX(1); opacity: 0.32; }
    35% { transform: scaleX(0.82); opacity: 0.2; }
    68% { transform: scaleX(1.06); opacity: 0.36; }
  }
  @keyframes milestoneBlink {
    0%, 100% { transform: scaleY(1); }
    35%, 65% { transform: scaleY(0.08); }
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.05); }
    97%           { transform: scaleY(1); }
  }

</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="petWrap">
    <svg id="bambuPetSvg" viewBox="0 -160 300 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#4a4f62"/>
          <stop offset="45%"  stop-color="#2c303c"/>
          <stop offset="100%" stop-color="#16181e"/>
        </linearGradient>
        <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#6d7388"/>
          <stop offset="100%" stop-color="#3a3e4d"/>
        </linearGradient>
        <linearGradient id="railGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#c3c8d5"/>
          <stop offset="100%" stop-color="#5b6070"/>
        </linearGradient>
        <linearGradient id="footGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#2c303c"/>
          <stop offset="100%" stop-color="#101217"/>
        </linearGradient>
        <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#0b0d12"/>
          <stop offset="100%" stop-color="#1e222c"/>
        </linearGradient>
        <radialGradient id="eyeGrad" cx="50%" cy="40%" r="60%">
          <stop offset="0%"   stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#c9cfdd"/>
        </radialGradient>
        <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#000000" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
          <rect width="4" height="2" fill="#ffffff" fill-opacity="0.045"/>
        </pattern>
      </defs>

      <!-- ground shadow -->
      <ellipse id="shadow" cx="150" cy="236" rx="66" ry="12" fill="url(#shadowGrad)"/>

      <g id="printer-root">
        <g id="cameraMonitor" aria-label="Printer camera monitor" visibility="hidden">
          <rect x="64" y="-160" width="172" height="112" rx="10" fill="#121720" stroke="#828b9c" stroke-width="2"/>
          <rect x="70" y="-154" width="160" height="94" rx="5" fill="#070a0f" stroke="#333b49" stroke-width="1"/>
          <image id="cameraFrame" x="71" y="-153" width="158" height="92" preserveAspectRatio="xMidYMid slice" visibility="hidden"/>
          <g id="cameraPlaceholder">
            <path d="M136 -120 L145 -127 H156 L165 -120 V-104 H136 Z" fill="none" stroke="#7f8999" stroke-width="2.5" stroke-linejoin="round"/>
            <circle cx="150.5" cy="-115.5" r="5" fill="none" stroke="#7f8999" stroke-width="2.5"/>
            <text id="cameraPlaceholderText" x="150" y="-89" text-anchor="middle" fill="#9ba3b4" font-family="Segoe UI, sans-serif" font-size="7" font-weight="700" letter-spacing="0.8">CAMERA NOT CONFIGURED</text>
          </g>
          <circle cx="150" cy="-157" r="1.5" fill="#70efb6"/>
          <g id="lightButton" class="lightToggle" role="button" tabindex="0" aria-label="Toggle chamber light" aria-pressed="false">
            <title id="lightButtonTitle">Chamber light: off</title>
            <rect x="200" y="-150" width="26" height="20" rx="6"/>
            <circle class="bulb" cx="213" cy="-142" r="4.2"/>
            <path class="bulb" d="M210.8 -137.4 H215.2 V-134.4 H210.8 Z"/>
            <path class="bulb" d="M211.6 -132.6 H214.4"/>
          </g>
          <rect x="139" y="-48" width="22" height="78" rx="4" fill="url(#railGrad)" stroke="#343a48" stroke-width="1"/>
          <rect x="125" y="27" width="50" height="8" rx="4" fill="url(#lidGrad)" stroke="#343a48" stroke-width="1"/>
        </g>
        <g id="cameraToggle" role="button" tabindex="0" aria-label="Open camera screen"
           aria-hidden="true" visibility="hidden" style="cursor:pointer">
          <rect x="108" y="40" width="84" height="20" rx="10" fill="#121720" stroke="#828b9c" stroke-width="1.5"/>
          <circle id="cameraToggleLight" cx="118" cy="50" r="2.5" fill="#70efb6"/>
          <text id="cameraToggleText" x="152" y="53" text-anchor="middle" fill="#e7ebf2" font-family="Segoe UI, sans-serif" font-size="7" font-weight="700" letter-spacing="0.35">OPEN CAMERA</text>
        </g>
        <g id="printer-hit">
          <!-- feet -->
          <rect x="110" y="210" width="24" height="39" rx="9" fill="url(#footGrad)" stroke="#0b0c10" stroke-width="1.5"/>
          <rect x="166" y="210" width="24" height="39" rx="9" fill="url(#footGrad)" stroke="#0b0c10" stroke-width="1.5"/>

          <!-- enclosure -->
          <rect x="56" y="70" width="188" height="152" rx="18" fill="url(#bodyGrad)" stroke="#5b6070" stroke-width="2"/>
          <!-- top lid: a lighter band, so the printer reads as a box with a top -->
          <rect x="58" y="72" width="184" height="22" rx="14" fill="url(#lidGrad)" opacity="0.9"/>
          <g id="statusBadge" data-mood="idle" role="status" aria-live="polite">
            <rect x="146" y="73" width="80" height="14" rx="7"/>
            <circle cx="154" cy="80" r="2.7"/>
            <text id="statusText" x="163" y="83">Connecting</text>
          </g>
          <!-- print controls moved to top lid next to status badge -->
          <!-- inner bevel -->
          <rect x="60" y="74" width="180" height="144" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
          <!-- side vents -->
          <g fill="#0b0d12" opacity="0.7">
            <rect x="63" y="128" width="6" height="4" rx="2"/>
            <rect x="63" y="136" width="6" height="4" rx="2"/>
            <rect x="63" y="144" width="6" height="4" rx="2"/>
            <rect x="231" y="128" width="6" height="4" rx="2"/>
            <rect x="231" y="136" width="6" height="4" rx="2"/>
            <rect x="231" y="144" width="6" height="4" rx="2"/>
          </g>
          <g id="firstLayerIndicator" aria-label="First layer in progress">
            <rect x="70" y="157" width="9" height="29" rx="4.5" fill="#171b24" stroke="#8a6030" stroke-width="1"/>
            <path d="M72.5 163 H76.5" stroke="#ffc45c" stroke-width="2" stroke-linecap="round"/>
            <path d="M72.5 170 H76.5" stroke="#9b7138" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M72.5 177 H76.5" stroke="#705632" stroke-width="1.5" stroke-linecap="round"/>
          </g>
          <!-- gantry: two end posts and the rail the nozzle travels along -->
          <rect x="60" y="82" width="10" height="18" rx="3" fill="#23262f"/>
          <rect x="230" y="82" width="10" height="18" rx="3" fill="#23262f"/>
          <rect x="66" y="88" width="168" height="6" rx="3" fill="url(#railGrad)"/>
          <g id="wifiIndicator" aria-label="Wi-Fi signal strength">
            <rect class="wifiBack" x="61" y="72" width="34" height="23" rx="7"/>
            <path class="wifiArc wifiOuter" d="M66 81 Q78 69 90 81"/>
            <path class="wifiArc wifiMiddle" d="M70 84 Q78 76 86 84"/>
            <path class="wifiArc wifiInner" d="M74 87 Q78 83 82 87"/>
            <circle class="wifiDot" cx="78" cy="90" r="2"/>

          <!-- nozzle head -->
          <g id="head">
            <rect x="138" y="90" width="24" height="18" rx="4" fill="#9aa0ae"/>
            <rect x="140" y="91" width="20" height="3" rx="1.5" fill="#dfe3ec" opacity="0.7"/>
            <rect x="146" y="108" width="8" height="9" rx="2" fill="#c9ccd6"/>
            <path d="M146.5 117 L153.5 117 L150 123 Z" fill="#f5c542"/>
          </g>

          <!-- the face is the printer's display -->
          <rect x="82" y="119" width="136" height="78" rx="14" fill="#15171e" stroke="#3a3e4b" stroke-width="1.5"/>
          <rect x="84" y="121" width="132" height="74" rx="12" fill="url(#screenGrad)"/>
          <rect x="84" y="121" width="132" height="74" rx="12" fill="url(#scanlines)"/>
          <g id="face">
            <g class="eye-open">
              <ellipse cx="120" cy="137" rx="9" ry="10" fill="url(#eyeGrad)"/>
              <ellipse cx="180" cy="137" rx="9" ry="10" fill="url(#eyeGrad)"/>
              <g id="pupils">
                <circle id="pupilL" cx="121" cy="134" r="4" fill="#16171b"/>
                <circle id="pupilR" cx="181" cy="134" r="4" fill="#16171b"/>
              </g>
            </g>
            <g class="eye-near-finish">
              <ellipse cx="120" cy="136" rx="10" ry="11" fill="url(#eyeGrad)"/>
              <ellipse cx="180" cy="136" rx="10" ry="11" fill="url(#eyeGrad)"/>
              <circle cx="121" cy="133" r="4" fill="#16171b"/>
              <circle cx="181" cy="133" r="4" fill="#16171b"/>
            </g>
            <g class="eye-happy" fill="none" stroke="#70efb6" stroke-width="4" stroke-linecap="round">
              <path d="M110 139 Q120 128 130 139"/>
              <path d="M170 139 Q180 128 190 139"/>
            </g>
            <g class="eye-pause" fill="none" stroke="#ffd27a" stroke-width="4" stroke-linecap="round">
              <path d="M111 138 Q120 146 129 138"/>
              <path d="M171 138 Q180 146 189 138"/>
            </g>
            <g class="eye-fail" fill="none" stroke="#ff6b78" stroke-width="4" stroke-linecap="round">
              <path d="M114 132 L126 144 M126 132 L114 144"/>
              <path d="M174 132 L186 144 M186 132 L174 144"/>
            </g>
            <g class="eye-idle" fill="none" stroke="#9ba3b4" stroke-width="4" stroke-linecap="round">
              <path d="M110 138 L130 138"/>
              <path d="M170 138 L190 138"/>
            </g>
            <g class="eye-sleep" fill="none" stroke="#8dd5ff" stroke-width="4" stroke-linecap="round"><path d="M110 138 Q120 146 130 138"/><path d="M170 138 Q180 146 190 138"/></g>
          </g>
          <text id="sleepZzz" x="196" y="130">Zzz</text>
          <g id="mouth" aria-hidden="true">
            <path id="mouthSmile" d="M141 177 Q150 184 159 177"/>
            <path id="mouthGrin" d="M140 177 Q150 185 160 177"/>
            <ellipse id="mouthO" cx="150" cy="179.5" rx="3" ry="3.5"/>
            <path id="mouthWorried" d="M141 181 Q150 174 159 181"/>
            <path id="mouthSad" d="M141 182 Q150 174 159 182"/>
            <path id="mouthFlat" d="M142 179 H158"/>
            <path id="mouthNeutral" d="M143 179 Q150 181 157 179"/>
          </g>

          <text id="screenPercent" x="150" y="169">--%</text>
          <!-- print speed slider on front panel under screen -->
          <g id="speedControl" role="img" aria-label="Print speed, read only" aria-valuetext="Standard (100%)" data-level="2">
            <text id="speedTitle" x="84" y="204">SPEED</text>
            <text id="speedValueText" x="216" y="204" text-anchor="end" fill="#70efb6">STANDARD · 100%</text>

            <rect class="speedTrackBg" x="84" y="209" width="132" height="3" rx="1.5"/>
            <rect id="speedTrackFill" class="speedTrackFill" x="84" y="209" width="45" height="3" rx="1.5"/>

            <circle class="speedNotch" data-level="1" cx="86" cy="210.5" r="2.2">
              <title>Silent (50%)</title>
            </circle>
            <circle class="speedNotch active" data-level="2" cx="129" cy="210.5" r="2.2">
              <title>Standard (100%)</title>
            </circle>
            <circle class="speedNotch" data-level="3" cx="171" cy="210.5" r="2.2">
              <title>Sport (124%)</title>
            </circle>
            <circle class="speedNotch" data-level="4" cx="214" cy="210.5" r="2.2">
              <title>Ludicrous (166%)</title>
            </circle>

            <text class="speedTickText" x="86" y="219">50%</text>
            <text class="speedTickText" x="129" y="219">100%</text>
            <text class="speedTickText" x="171" y="219">124%</text>
            <text class="speedTickText" x="214" y="219">166%</text>

            <g id="speedThumb" transform="translate(129 210.5)">
              <circle class="thumbGlow" r="7"/>
              <circle class="thumbBody" r="4.6"/>
              <circle class="thumbDot" r="1.8"/>

          </g>
        </g>
        <g id="layerBadge" aria-label="Layer progress">
          <rect x="68" y="111" width="12" height="94" rx="6" fill="#11151d" stroke="#705632" stroke-width="1"/>
          <rect id="layerFill" x="71" y="203" width="6" height="2" rx="3" fill="#ffc45c"/>
          <rect x="53" y="206" width="42" height="14" rx="4" fill="#171b24" stroke="#705632" stroke-width="0.8"/>
          <text id="layerCount" x="74" y="217">18/240</text>
        </g>
        <g id="elapsedBadge" class="timeBadge" aria-label="Estimated elapsed print time">
          <rect x="-26" y="145" width="82" height="42" rx="9"/>
          <text class="timeLabel" x="15" y="160">ELAPSED</text>
          <text id="elapsedText" class="timeValue" x="15" y="178">--</text>
        </g>
        <g id="remainingBadge" class="timeBadge" aria-label="Estimated time remaining">
          <rect x="244" y="145" width="82" height="42" rx="9"/>
          <text class="timeLabel" x="285" y="160">REMAINING</text>
          <text id="remainingText" class="timeValue" x="285" y="178">--</text>
        </g>
        <g id="nozzleBadge" class="temperatureGauge" role="img" aria-label="Nozzle temperature gauge">
          <circle class="gaugeBack" cx="22" cy="120" r="22"/>
          <circle class="gaugeTrack" cx="22" cy="120" r="18" stroke-dasharray="84.82 113.10" transform="rotate(135 22 120)"/>
          <circle id="nozzleFill" class="gaugeFill" cx="22" cy="120" r="18" stroke-dasharray="0 113.10" transform="rotate(135 22 120)"/>
          <text class="gaugeLabel" x="22" y="122.5">NOZZLE</text>
        </g>
        <g id="bedBadge" class="temperatureGauge" role="img" aria-label="Bed temperature gauge">
          <circle class="gaugeBack" cx="278" cy="120" r="22"/>
          <circle class="gaugeTrack" cx="278" cy="120" r="18" stroke-dasharray="84.82 113.10" transform="rotate(135 278 120)"/>
          <circle id="bedFill" class="gaugeFill" cx="278" cy="120" r="18" stroke-dasharray="0 113.10" transform="rotate(135 278 120)"/>
          <text class="gaugeLabel" x="278" y="122.5">BED</text>
        </g>
      </g>
    </svg>
  </div>
</div>

<script>
  const svg         = document.getElementById('bambuPetSvg');
  const petWrap     = document.getElementById('petWrap');
  const printerRoot = document.getElementById('printer-root');
  const printHead   = document.getElementById('head');
  const shadow      = document.getElementById('shadow');
  const screenPercent = document.getElementById('screenPercent');
  const cameraFrame = document.getElementById('cameraFrame');
  const cameraMonitor = document.getElementById('cameraMonitor');
  const cameraToggle = document.getElementById('cameraToggle');
  const cameraToggleText = document.getElementById('cameraToggleText');
  let cameraMonitorOpen = false;
  let cameraToggleAvailable = false;
  const cameraPlaceholder = document.getElementById('cameraPlaceholder');
  const cameraPlaceholderText = document.getElementById('cameraPlaceholderText');
  const statusBadge = document.getElementById('statusBadge');
  const statusText  = document.getElementById('statusText');
  const elapsedBadge = document.getElementById('elapsedBadge');
  const elapsedText = document.getElementById('elapsedText');
  const remainingBadge = document.getElementById('remainingBadge');
  const remainingText = document.getElementById('remainingText');
  const nozzleFill = document.getElementById('nozzleFill');
  const bedFill = document.getElementById('bedFill');
  const firstLayerIndicator = document.getElementById('firstLayerIndicator');
  const wifiIndicator = document.getElementById('wifiIndicator');
  const layerBadge = document.getElementById('layerBadge');
  const layerCount = document.getElementById('layerCount');
  const layerFill = document.getElementById('layerFill');
  let previousStateKey = null;
  let stateReactionTimer = null;
  let previousMood = null;
  let previousPercent = null;
  let previousLayer = null;
  let progressHopTimer = null;
  let milestoneBlinkTimer = null;
  let cameraLastUpdated = null;
  let cameraPollInFlight = false;
  let currentMood = 'idle';
  let chamberLightOn = false;

  function applyPetScale(pct) {
    petWrap.style.setProperty('--pet-scale', (parseInt(pct, 10) / 100 || 1).toString());
  }

  function formatDuration(minutes) {
    const total = Math.max(0, Math.round(Number(minutes)));
    if (!Number.isFinite(total)) return '--';
    const hours = Math.floor(total / 60);
    const mins = total % 60;
    return hours ? `${hours}h ${mins}m` : `${mins}m`;
  }

  function displayValue(value) {
    return String(value).replace(/67/g, '6*');
  }

  // Gauge arc: r=18, 270 degrees of the circle (a 90 degree gap at the bottom).
  const GAUGE_CIRC = 2 * Math.PI * 18;
  const GAUGE_ARC = GAUGE_CIRC * 0.75;
  function setGauge(fillEl, temp, target) {
    const t = Number(temp);
    const g = Number(target);
    const frac = Number.isFinite(t) && Number.isFinite(g) && g > 0
      ? Math.max(0, Math.min(1, t / g))
      : 0;
    fillEl.setAttribute('stroke-dasharray', `${(frac * GAUGE_ARC).toFixed(2)} ${GAUGE_CIRC.toFixed(2)}`);
  }

  function render(s) {
    const percent = s && s.configured && s.has_data ? Number(s.percent) : NaN;
    screenPercent.textContent = displayValue(Number.isFinite(percent)
      ? `${percent}%`
      : '--%');
    const headProgress = Number.isFinite(percent) ? Math.max(0, Math.min(100, percent)) : 50;
    printHead.setAttribute('transform', `translate(${headProgress * 1.44 - 72} 0)`);

    let mood = 'idle';
    let label = 'Not configured';
    if (s && s.configured) {
      if (!s.connected) {
        mood = 'offline';
        label = 'Offline';
      } else if (!s.has_data) {
        label = 'Connecting';
      } else if (s.warming) {
        mood = s.mood || 'run';
        label = 'Warming up';
      } else {
        mood = s.mood || 'idle';
        label = ({
          run: 'Printing',
          pause: 'Paused',
          done: 'Finished',
          fail: 'Error',
          idle: 'Idle'
        })[mood] || 'Idle';
      }
    }
    statusBadge.dataset.mood = mood;
    currentMood = mood;
    svg.classList.toggle('sleeping', !!(s && s.sleeping));
    svg.dataset.mood = ['run', 'pause', 'done', 'fail', 'idle'].includes(mood) ? mood : 'idle';
    statusText.textContent = displayValue(label);
    let expression = 'neutral';
    if (!s || !s.configured || !s.connected || !s.has_data) {
      expression = 'worried';
    } else if (mood === 'fail' || mood === 'offline') {
      expression = 'sad';
    } else if (mood === 'done') {
      expression = 'excited';
    } else if (mood === 'pause') {
      expression = 'flat';
    } else if (s.warming) {
      expression = 'focused';
    } else if (mood === 'run' && percent >= 90) {
      expression = 'near-finish';
    } else if (mood === 'run') {
      expression = 'happy';
    }
    svg.dataset.expression = expression;
    svg.classList.toggle('printing', mood === 'run' && !s.warming
      && Number.isFinite(percent) && percent < 90);
    const stateKey = [
      mood,
      s && s.connected ? 'connected' : 'disconnected',
      s && s.has_data ? 'data' : 'no-data',
      s && s.warming ? 'warming' : 'ready',
      mood === 'run' && Number.isFinite(percent) && percent >= 90 && percent < 100
        ? 'near-finish' : 'not-near-finish'
    ].join(':');
    if (previousStateKey !== null && stateKey !== previousStateKey) {
      svg.classList.remove('state-change');
      void svg.getBoundingClientRect();
      const nearFinish = mood === 'run' && Number.isFinite(percent) && percent >= 90 && percent < 100;
      svg.classList.toggle('finish-reaction', nearFinish);
      svg.classList.toggle('state-change', !nearFinish);
      clearTimeout(stateReactionTimer);
      stateReactionTimer = setTimeout(() => {
        svg.classList.remove('state-change', 'finish-reaction');
      }, nearFinish ? 950 : 700);
    }
    previousStateKey = stateKey;

    const elapsed = s && s.elapsed_minutes != null ? Number(s.elapsed_minutes) : NaN;
    const remaining = s && s.remaining_minutes != null ? Number(s.remaining_minutes) : NaN;
    const showTimes = s && s.connected && s.has_data
      && ['run', 'pause'].includes(mood)
      && Number.isFinite(elapsed) && Number.isFinite(remaining);
    elapsedBadge.classList.toggle('visible', showTimes);
    remainingBadge.classList.toggle('visible', showTimes);
    if (showTimes) {
      elapsedText.textContent = displayValue(`~${formatDuration(elapsed)}`);
      remainingText.textContent = displayValue(formatDuration(remaining));
    }
    // Temperature gauges are always shown; an empty dial means no reading yet.
    setGauge(nozzleFill, s && s.nozzle_temp, s && s.nozzle_target);
    setGauge(bedFill, s && s.bed_temp, s && s.bed_target);
    const layer = s && s.layer_num != null ? Number(s.layer_num) : NaN;
    const totalLayers = s && s.total_layers != null ? Number(s.total_layers) : NaN;
    const hasLayerProgress = s && s.has_data && ['run', 'pause'].includes(mood)
      && Number.isFinite(layer) && Number.isFinite(totalLayers) && totalLayers > 0;
    const crossedMilestone = mood === 'run' && previousMood === 'run'
      && Number.isFinite(percent) && Number.isFinite(previousPercent)
      && [25, 50, 75].some((milestone) => previousPercent < milestone && percent >= milestone);
    const changedLayer = mood === 'run' && hasLayerProgress
      && previousLayer !== null && Math.round(layer) > previousLayer;
    if (crossedMilestone || changedLayer) {
      printerRoot.classList.remove('progress-hop');
      printerRoot.classList.remove('layer-hop');
      shadow.classList.remove('progress-hop');
      shadow.classList.remove('layer-hop');
      void printerRoot.getBoundingClientRect();
      const hopClass = changedLayer ? 'layer-hop' : 'progress-hop';
      printerRoot.classList.add(hopClass);
      shadow.classList.add(hopClass);
      clearTimeout(progressHopTimer);
      progressHopTimer = setTimeout(() => {
        printerRoot.classList.remove('progress-hop', 'layer-hop');
        shadow.classList.remove('progress-hop', 'layer-hop');
      }, changedLayer ? 650 : 500);
    }
    if (crossedMilestone) {
      svg.classList.remove('milestone-blink');
      void svg.getBoundingClientRect();
      svg.classList.add('milestone-blink');
      clearTimeout(milestoneBlinkTimer);
      milestoneBlinkTimer = setTimeout(() => svg.classList.remove('milestone-blink'), 400);
    }
    previousPercent = Number.isFinite(percent) ? percent : null;
    previousLayer = hasLayerProgress ? Math.round(layer) : null;
    previousMood = mood;
    const showFirstLayer = hasLayerProgress && Math.round(layer) === 1;
    firstLayerIndicator.classList.toggle('visible', showFirstLayer);
    layerBadge.classList.toggle('visible', hasLayerProgress && !showFirstLayer);
    if (hasLayerProgress && !showFirstLayer) {
      const progress = Math.max(0, Math.min(1, layer / totalLayers));
      const fillHeight = Math.max(2, 90 * progress);
      layerFill.setAttribute('y', String(204 - fillHeight));
      layerFill.setAttribute('height', String(fillHeight));
      layerCount.textContent = displayValue(`${Math.round(layer)}/${Math.round(totalLayers)}`);
    }
    const wifiLevel = s && s.wifi_level != null ? Number(s.wifi_level) : NaN;
    const hasWifiLevel = Number.isFinite(wifiLevel) && wifiLevel >= 1 && wifiLevel <= 3;
    wifiIndicator.classList.toggle('visible', hasWifiLevel);
    if (hasWifiLevel) wifiIndicator.dataset.level = String(Math.round(wifiLevel));

    if (s && s.has_data) {
      let reportedLvl = null;
      if (s.spd_lvl != null) {
        reportedLvl = Number(s.spd_lvl);
      } else if (s.spd_mag != null) {
        const mag = Number(s.spd_mag);
        reportedLvl = mag <= 70 ? 1 : mag <= 110 ? 2 : mag <= 145 ? 3 : 4;
      }
      if (reportedLvl && reportedLvl >= 1 && reportedLvl <= 4 && reportedLvl !== currentSpeedLevel) {
        currentSpeedLevel = reportedLvl;
        updateSpeedUI(reportedLvl);
      }
    }
  }

  const lightButton = document.getElementById('lightButton');
  const lightButtonTitle = document.getElementById('lightButtonTitle');
  function renderLightButton() {
    lightButton.classList.toggle('on', chamberLightOn);
    lightButton.setAttribute('aria-pressed', String(chamberLightOn));
    lightButtonTitle.textContent = `Chamber light: ${chamberLightOn ? 'on' : 'off'}`;
  }
  function bindControl(el, fn) {
    el.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); fn(); } });
  }
  bindControl(lightButton, async () => {
    const next = !chamberLightOn;
    const result = await window.pywebview?.api?.control_bambu?.('chamber_light', next ? 'on' : 'off');
    if (!result || result.ok) { chamberLightOn = next; renderLightButton(); }
  });
  renderLightButton();

  const SPEED_LEVELS = [
    { level: 1, name: 'SILENT', pct: 50, color: '#60cdff', x: 86 },
    { level: 2, name: 'STANDARD', pct: 100, color: '#70efb6', x: 129 },
    { level: 3, name: 'SPORT', pct: 124, color: '#ffd27a', x: 171 },
    { level: 4, name: 'LUDICROUS', pct: 166, color: '#ff8b96', x: 214 },
  ];
  const speedControl = document.getElementById('speedControl');
  const speedValueText = document.getElementById('speedValueText');
  const speedTrackFill = document.getElementById('speedTrackFill');
  const speedThumb = document.getElementById('speedThumb');
  const speedNotches = Array.from(document.querySelectorAll('.speedNotch'));
  let currentSpeedLevel = 2;

  function updateSpeedUI(level, visualX = null) {
    const config = SPEED_LEVELS.find((s) => s.level === level) || SPEED_LEVELS[1];
    const targetX = visualX != null ? visualX : config.x;
    speedControl.dataset.level = String(config.level);
    speedControl.setAttribute('aria-valuenow', String(config.level));
    speedControl.setAttribute('aria-valuetext', `${config.name} (${config.pct}%)`);
    speedThumb.setAttribute('transform', `translate(${targetX} 210.5)`);
    const fillWidth = Math.max(0, Math.min(132, targetX - 84));
    speedTrackFill.setAttribute('width', String(fillWidth));
    speedTrackFill.style.fill = config.color;
    speedValueText.textContent = `${config.name} · ${config.pct}%`;
    speedValueText.setAttribute('fill', config.color);
    speedNotches.forEach((notch) => {
      const notchLevel = Number(notch.dataset.level);
      notch.classList.toggle('active', notchLevel <= config.level);
    });
  }


  updateSpeedUI(currentSpeedLevel);

  async function pollCamera() {
    if (!cameraMonitorOpen || cameraPollInFlight || !window.pywebview?.api?.get_bambu_camera_snapshot) return;
    cameraPollInFlight = true;
    try {
      const camera = await window.pywebview.api.get_bambu_camera_snapshot(cameraLastUpdated);
      if (!camera || !camera.configured) {
        setCameraToggleAvailable(false);
        cameraFrame.setAttribute('visibility', 'hidden');
        cameraPlaceholder.style.display = 'inline';
        cameraPlaceholderText.textContent = 'CAMERA NOT CONFIGURED';
        cameraPlaceholderText.setAttribute('font-size', '7');
      } else if (camera.frame) {
        cameraFrame.setAttribute('href', `data:image/jpeg;base64,${camera.frame}`);
        cameraFrame.setAttribute('visibility', 'visible');
        cameraPlaceholder.style.display = 'none';
        cameraLastUpdated = camera.updated_at;
      } else {
        if (!camera.connected || camera.error) {
          cameraFrame.setAttribute('visibility', 'hidden');
          cameraPlaceholder.style.display = 'inline';
          cameraPlaceholderText.textContent = camera.error
            ? camera.error.toUpperCase()
            : 'CONNECTING TO CAMERA…';
          cameraPlaceholderText.setAttribute('font-size', camera.error ? '5.5' : '7');
        }
      }
    } catch (error) {
      console.error('Could not fetch Bambu camera frame');
      cameraFrame.setAttribute('visibility', 'hidden');
      cameraPlaceholder.style.display = 'inline';
      cameraPlaceholderText.textContent = 'CAMERA CONNECTION ERROR';
      cameraPlaceholderText.setAttribute('font-size', '7');
    } finally {
      cameraPollInFlight = false;
    }
  }

  function setCameraToggleAvailable(available) {
    cameraToggleAvailable = !!available;
    cameraToggle.setAttribute('visibility', cameraToggleAvailable ? 'visible' : 'hidden');
    cameraToggle.setAttribute('aria-hidden', cameraToggleAvailable ? 'false' : 'true');
    if (!cameraToggleAvailable && cameraMonitorOpen) setCameraMonitorOpen(false);
  }

  async function pollCameraConfiguration() {
    if (!window.pywebview?.api?.get_bambu_camera_config) return;
    try {
      const camera = await window.pywebview.api.get_bambu_camera_config();
      setCameraToggleAvailable(!!(camera && camera.configured));
    } catch (error) {
      console.error('Could not verify Bambu camera configuration');
      setCameraToggleAvailable(false);
    }
  }

  function setCameraMonitorOpen(open) {
    cameraMonitorOpen = !!open && cameraToggleAvailable;
    cameraMonitor.setAttribute('visibility', cameraMonitorOpen ? 'visible' : 'hidden');
    cameraToggle.setAttribute('aria-label', cameraMonitorOpen ? 'Close camera screen' : 'Open camera screen');
    cameraToggleText.textContent = cameraMonitorOpen ? 'CLOSE CAMERA' : 'OPEN CAMERA';
    const api = window.pywebview?.api;
    if (api?.set_bambu_camera_stream) {
      api.set_bambu_camera_stream(cameraMonitorOpen).catch(() => {
        console.error('Could not update Bambu camera stream state');
      });
    }
    if (!cameraMonitorOpen) {
      cameraFrame.setAttribute('visibility', 'hidden');
      cameraPlaceholder.style.display = 'inline';
      cameraPlaceholderText.textContent = 'CONNECTING TO CAMERA…';
      cameraPlaceholderText.setAttribute('font-size', '7');
      cameraLastUpdated = null;
    } else {
      pollCamera();
    }
  }

  cameraToggle.addEventListener('click', () => setCameraMonitorOpen(!cameraMonitorOpen));
  cameraToggle.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      setCameraMonitorOpen(!cameraMonitorOpen);
    }
  });

  // Polled from Python's read_bambu_status() - see the Bambu section in pet_app.py.
  function poll() {
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.get_bambu_status)) return;
    window.pywebview.api.get_bambu_status().then(render).catch(() => {});
  }

  window.addEventListener('pywebviewready', () => {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.get_pet_config) {
      window.pywebview.api.get_pet_config().then((cfg) => {
        if (cfg && cfg.size) applyPetScale(cfg.size);
      });
    }
    poll();
    pollCameraConfiguration();
    setInterval(poll, 1500);
    setInterval(pollCameraConfiguration, 3000);
    setInterval(pollCamera, CAMERA_POLL_INTERVAL_MS);
  });

  function triggerJump() {
    printerRoot.classList.remove('jump');
    shadow.classList.remove('jump');
    void printerRoot.getBoundingClientRect();  // force a reflow so the animation restarts

    printerRoot.classList.add('jump');
    shadow.classList.add('jump');
  }

  printerRoot.addEventListener('animationend', (e) => {
    if (e.animationName === 'hopOnce') {
      printerRoot.classList.remove('jump');
      shadow.classList.remove('jump');
    }
  });

  function handlePetClick() {
    triggerJump();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_app) {
      window.pywebview.api.open_app();
    }
  }

  let dragStartX, dragStartY, isDragging = false, movedDistance = 0;
  const DRAG_THRESHOLD = 6;
  const CAMERA_POLL_INTERVAL_MS = 50;

  svg.addEventListener('mousedown', (e) => {
    if (e.button !== 0) {
      if (e.button === 1) e.preventDefault();
      return;
    }
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    movedDistance = 0;
    isDragging = false;
    if (window.pywebview && window.pywebview.api && window.pywebview.api.start_drag) {
      window.pywebview.api.start_drag();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (dragStartX === undefined) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    movedDistance += Math.abs(dx) + Math.abs(dy);
    if (movedDistance > DRAG_THRESHOLD) {
      isDragging = true;
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drag_move) {
        window.pywebview.api.drag_move(dx, dy);
      }
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (dragStartX === undefined) return;
    if (isDragging) {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drop) {
        window.pywebview.api.drop();
      }
    } else if (!(e.target instanceof Node) || (!cameraToggle.contains(e.target)
      && !document.getElementById('lightButton').contains(e.target)
      && !document.getElementById('speedControl').contains(e.target))) {
      handlePetClick();
    }
    dragStartX = undefined;
    isDragging = false;
  });

  svg.addEventListener('auxclick', (e) => {
    if (e.button !== 1) return;
    e.preventDefault();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_settings_window) {
      window.pywebview.api.open_settings_window();
    }
  });
</script>
</body>
</html>
