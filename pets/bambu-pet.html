<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bambu Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: transparent;
  }

  #petWrap {
    transition: transform 0.2s ease-out;
    transform-origin: center bottom;
    transform: scale(var(--pet-scale, 1));
    position: relative;
  }

  svg#bambuPetSvg {
    width: 300px;
    height: 260px;
    overflow: visible;
    cursor: pointer;
  }

  /* Soft drop shadow so the printer reads against any wallpaper. */
  #printer-hit { filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.35)); }

  /* ================= shadow + idle motion ================= */
  #shadow {
    transform-origin: 150px 236px;
    animation: shadowIdle 3.4s ease-in-out infinite;
  }
  #shadow.jump { animation: shadowHop 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes shadowIdle {
    0%, 100% { transform: scaleX(1);    opacity: 0.32; }
    50%      { transform: scaleX(0.94); opacity: 0.26; }
  }
  @keyframes shadowHop {
    0%   { transform: scaleX(1);    opacity: 0.35; }
    30%  { transform: scaleX(0.55); opacity: 0.14; }
    100% { transform: scaleX(1);    opacity: 0.35; }
  }

  #printer-root {
    transform-origin: 150px 236px;
    animation: idleSway 3.4s ease-in-out infinite;
  }
  #printer-root.jump { animation: hopOnce 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes idleSway {
    0%, 100% { transform: translateY(0)    rotate(0deg); }
    50%      { transform: translateY(-3px) rotate(0.8deg); }
  }
  @keyframes hopOnce {
    0%   { transform: translateY(0)     scale(1, 1)      rotate(0deg); }
    14%  { transform: translateY(2px)   scale(1.07, 0.9) rotate(0deg); }
    45%  { transform: translateY(-58px) scale(0.94, 1.08) rotate(-3deg); }
    72%  { transform: translateY(0)     scale(1.1, 0.88) rotate(3deg); }
    86%  { transform: translateY(-5px)  scale(0.98, 1.03) rotate(-1deg); }
    100% { transform: translateY(0)     scale(1, 1)      rotate(0deg); }
  }

  #screenPercent {
    font: 700 18px "Segoe UI", system-ui, sans-serif;
    text-anchor: middle;
    fill: #70efb6;
  }

  .timeBadge { display: none; }
  .timeBadge.visible { display: inline; }
  .timeBadge rect {
    fill: #171b24;
    stroke-width: 1.5;
  }
  .timeBadge text {
    text-anchor: middle;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .timeBadge .timeLabel {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.6px;
  }
  .timeBadge .timeValue {
    font-size: 10px;
    font-weight: 700;
  }
  #elapsedBadge rect { stroke: #8dd5ff; }
  #elapsedBadge text { fill: #8dd5ff; }
  #remainingBadge rect { stroke: #7ff0bb; }
  #remainingBadge text { fill: #7ff0bb; }

  .temperatureBadge { display: none; }
  .temperatureBadge.visible { display: inline; }
  .temperatureBadge rect {
    fill: #171b24;
    stroke-width: 1.5;
  }
  .temperatureBadge text {
    text-anchor: middle;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .temperatureBadge .temperatureLabel {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.6px;
  }
  .temperatureBadge .temperatureValue {
    font-size: 9px;
    font-weight: 700;
  }
  .temperatureBadge .temperatureTrack {
    fill: #0c1017;
    stroke: #46505e;
    stroke-width: 0.7;
  }
  .temperatureBadge .temperatureFill {
    rx: 2;
  }
  #nozzleBadge .temperatureFrame { stroke: #ffc45c; }
  #nozzleBadge text { fill: #ffc45c; }
  #nozzleBadge .temperatureFill { fill: #ffc45c; }
  #bedBadge .temperatureFrame { stroke: #8dd5ff; }
  #bedBadge text { fill: #8dd5ff; }
  #bedBadge .temperatureFill { fill: #8dd5ff; }

  #firstLayerIndicator, #layerBadge { display: none; }
  #firstLayerIndicator.visible, #layerBadge.visible { display: inline; }
  #wifiIndicator { display: none; }
  #wifiIndicator.visible { display: inline; }
  #wifiIndicator .wifiBack {
    fill: #171b24;
    stroke: #505a6b;
    stroke-width: 1;
  }
  #wifiIndicator .wifiArc {
    fill: none;
    stroke: #414958;
    stroke-linecap: round;
    stroke-width: 2.5;
  }
  #wifiIndicator .wifiDot { fill: #414958; }
  #wifiIndicator[data-level="1"] .wifiInner { stroke: #ff8b76; }
  #wifiIndicator[data-level="1"] .wifiDot { fill: #ff8b76; }
  #wifiIndicator[data-level="2"] .wifiMiddle,
  #wifiIndicator[data-level="2"] .wifiInner { stroke: #ffd27a; }
  #wifiIndicator[data-level="2"] .wifiDot { fill: #ffd27a; }
  #wifiIndicator[data-level="3"] .wifiArc { stroke: #70efb6; }
  #wifiIndicator[data-level="3"] .wifiDot { fill: #70efb6; }
  #layerBadge text {
    fill: #ffc45c;
    font: 700 11px "Segoe UI", system-ui, sans-serif;
    text-anchor: middle;
  }

  #statusBadge {
    pointer-events: none;
  }
  #statusBadge rect {
    fill: #242934;
    stroke: #9ba3b4;
  }
  #statusBadge text {
    fill: #d3dae7;
    font: 700 8.5px "Segoe UI", system-ui, sans-serif;
  }
  #statusBadge circle {
    fill: #9ba3b4;
    animation: statusBlink 1.25s ease-in-out infinite;
  }
  #statusBadge[data-mood="run"] rect { fill: #124a39; stroke: #7ff0bb; }
  #statusBadge[data-mood="run"] text, #statusBadge[data-mood="run"] circle { fill: #7ff0bb; }
  #statusBadge[data-mood="pause"] rect { fill: #5d3e12; stroke: #ffd27a; }
  #statusBadge[data-mood="pause"] text, #statusBadge[data-mood="pause"] circle { fill: #ffd27a; }
  #statusBadge[data-mood="done"] rect { fill: #18415b; stroke: #8dd5ff; }
  #statusBadge[data-mood="done"] text, #statusBadge[data-mood="done"] circle { fill: #8dd5ff; }
  #statusBadge[data-mood="fail"], #statusBadge[data-mood="offline"] {
    color: #ff8b96;
  }
  #statusBadge[data-mood="fail"] rect, #statusBadge[data-mood="offline"] rect {
    fill: #64222b;
    stroke: #ff8b96;
  }
  #statusBadge[data-mood="fail"] text, #statusBadge[data-mood="fail"] circle,
  #statusBadge[data-mood="offline"] text, #statusBadge[data-mood="offline"] circle {
    fill: #ff8b96;
  }
  @keyframes statusBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* ================= printer face ================= */
  .eye-open {
    transform-origin: 150px 137px;
    animation: blink 4.2s ease-in-out infinite;
  }
  .eye-happy, .eye-pause, .eye-fail, .eye-idle { display: none; }
  #bambuPetSvg[data-mood="done"] .eye-open,
  #bambuPetSvg[data-mood="pause"] .eye-open,
  #bambuPetSvg[data-mood="fail"] .eye-open,
  #bambuPetSvg[data-mood="idle"] .eye-open { display: none; }
  #bambuPetSvg[data-mood="done"] .eye-happy,
  #bambuPetSvg[data-mood="pause"] .eye-pause,
  #bambuPetSvg[data-mood="fail"] .eye-fail,
  #bambuPetSvg[data-mood="idle"] .eye-idle { display: inline; }
  #mouth path, #mouth ellipse {
    display: none;
    fill: none;
    stroke: #70efb6;
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #bambuPetSvg[data-expression="happy"] #mouthSmile,
  #bambuPetSvg[data-expression="excited"] #mouthGrin,
  #bambuPetSvg[data-expression="focused"] #mouthO,
  #bambuPetSvg[data-expression="worried"] #mouthWorried,
  #bambuPetSvg[data-expression="sad"] #mouthSad,
  #bambuPetSvg[data-expression="flat"] #mouthFlat,
  #bambuPetSvg[data-expression="neutral"] #mouthNeutral { display: inline; }
  #bambuPetSvg[data-expression="worried"] #mouth path,
  #bambuPetSvg[data-expression="sad"] #mouth path { stroke: #ff8b96; }
  #bambuPetSvg[data-expression="flat"] #mouth path,
  #bambuPetSvg[data-expression="neutral"] #mouth path { stroke: #9ba3b4; }
  #face, #mouth {
    transform-box: fill-box;
    transform-origin: center;
  }
  #bambuPetSvg.state-change #face,
  #bambuPetSvg.state-change #mouth {
    animation: stateReaction 620ms cubic-bezier(.2,.8,.25,1);
  }
  @keyframes stateReaction {
    0% { transform: translateY(0) scale(1); }
    38% { transform: translateY(-3px) scale(1.16); }
    72% { transform: translateY(1px) scale(0.96); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.05); }
    97%           { transform: scaleY(1); }
  }

</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="petWrap">
    <svg id="bambuPetSvg" viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#4a4f62"/>
          <stop offset="45%"  stop-color="#2c303c"/>
          <stop offset="100%" stop-color="#16181e"/>
        </linearGradient>
        <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#6d7388"/>
          <stop offset="100%" stop-color="#3a3e4d"/>
        </linearGradient>
        <linearGradient id="railGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#c3c8d5"/>
          <stop offset="100%" stop-color="#5b6070"/>
        </linearGradient>
        <linearGradient id="footGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#2c303c"/>
          <stop offset="100%" stop-color="#101217"/>
        </linearGradient>
        <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#0b0d12"/>
          <stop offset="100%" stop-color="#1e222c"/>
        </linearGradient>
        <radialGradient id="eyeGrad" cx="50%" cy="40%" r="60%">
          <stop offset="0%"   stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#c9cfdd"/>
        </radialGradient>
        <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#000000" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
          <rect width="4" height="2" fill="#ffffff" fill-opacity="0.045"/>
        </pattern>
      </defs>

      <!-- ground shadow -->
      <ellipse id="shadow" cx="150" cy="236" rx="66" ry="12" fill="url(#shadowGrad)"/>

      <g id="printer-root">
        <g id="printer-hit">
          <!-- feet -->
          <rect x="110" y="210" width="24" height="39" rx="9" fill="url(#footGrad)" stroke="#0b0c10" stroke-width="1.5"/>
          <rect x="166" y="210" width="24" height="39" rx="9" fill="url(#footGrad)" stroke="#0b0c10" stroke-width="1.5"/>

          <!-- enclosure -->
          <rect x="56" y="70" width="188" height="152" rx="18" fill="url(#bodyGrad)" stroke="#5b6070" stroke-width="2"/>
          <!-- top lid: a lighter band, so the printer reads as a box with a top -->
          <rect x="58" y="72" width="184" height="22" rx="14" fill="url(#lidGrad)" opacity="0.9"/>
          <g id="statusBadge" data-mood="idle" role="status" aria-live="polite">
            <rect x="146" y="73" width="80" height="14" rx="7"/>
            <circle cx="154" cy="80" r="2.7"/>
            <text id="statusText" x="163" y="83">Connecting</text>
          </g>
          <!-- inner bevel -->
          <rect x="60" y="74" width="180" height="144" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
          <!-- side vents -->
          <g fill="#0b0d12" opacity="0.7">
            <rect x="63" y="128" width="6" height="4" rx="2"/>
            <rect x="63" y="136" width="6" height="4" rx="2"/>
            <rect x="63" y="144" width="6" height="4" rx="2"/>
            <rect x="231" y="128" width="6" height="4" rx="2"/>
            <rect x="231" y="136" width="6" height="4" rx="2"/>
            <rect x="231" y="144" width="6" height="4" rx="2"/>
          </g>
          <g id="firstLayerIndicator" aria-label="First layer in progress">
            <rect x="70" y="157" width="9" height="29" rx="4.5" fill="#171b24" stroke="#8a6030" stroke-width="1"/>
            <path d="M72.5 163 H76.5" stroke="#ffc45c" stroke-width="2" stroke-linecap="round"/>
            <path d="M72.5 170 H76.5" stroke="#9b7138" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M72.5 177 H76.5" stroke="#705632" stroke-width="1.5" stroke-linecap="round"/>
          </g>
          <!-- gantry: two end posts and the rail the nozzle travels along -->
          <rect x="60" y="82" width="10" height="18" rx="3" fill="#23262f"/>
          <rect x="230" y="82" width="10" height="18" rx="3" fill="#23262f"/>
          <rect x="66" y="88" width="168" height="6" rx="3" fill="url(#railGrad)"/>
          <g id="wifiIndicator" aria-label="Wi-Fi signal strength">
            <rect class="wifiBack" x="61" y="72" width="34" height="23" rx="7"/>
            <path class="wifiArc wifiOuter" d="M66 81 Q78 69 90 81"/>
            <path class="wifiArc wifiMiddle" d="M70 84 Q78 76 86 84"/>
            <path class="wifiArc wifiInner" d="M74 87 Q78 83 82 87"/>
            <circle class="wifiDot" cx="78" cy="90" r="2"/>
          </g>

          <!-- nozzle head -->
          <g id="head">
            <rect x="138" y="90" width="24" height="18" rx="4" fill="#9aa0ae"/>
            <rect x="140" y="91" width="20" height="3" rx="1.5" fill="#dfe3ec" opacity="0.7"/>
            <rect x="146" y="108" width="8" height="9" rx="2" fill="#c9ccd6"/>
            <path d="M146.5 117 L153.5 117 L150 123 Z" fill="#f5c542"/>
          </g>

          <!-- the face is the printer's display -->
          <rect x="82" y="119" width="136" height="78" rx="14" fill="#15171e" stroke="#3a3e4b" stroke-width="1.5"/>
          <rect x="84" y="121" width="132" height="74" rx="12" fill="url(#screenGrad)"/>
          <rect x="84" y="121" width="132" height="74" rx="12" fill="url(#scanlines)"/>
          <g id="face">
            <g class="eye-open">
              <ellipse cx="120" cy="137" rx="9" ry="10" fill="url(#eyeGrad)"/>
              <ellipse cx="180" cy="137" rx="9" ry="10" fill="url(#eyeGrad)"/>
              <circle id="pupilL" cx="121" cy="140" r="4" fill="#16171b"/>
              <circle id="pupilR" cx="181" cy="140" r="4" fill="#16171b"/>
            </g>
            <g class="eye-happy" fill="none" stroke="#70efb6" stroke-width="4" stroke-linecap="round">
              <path d="M110 139 Q120 128 130 139"/>
              <path d="M170 139 Q180 128 190 139"/>
            </g>
            <g class="eye-pause" fill="none" stroke="#ffd27a" stroke-width="4" stroke-linecap="round">
              <path d="M111 138 Q120 146 129 138"/>
              <path d="M171 138 Q180 146 189 138"/>
            </g>
            <g class="eye-fail" fill="none" stroke="#ff6b78" stroke-width="4" stroke-linecap="round">
              <path d="M114 132 L126 144 M126 132 L114 144"/>
              <path d="M174 132 L186 144 M186 132 L174 144"/>
            </g>
            <g class="eye-idle" fill="none" stroke="#9ba3b4" stroke-width="4" stroke-linecap="round">
              <path d="M110 138 L130 138"/>
              <path d="M170 138 L190 138"/>
            </g>
          </g>
          <g id="mouth" aria-hidden="true">
            <path id="mouthSmile" d="M141 177 Q150 184 159 177"/>
            <path id="mouthGrin" d="M140 177 Q150 185 160 177"/>
            <ellipse id="mouthO" cx="150" cy="179.5" rx="3" ry="3.5"/>
            <path id="mouthWorried" d="M141 181 Q150 174 159 181"/>
            <path id="mouthSad" d="M141 182 Q150 174 159 182"/>
            <path id="mouthFlat" d="M142 179 H158"/>
            <path id="mouthNeutral" d="M143 179 Q150 181 157 179"/>
          </g>

          <text id="screenPercent" x="150" y="169">--%</text>
        </g>
        <g id="layerBadge" aria-label="Layer progress">
          <rect x="68" y="111" width="12" height="94" rx="6" fill="#11151d" stroke="#705632" stroke-width="1"/>
          <rect id="layerFill" x="71" y="203" width="6" height="2" rx="3" fill="#ffc45c"/>
          <rect x="53" y="206" width="42" height="14" rx="4" fill="#171b24" stroke="#705632" stroke-width="0.8"/>
          <text id="layerCount" x="74" y="217">18/240</text>
        </g>
        <g id="elapsedBadge" class="timeBadge" aria-label="Estimated elapsed print time">
          <rect x="-26" y="145" width="82" height="42" rx="9"/>
          <text class="timeLabel" x="15" y="160">ELAPSED</text>
          <text id="elapsedText" class="timeValue" x="15" y="178">--</text>
        </g>
        <g id="remainingBadge" class="timeBadge" aria-label="Estimated time remaining">
          <rect x="244" y="145" width="82" height="42" rx="9"/>
          <text class="timeLabel" x="285" y="160">REMAINING</text>
          <text id="remainingText" class="timeValue" x="285" y="178">--</text>
        </g>
        <g id="nozzleBadge" class="temperatureBadge" aria-label="Nozzle temperature">
          <rect class="temperatureFrame" x="-32" y="99" width="94" height="42" rx="9" fill="#171b24" stroke-width="1.5"/>
          <text class="temperatureLabel" x="15" y="110">NOZZLE</text>
          <rect class="temperatureTrack" x="-22" y="115" width="74" height="6" rx="3"/>
          <rect id="nozzleFill" class="temperatureFill" x="-22" y="115" width="0" height="6"/>
          <text id="nozzleText" class="temperatureValue" x="15" y="136">-- / --°</text>
        </g>
        <g id="bedBadge" class="temperatureBadge" aria-label="Bed temperature">
          <rect class="temperatureFrame" x="238" y="99" width="94" height="42" rx="9" fill="#171b24" stroke-width="1.5"/>
          <text class="temperatureLabel" x="285" y="110">BED</text>
          <rect class="temperatureTrack" x="248" y="115" width="74" height="6" rx="3"/>
          <rect id="bedFill" class="temperatureFill" x="248" y="115" width="0" height="6"/>
          <text id="bedText" class="temperatureValue" x="285" y="136">-- / --°</text>
        </g>
      </g>
    </svg>
  </div>
</div>

<script>
  const svg         = document.getElementById('bambuPetSvg');
  const petWrap     = document.getElementById('petWrap');
  const printerRoot = document.getElementById('printer-root');
  const shadow      = document.getElementById('shadow');
  const screenPercent = document.getElementById('screenPercent');
  const statusBadge = document.getElementById('statusBadge');
  const statusText  = document.getElementById('statusText');
  const elapsedBadge = document.getElementById('elapsedBadge');
  const elapsedText = document.getElementById('elapsedText');
  const remainingBadge = document.getElementById('remainingBadge');
  const remainingText = document.getElementById('remainingText');
  const nozzleBadge = document.getElementById('nozzleBadge');
  const nozzleText = document.getElementById('nozzleText');
  const nozzleFill = document.getElementById('nozzleFill');
  const bedBadge = document.getElementById('bedBadge');
  const bedText = document.getElementById('bedText');
  const bedFill = document.getElementById('bedFill');
  const firstLayerIndicator = document.getElementById('firstLayerIndicator');
  const wifiIndicator = document.getElementById('wifiIndicator');
  const layerBadge = document.getElementById('layerBadge');
  const layerCount = document.getElementById('layerCount');
  const layerFill = document.getElementById('layerFill');
  let previousStateKey = null;
  let stateReactionTimer = null;

  function applyPetScale(pct) {
    petWrap.style.setProperty('--pet-scale', (parseInt(pct, 10) / 100 || 1).toString());
  }

  function formatDuration(minutes) {
    const total = Math.max(0, Math.round(Number(minutes)));
    if (!Number.isFinite(total)) return '--';
    const hours = Math.floor(total / 60);
    const mins = total % 60;
    return hours ? `${hours}h ${mins}m` : `${mins}m`;
  }

  function render(s) {
    const percent = s && s.configured && s.has_data ? Number(s.percent) : NaN;
    screenPercent.textContent = Number.isFinite(percent)
      ? `${percent}%`
      : '--%';

    let mood = 'idle';
    let label = 'Not configured';
    if (s && s.configured) {
      if (!s.connected) {
        mood = 'offline';
        label = 'Offline';
      } else if (!s.has_data) {
        label = 'Connecting';
      } else if (s.warming) {
        mood = s.mood || 'run';
        label = 'Warming up';
      } else {
        mood = s.mood || 'idle';
        label = ({
          run: 'Printing',
          pause: 'Paused',
          done: 'Finished',
          fail: 'Error',
          idle: 'Idle'
        })[mood] || 'Idle';
      }
    }
    statusBadge.dataset.mood = mood;
    svg.dataset.mood = ['run', 'pause', 'done', 'fail', 'idle'].includes(mood) ? mood : 'idle';
    statusText.textContent = label;
    let expression = 'neutral';
    if (!s || !s.configured || !s.connected || !s.has_data) {
      expression = 'worried';
    } else if (mood === 'fail' || mood === 'offline') {
      expression = 'sad';
    } else if (mood === 'done') {
      expression = 'excited';
    } else if (mood === 'pause') {
      expression = 'flat';
    } else if (s.warming) {
      expression = 'focused';
    } else if (mood === 'run' && Number.isFinite(percent) && percent <= 5) {
      expression = 'worried';
    } else if (mood === 'run' && percent >= 95) {
      expression = 'excited';
    } else if (mood === 'run') {
      expression = 'happy';
    }
    svg.dataset.expression = expression;
    const stateKey = [
      mood,
      s && s.connected ? 'connected' : 'disconnected',
      s && s.has_data ? 'data' : 'no-data',
      s && s.warming ? 'warming' : 'ready'
    ].join(':');
    if (previousStateKey !== null && stateKey !== previousStateKey) {
      svg.classList.remove('state-change');
      void svg.getBoundingClientRect();
      svg.classList.add('state-change');
      clearTimeout(stateReactionTimer);
      stateReactionTimer = setTimeout(() => svg.classList.remove('state-change'), 700);
    }
    previousStateKey = stateKey;

    const elapsed = s && s.elapsed_minutes != null ? Number(s.elapsed_minutes) : NaN;
    const remaining = s && s.remaining_minutes != null ? Number(s.remaining_minutes) : NaN;
    const showWarmup = s && s.connected && s.has_data && s.warming === true;
    const nozzleReady = s && s.nozzle_temp != null && s.nozzle_target != null;
    const bedReady = s && s.bed_temp != null && s.bed_target != null;
    const showTimes = s && s.connected && s.has_data
      && ['run', 'pause'].includes(mood)
      && Number.isFinite(elapsed) && Number.isFinite(remaining);
    elapsedBadge.classList.toggle('visible', showTimes);
    remainingBadge.classList.toggle('visible', showTimes);
    if (showTimes) {
      elapsedText.textContent = `~${formatDuration(elapsed)}`;
      remainingText.textContent = formatDuration(remaining);
    }
    nozzleBadge.classList.toggle('visible', showWarmup && nozzleReady);
    bedBadge.classList.toggle('visible', showWarmup && bedReady);
    if (showWarmup && nozzleReady) {
      nozzleText.textContent = `${s.nozzle_temp}° / ${s.nozzle_target}°`;
      nozzleFill.setAttribute('width', String(74 * Math.min(1, s.nozzle_temp / s.nozzle_target)));
    }
    if (showWarmup && bedReady) {
      bedText.textContent = `${s.bed_temp}° / ${s.bed_target}°`;
      bedFill.setAttribute('width', String(74 * Math.min(1, s.bed_temp / s.bed_target)));
    }
    const layer = s && s.layer_num != null ? Number(s.layer_num) : NaN;
    const totalLayers = s && s.total_layers != null ? Number(s.total_layers) : NaN;
    const hasLayerProgress = s && s.has_data && ['run', 'pause'].includes(mood)
      && Number.isFinite(layer) && Number.isFinite(totalLayers) && totalLayers > 0;
    const showFirstLayer = hasLayerProgress && Math.round(layer) === 1;
    firstLayerIndicator.classList.toggle('visible', showFirstLayer);
    layerBadge.classList.toggle('visible', hasLayerProgress && !showFirstLayer);
    if (hasLayerProgress && !showFirstLayer) {
      const progress = Math.max(0, Math.min(1, layer / totalLayers));
      const fillHeight = Math.max(2, 90 * progress);
      layerFill.setAttribute('y', String(204 - fillHeight));
      layerFill.setAttribute('height', String(fillHeight));
      layerCount.textContent = `${Math.round(layer)}/${Math.round(totalLayers)}`;
    }
    const wifiLevel = s && s.wifi_level != null ? Number(s.wifi_level) : NaN;
    const hasWifiLevel = Number.isFinite(wifiLevel) && wifiLevel >= 1 && wifiLevel <= 3;
    wifiIndicator.classList.toggle('visible', hasWifiLevel);
    if (hasWifiLevel) wifiIndicator.dataset.level = String(Math.round(wifiLevel));
  }

  // Polled from Python's read_bambu_status() - see the Bambu section in pet_app.py.
  function poll() {
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.get_bambu_status)) return;
    window.pywebview.api.get_bambu_status().then(render).catch(() => {});
  }

  window.addEventListener('pywebviewready', () => {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.get_pet_config) {
      window.pywebview.api.get_pet_config().then((cfg) => {
        if (cfg && cfg.size) applyPetScale(cfg.size);
      });
    }
    poll();
    setInterval(poll, 1500);
  });

  function triggerJump() {
    printerRoot.classList.remove('jump');
    shadow.classList.remove('jump');
    void printerRoot.getBoundingClientRect();  // force a reflow so the animation restarts

    printerRoot.classList.add('jump');
    shadow.classList.add('jump');
  }

  printerRoot.addEventListener('animationend', (e) => {
    if (e.animationName === 'hopOnce') {
      printerRoot.classList.remove('jump');
      shadow.classList.remove('jump');
    }
  });

  function handlePetClick() {
    triggerJump();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_app) {
      window.pywebview.api.open_app();
    }
  }

  let dragStartX, dragStartY, isDragging = false, movedDistance = 0;
  const DRAG_THRESHOLD = 6;

  svg.addEventListener('mousedown', (e) => {
    if (e.button !== 0) {
      if (e.button === 1) e.preventDefault();
      return;
    }
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    movedDistance = 0;
    isDragging = false;
    if (window.pywebview && window.pywebview.api && window.pywebview.api.start_drag) {
      window.pywebview.api.start_drag();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (dragStartX === undefined) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    movedDistance += Math.abs(dx) + Math.abs(dy);
    if (movedDistance > DRAG_THRESHOLD) {
      isDragging = true;
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drag_move) {
        window.pywebview.api.drag_move(dx, dy);
      }
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    }
  });

  window.addEventListener('mouseup', () => {
    if (dragStartX === undefined) return;
    if (isDragging) {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drop) {
        window.pywebview.api.drop();
      }
    } else {
      handlePetClick();
    }
    dragStartX = undefined;
    isDragging = false;
  });

  svg.addEventListener('auxclick', (e) => {
    if (e.button !== 1) return;
    e.preventDefault();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_settings_window) {
      window.pywebview.api.open_settings_window();
    }
  });
</script>
</body>
