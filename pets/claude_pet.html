<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Claude Code Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #stage {
    position: relative; /* anchors the usage gauges, which sit outside petWrap */
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: transparent;
  }
  #petWrap {
    /* position:relative earns its keep twice over in split mode: it makes the
       band clones' offsetParent (so they can be pinned exactly over the
       original with offsetLeft/offsetTop) and their containing block. */
    position: relative;
    transition: transform 0.2s ease-out;
    transform-origin: center bottom;
    transform: scale(var(--pet-scale, 1));
  }
  /* Split mode: one clone of the whole pet per EXTRA live session, stacked
     exactly on top of the original and clipped to its own vertical band, so
     the mascot reads as one body torn into N independently animated strips.
     pointer-events:none keeps every click/drag/hover on the original
     underneath - the clones are pure decoration. */
  .petBand {
    position: absolute;
    /* 0,0 of #petWrap IS the original svg's top-left: the wrapper is a flex
       item sized to fit-content, so it wraps the one in-flow child exactly.
       Set here rather than from JS on purpose - an <svg> has no offsetLeft /
       offsetTop (those are HTMLElement-only, and read undefined), so
       measuring it in script silently produces no position at all. */
    left: 0;
    top: 0;
    pointer-events: none;
  }
  #petWrap.pet-hover {
    transform: scale(calc(var(--pet-scale, 1) * 1.08)) rotate(-3deg);
  }
  /* Usage gauges live outside petWrap entirely, as their own small SVGs
     pinned to the window's corners. Deliberately NOT inside the mascot's
     scaled/animated group: nesting them there and trying to counter-scale
     against --pet-scale was tried first, but the pet's saved size (74%) plus
     the .pet bob animation's 6px swing meant the counter-scaled ring - now
     occupying MORE of the mascot's own shrinking coordinate space, not less
     - clipped a good 12px off the top of the fixed 220px pet window. A
     sibling element anchored to the stage has no such coupling. */
  .gauge {
    position: absolute;
    top: 2px;
    opacity: 0;
  }
  #gaugeLive { left: 8px; }
  #gaugeWeek { right: 8px; }
  /* The pet floats over whatever happens to be behind it, so a gauge can end
     up on a white Chrome page one second and a black editor the next. Light
     text alone disappears on white; dark text alone disappears on black.
     Every gauge glyph therefore carries its own dark backing (the discs and
     pills in the SVG below) AND a dark outline drawn behind the glyph -
     paint-order:stroke is what puts the stroke *under* the fill instead of
     over it, so the letters stay crisp instead of looking bolded. */
  .gaugeText {
    font-family: 'Courier New', monospace;
    /* The page is dir="rtl", and SVG <text> gets no bidi isolation of its own:
       a mixed Hebrew+digits countdown came out mirrored glyph by glyph
       ("עוד 2:39" rendering as "93:2 דוע"). isolate settles each label as its
       own run, and the countdown is kept to one Hebrew word plus digits so
       there is nothing left to reorder. */
    direction: rtl;
    unicode-bidi: isolate;
    fill: #FFFFFF;
    stroke: #12100F;
    stroke-width: 3;
    stroke-linejoin: round;
    paint-order: stroke;
  }
  /* Activity badge: mirrors what Claude is doing right now (thinking / which
     tool is running), fed by claude-activity-status.ps1 hooks. Sits between
     the two gauges, same reasoning as .gauge for staying outside petWrap. */
  #activityBadge {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.25s ease-out;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    color: #FFFFFF;
    /* Near-opaque, not 40% black: at 40% the badge was legible over a dark
       editor and washed out over a white page. Same reason as .gaugeText. */
    background: #12100FE6;
    border-radius: 9px;
    padding: 3px 10px;
    max-width: 180px; /* the gap between the two 66px-wide gauges, minus margin */
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
  }
  /* ---- other live sessions -------------------------------------------
     Several Claude Code windows can be working at once, but there is only
     ever ONE pet - a second sprite per session was the obvious idea and the
     wrong one (they overlap, they fight for the taskbar strip, and you stop
     being able to tell which is which). So the newest working session owns
     the body, and every other live session gets a small chip down here:
     project name, what it's running, and a dot that keeps its own beat. The
     bottom corner is the only real estate the sprite and the two gauges
     don't already claim. */
  #sessions {
    position: absolute;
    left: 4px;
    bottom: 3px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    pointer-events: none;
    z-index: 4;
  }
  .sessionChip {
    display: flex;
    align-items: center;
    gap: 4px;
    max-width: 98px;
    padding: 1px 5px 1px 4px;
    border-radius: 7px;
    background: #12100FE6;
    color: #F5E7DA;
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: bold;
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    /* Each chip is one session's own heartbeat, so they must NOT breathe in
       unison - a per-chip delay is set inline from JS. */
    animation: chipPulse 1.6s ease-in-out infinite;
  }
  .sessionChip .dot {
    flex: none;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    /* amber = running a tool, cool grey-blue = reasoning */
    background: #F0B94A;
  }
  .sessionChip.thinking .dot { background: #8FB8D8; }
  @keyframes chipPulse {
    0%, 100% { opacity: 0.55; transform: translateX(0); }
    50%      { opacity: 1;    transform: translateX(2px); }
  }
  .pet {
animation: bob 2.2s ease-in-out infinite;
    transform-origin: center bottom;
    cursor: pointer;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  /* ---- activity animations -------------------------------------------
     One class per kind of work, set from pollActivity(). They all replace
     the idle `bob`, so each is a whole personality rather than an overlay:
     you can tell from across the room whether Claude is thinking, running a
     shell, editing, searching, or waiting on you - without reading the
     badge. Declared BEFORE .pet.jump on purpose: same specificity, so the
     click-jump must come last to win. */
  .pet.act-think  { animation: actThink 1.5s ease-in-out infinite; }
  .pet.act-shell  { animation: actShell 0.34s steps(2, end) infinite; }
  .pet.act-git    { animation: actGit 0.5s ease-in-out infinite; }
  .pet.act-pwsh   { animation: actPwsh 0.46s steps(3, end) infinite; }
  .pet.act-write  { animation: actWrite 0.5s ease-in-out infinite; }
  .pet.act-edit   { animation: actEdit 0.38s ease-in-out infinite; }
  .pet.act-search { animation: actSearch 1.6s ease-in-out infinite; }
  .pet.act-read   { animation: actRead 1.8s ease-in-out infinite; }
  .pet.act-todo   { animation: actTodo 1.2s steps(1, end) infinite; }
  .pet.act-mcp    { animation: actMcp 1.3s ease-in-out infinite; }
  .pet.act-web    { animation: actWeb 1.1s ease-in-out infinite; }
  /* .pet.act-ask is defined further down, with the rest of the ask treatment. */
  .pet.act-agent  { animation: actAgent 1.4s ease-in-out infinite; }
  .pet.act-busy   { animation: bob 1.0s ease-in-out infinite; }

  /* head-tilting ponder */
  @keyframes actThink {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-9px) rotate(3deg); }
  }
  /* hard, mechanical judder - a shell hammering away */
  @keyframes actShell {
    0%   { transform: translate(-2px, 0); }
    50%  { transform: translate(2px, -2px); }
    100% { transform: translate(-2px, 0); }
  }
  /* git is a shell command too, but git commit/push/pull are a stamping,
     deliberate beat rather than the raw shell's rattling judder - a slower
     "commit" thump with a settle, so it reads as its own kind of work rather
     than just a recolor of act-shell */
  @keyframes actGit {
    0%, 100% { transform: translateY(0) scale(1); }
    35%      { transform: translateY(-9px) scale(1.06); }
    60%      { transform: translateY(1px) scale(0.95); }
  }
  /* same judder as Bash but heavier and on a 3-step ratchet, so the two
     shells are told apart by rhythm rather than by reading the badge */
  @keyframes actPwsh {
    0%   { transform: translate(0, 0) scale(1); }
    33%  { transform: translate(3px, -3px) scale(1.02); }
    66%  { transform: translate(-3px, -1px) scale(0.99); }
    100% { transform: translate(0, 0) scale(1); }
  }
  /* quick scribbling nod */
  @keyframes actWrite {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30%      { transform: translateY(-4px) rotate(-2.5deg); }
    70%      { transform: translateY(-1px) rotate(2.5deg); }
  }
  /* Write lays text down; Edit picks at it - short sharp pecks in place,
     no travel, so surgical editing doesn't look like drafting */
  @keyframes actEdit {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25%      { transform: translate(-3px, -2px) rotate(-4deg); }
    60%      { transform: translate(2px, 0) rotate(3deg); }
  }
  /* sweeping left-right, like scanning a shelf */
  @keyframes actSearch {
    0%, 100% { transform: translateX(-14px) rotate(-2deg); }
    50%      { transform: translateX(14px) rotate(2deg); }
  }
  /* Grep sweeps sideways across everything; Read walks DOWN one file -
     a slow slide down the page, then a snap back to the top for the next */
  @keyframes actRead {
    0%   { transform: translateY(-7px) rotate(-1deg); }
    80%  { transform: translateY(7px) rotate(1deg); }
    90%  { transform: translateY(7px) rotate(1deg); }
    100% { transform: translateY(-7px) rotate(-1deg); }
  }
  /* ticking down a checklist: three discrete drops, no easing between them,
     because a todo list advances item by item and never glides */
  @keyframes actTodo {
    0%   { transform: translateY(-6px); }
    25%  { transform: translateY(-2px); }
    50%  { transform: translateY(2px); }
    75%  { transform: translateY(6px); }
    100% { transform: translateY(-6px); }
  }
  /* reaching out to something that isn't local: a slow yaw, leaning away
     and back as if talking to a server across the room */
  @keyframes actMcp {
    0%, 100% { transform: rotate(0deg) scaleX(1) translateX(0); }
    30%      { transform: rotate(-7deg) scaleX(0.94) translateX(-6px); }
    70%      { transform: rotate(7deg) scaleX(1.06) translateX(6px); }
  }
  /* buoyant drifting, out on the network */
  @keyframes actWeb {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-12px) scale(1.03); }
  }
  /* ---- "Claude is asking you something" ------------------------------
     The one state the pet exists to catch you on: everything else is
     progress you can ignore, this one is blocked until you look. So it gets
     the full treatment - an eager lean, a warm glow pulsing off the sprite's
     own outline, a question bubble that pops in beside it, and an amber
     badge - instead of just another wiggle. */
  .pet.act-ask {
    animation: actAsk 1.2s ease-in-out infinite,
               askGlow 1.2s ease-in-out infinite;
  }
  @keyframes actAsk {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    25%      { transform: translateY(-5px) rotate(-9deg) scale(1.05); }
    75%      { transform: translateY(-5px) rotate(9deg) scale(1.05); }
  }
  /* drop-shadow, not box-shadow: it follows the sprite's alpha, so the glow
     traces the robot's actual silhouette instead of a rectangle around it. */
  @keyframes askGlow {
    0%, 100% { filter: drop-shadow(0 0 3px #F0B94A99); }
    50%      { filter: drop-shadow(0 0 15px #FFC65C); }
  }
  /* ~60s unanswered: the glow itself quickens and burns hotter, on top of the
     same actAsk lean rather than replacing it - a layered class, same
     approach .stuck already takes relative to act-*. */
  .pet.act-ask.ask-escalated {
    animation: actAsk 0.7s ease-in-out infinite,
               askGlowEscalated 0.5s ease-in-out infinite;
  }
  @keyframes askGlowEscalated {
    0%, 100% { filter: drop-shadow(0 0 6px #E0431ACC); }
    50%      { filter: drop-shadow(0 0 22px #FF5C3A); }
  }
  #askBubble {
    position: absolute;
    /* Centred above the pet's head, not off in a corner: the corners are
       taken by the two usage gauges, and the first attempt (bottom-right)
       had the expanding ring washing over the 7d reset pill. margin-left
       rather than translateX because transform is animated here. */
    left: 50%;
    margin-left: -23px;
    /* Sits in the gap between the activity badge (ends ~30px) and the top of
       the sprite (~93px at the default 74% size), so the tail lands on the
       robot's head instead of inside its visor. */
    top: 30px;
    width: 46px;
    height: 46px;
    border-radius: 15px;
    background: #FFD79A;
    border: 3px solid #D85A30;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    font-size: 27px;
    font-weight: bold;
    color: #7A2E10;
    opacity: 0;
    transform: scale(0.4);
    pointer-events: none;
    z-index: 3; /* over the sprite: it must never end up behind an ear */
  }
  /* tail, pointing down at the pet */
  #askBubble::after {
    content: '';
    position: absolute;
    left: 12px;
    bottom: -13px;
    border: 7px solid transparent;
    border-top-color: #D85A30;
  }
  #askBubble.on {
    /* Overshoot lives in the keyframes rather than a springy timing function
       so the pop reads as a bounce without an elastic cubic-bezier. askBob's
       delay equals askPop's duration, so it takes the transform over exactly
       when the pop finishes. */
    animation: askPop 0.42s ease-out forwards,
               askBob 1.4s ease-in-out 0.42s infinite,
               askRing 1.4s ease-out 0.42s infinite;
  }
  @keyframes askPop {
    0%   { opacity: 0; transform: scale(0.4) translateY(8px); }
    60%  { opacity: 1; transform: scale(1.14) translateY(-3px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes askBob {
    0%, 100% { opacity: 1; transform: scale(1) translateY(0) rotate(-5deg); }
    50%      { opacity: 1; transform: scale(1.07) translateY(-5px) rotate(5deg); }
  }
  /* 14px, not 20: the ring has the activity badge just above it and a gauge
     to either side, and at 20 it bled into both. */
  @keyframes askRing {
    0%   { box-shadow: 0 0 0 0 #F0B94ACC; }
    100% { box-shadow: 0 0 0 14px #F0B94A00; }
  }
  /* ~60s of no answer (ASK_ESCALATE_MS in the JS): bigger, faster, and
     blinking - layered via higher specificity (.on.escalated beats .on) so
     the base pop-in/bob/ring keep running underneath rather than being
     torn out and rebuilt. */
  #askBubble.on.escalated {
    animation: askPop 0.42s ease-out forwards,
               askBobEscalated 0.7s ease-in-out infinite,
               askRingEscalated 0.9s ease-out infinite,
               askBlink 0.5s steps(1, end) infinite;
  }
  @keyframes askBobEscalated {
    0%, 100% { opacity: 1; transform: scale(1.2) translateY(0) rotate(-7deg); }
    50%      { opacity: 1; transform: scale(1.32) translateY(-7px) rotate(7deg); }
  }
  @keyframes askRingEscalated {
    0%   { box-shadow: 0 0 0 0 #E0431ACC; }
    100% { box-shadow: 0 0 0 20px #E0431A00; }
  }
  @keyframes askBlink {
    0%, 49%   { background: #FFD79A; }
    50%, 100% { background: #FF8A5C; }
  }
  #activityBadge.ask {
    background: #C9481FF2;
    color: #FFF3E2;
  }
  /* slow wind-up spin: work handed off to a subagent */
  @keyframes actAgent {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  /* the antenna spark keeps time with the body: frantic while working,
     and it whirls outright while a subagent is running. */
  .pet[class*="act-"] .spark {
    animation: sparkSpin 1.1s linear infinite, sparkPulse 0.55s ease-in-out infinite;
  }
  .pet.act-ask .spark {
    animation: sparkSpin 6s linear infinite, sparkPulse 0.4s ease-in-out infinite;
  }
  /* the visor glows while busy, so the pet reads as "on" even mid-frame */
  #visor { transition: fill 0.4s ease-out; }
  .pet[class*="act-"] #visor { fill: #33251C; }

  /* ---- near usage limit --------------------------------------------
     Independent of whichever act-* animation is currently playing: this
     only recolors the body and reveals a dripping sweat drop, so "close to
     the 5h cap" reads on the character itself instead of only in the corner
     gauge - without fighting for the .pet element's own `animation`
     property (which act-* already owns). */
  #petBody { transition: fill 0.6s ease; }
  .pet.near-limit #petBody { fill: #C24632; }
  #sweat {
    opacity: 0;
    transform-origin: 171px 42px;
  }
  .pet.near-limit #sweat {
    animation: sweatDrip 1.4s ease-in infinite;
  }
  @keyframes sweatDrip {
    0%   { opacity: 0.9; transform: translateY(0); }
    80%  { opacity: 0.35; transform: translateY(14px); }
    100% { opacity: 0; transform: translateY(16px); }
  }
  /* worse than plain near-limit: pegged near the cap AND the reset is far
     off, so there's no relief coming - a hotter red and a faster drip.
     Declared after the near-limit rules above so it wins the specificity
     tie (same two-class-plus-id shape) when both classes are present. */
  .pet.near-limit.critical-limit #petBody { fill: #A8291B; }
  .pet.near-limit.critical-limit #sweat {
    animation: sweatDrip 0.7s ease-in infinite;
  }
  /* ---- near limit, but the reset is basically already here -----------
     The opposite reaction to the same near-limit state: relief instead of
     dread. Layered as a second class on top of near-limit rather than
     replacing it - same higher-specificity-wins approach as .stuck vs
     act-*. Softer amber tint instead of the stressed red, a gentle
     breathing pulse instead of the sweat drip. */
  .pet.near-limit.resetting-soon #petBody {
    fill: #E8B863;
    animation: reliefPulse 1.6s ease-in-out infinite;
  }
  .pet.near-limit.resetting-soon #sweat { opacity: 0; animation: none; }
  @keyframes reliefPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.8; }
  }

  /* ---- stuck tool ----------------------------------------------------
     A tool that's been running much longer than usual gets an impatient,
     faster foot-tap and a slightly darker visor - layered on the FEET, not
     on .pet itself, so it doesn't fight or replace whatever act-* body
     animation is already playing (Bash judder, Edit pecks, etc). */
  .pet.stuck .foot {
    animation: stompImpatient 0.28s ease-in-out infinite;
  }
  @keyframes stompImpatient {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  /* Declared after the existing act-* visor rule so it wins the specificity
     tie whenever a tool is both "running" and "stuck". */
  .pet.stuck #visor { fill: #3A1710; }

  .pet.jump {
    animation: jump 0.55s ease-out;
  }
  @keyframes jump {
    0%   { transform: translateY(0) scaleY(1); }
    25%  { transform: translateY(0) scaleY(0.82); }
    55%  { transform: translateY(-45px) scaleY(1.08); }
    80%  { transform: translateY(0) scaleY(0.92); }
    100% { transform: translateY(0) scaleY(1); }
  }
  .foot {
    animation: stomp 2.2s ease-in-out infinite;
    transform-origin: center top;
  }
  .footL { animation-delay: 0s; }
  .footR { animation-delay: 1.1s; }
  @keyframes stomp {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  .spark {
    animation: sparkSpin 6s linear infinite, sparkPulse 1.8s ease-in-out infinite;
    transform-origin: 100px 6px;
  }
  @keyframes sparkSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes sparkPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  #eyesBlink, #eyesHappy { opacity: 0; }
  .bubble { opacity: 0; }
  .bubbleText { font-family: 'Courier New', monospace; font-weight: bold; fill: #4A1B0C; }
  .heart { opacity: 0; fill: #D85A30; }
</style>
</head>
<body>
<div id="stage">
<div id="petWrap">
<svg id="petSvg" class="pet" width="230" height="172" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">

  <!-- shadow -->
  <ellipse cx="100" cy="132" rx="46" ry="8" fill="#000000" opacity="0.15"/>

  <!-- antenna -->
  <line x1="100" y1="20" x2="100" y2="8" stroke="#B94A24" stroke-width="4"/>
  <g class="spark">
    <path d="M100 -2 L103.5 4.5 L110 4.5 L105 8.5 L107 15 L100 11 L93 15 L95 8.5 L90 4.5 L96.5 4.5 Z" fill="#F0997B"/>
  </g>

  <!-- feet -->
  <rect class="foot footL" x="53" y="94" width="30" height="22" rx="8" fill="#D2703C" stroke="#FFF7F0" stroke-width="5"/>
  <rect class="foot footR" x="117" y="94" width="30" height="22" rx="8" fill="#D2703C" stroke="#FFF7F0" stroke-width="5"/>

  <!-- ears -->
  <rect x="12" y="38" width="22" height="28" rx="9" fill="#D2703C" stroke="#FFF7F0" stroke-width="5"/>
  <rect x="166" y="38" width="22" height="28" rx="9" fill="#D2703C" stroke="#FFF7F0" stroke-width="5"/>

  <!-- body -->
  <rect id="petBody" x="30" y="16" width="140" height="88" rx="26" fill="#D2703C" stroke="#FFF7F0" stroke-width="5"/>

  <!-- visor / face screen -->
  <rect id="visor" x="50" y="32" width="100" height="42" rx="13" fill="#20201E"/>

  <!-- default eyes -->
  <!-- The glyphs are swapped per activity from pollActivity(), not duplicated
       into one <g> per state - two text nodes cover all of them. -->
  <!-- The duplicated class= on each of these is what split mode looks them up
       by: a cloned band carries the same ids, so getElementById would only
       ever find the original's. Ids stay because the CSS keys off them. -->
  <g id="eyesDefault" class="eyesDefault" font-family="Courier New, monospace" font-weight="bold" fill="#F0997B" text-anchor="middle">
    <text id="eyeL" class="eyeL" x="82" y="59" font-size="24">&lt;</text>
    <text id="eyeR" class="eyeR" x="118" y="59" font-size="24">&gt;</text>
  </g>

  <!-- blink eyes -->
  <g id="eyesBlink" class="eyesBlink" fill="#F0997B">
    <rect x="72" y="49" width="20" height="5.5" rx="2.5"/>
    <rect x="108" y="49" width="20" height="5.5" rx="2.5"/>
  </g>

  <!-- happy eyes on click -->
  <g id="eyesHappy" font-family="Courier New, monospace" font-weight="bold" fill="#F0997B" text-anchor="middle">
    <text x="82" y="57" font-size="20">^</text>
    <text x="118" y="57" font-size="20">^</text>
  </g>

  <!-- cheeks -->
  <rect x="42" y="79" width="11" height="6" rx="2" fill="#F5C4B3" opacity="0.85"/>
  <rect x="147" y="79" width="11" height="6" rx="2" fill="#F5C4B3" opacity="0.85"/>

  <!-- sweat drop: shown only while the 5h usage gauge is near its limit -->
  <text id="sweat" x="171" y="42" font-size="18">&#128167;</text>

  <!-- speech bubble -->
  <g id="bubbleGroup" class="bubble" transform="translate(96,-52)">
    <rect x="0" y="0" width="86" height="30" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="2"/>
    <path d="M22 30 L14 41 L34 30 Z" fill="#FAECE7" stroke="#D85A30" stroke-width="2"/>
    <text id="bubbleText" class="bubbleText" x="43" y="20" font-size="12" text-anchor="middle">&gt; hi_</text>
  </g>

  <!-- heart burst -->
  <text id="heart1" class="heart" x="150" y="28" font-size="18">&#9829;</text>
</svg>
</div>

<!-- Usage gauges: live (5h) and weekly (7d), from claude-usage-statusline.ps1.
     Deliberately siblings of petWrap, not children of the pet's own SVG - see
     the .gauge comment in <style> for why. Each is its own small SVG pinned
     to a top corner of the window, so its size is fixed and never rides the
     pet-size slider or the bob animation. Ring r=20/stroke 6, percentage in
     bold inside it, "5h"/"7d" above, reset countdown below. -->
<svg id="gaugeLive" class="gauge" width="66" height="88" viewBox="0 0 66 88" opacity="0">
  <rect x="18" y="0" width="30" height="17" rx="8.5" fill="#12100FD9"/>
  <text x="33" y="13" class="gaugeText" font-size="11" font-weight="bold" text-anchor="middle">5h</text>
  <circle cx="33" cy="46" r="23" fill="#12100FD9"/>
  <circle cx="33" cy="46" r="19" fill="none" stroke="#FFFFFF33" stroke-width="6"/>
  <circle id="gaugeLiveArc" cx="33" cy="46" r="19" fill="none" stroke="#7CD992" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 33 46)" stroke-dasharray="0 119.4"/>
  <text id="gaugeLiveValue" x="33" y="52" class="gaugeText" font-size="17" font-weight="bold" text-anchor="middle">0%</text>
  <g id="gaugeLiveResetBox" opacity="0">
    <rect x="1" y="70" width="64" height="18" rx="9" fill="#12100FD9"/>
    <text id="gaugeLiveReset" x="33" y="83" class="gaugeText" font-size="12" font-weight="bold" text-anchor="middle"></text>
  </g>
</svg>
<svg id="gaugeWeek" class="gauge" width="66" height="88" viewBox="0 0 66 88" opacity="0">
  <rect x="18" y="0" width="30" height="17" rx="8.5" fill="#12100FD9"/>
  <text x="33" y="13" class="gaugeText" font-size="11" font-weight="bold" text-anchor="middle">7d</text>
  <circle cx="33" cy="46" r="23" fill="#12100FD9"/>
  <circle cx="33" cy="46" r="19" fill="none" stroke="#FFFFFF33" stroke-width="6"/>
  <circle id="gaugeWeekArc" cx="33" cy="46" r="19" fill="none" stroke="#7CD992" stroke-width="6"
          stroke-linecap="round" transform="rotate(-90 33 46)" stroke-dasharray="0 119.4"/>
  <text id="gaugeWeekValue" x="33" y="52" class="gaugeText" font-size="17" font-weight="bold" text-anchor="middle">0%</text>
  <g id="gaugeWeekResetBox" opacity="0">
    <rect x="1" y="70" width="64" height="18" rx="9" fill="#12100FD9"/>
    <text id="gaugeWeekReset" x="33" y="83" class="gaugeText" font-size="12" font-weight="bold" text-anchor="middle"></text>
  </g>
</svg>
<!-- dir="ltr" is required, not decorative: the page is dir="rtl", and Unicode
     bidi mirrors '>' to '<' and repositions the whole run in an RTL context -
     "> Bash" rendered as "Bash <" without this, confirmed with a screenshot. -->
<div id="activityBadge" dir="ltr"></div>
<!-- One chip per OTHER live Claude Code session (see #sessions in the CSS).
     dir="ltr" for the same reason as the badge: tool names are ASCII. -->
<div id="sessions" dir="ltr"></div>
<!-- Pops in only while Claude is waiting on an answer from you. Lives in the
     HTML layer, not the pet's SVG: the sprite's viewBox has no room left
     above the antenna, and out here it can also sit above the sprite in the
     stacking order instead of behind an ear. -->
<div id="askBubble">?</div>
</div>

<script>
  const pet = document.getElementById('petSvg');
  const petWrap = document.getElementById('petWrap');
  // Bound to the WRAPPER, not the svg: in split mode the original svg is
  // clipped down to its own band, and a clip-path removes the clipped-away
  // area from hit-testing too - so half the mascot would stop responding to
  // clicks/drag/hover. The wrapper is the same box and is never clipped.
  petWrap.addEventListener('mouseenter', () => petWrap.classList.add('pet-hover'));
  petWrap.addEventListener('mouseleave', () => petWrap.classList.remove('pet-hover'));
  const heart = document.getElementById('heart1');
  const bubbleGroup = document.getElementById('bubbleGroup');
  const bubbleText = document.getElementById('bubbleText');
  const eyesDefault = document.getElementById('eyesDefault');
  const eyesBlink = document.getElementById('eyesBlink');
  const eyesHappy = document.getElementById('eyesHappy');
  const petBands = [];   // split-mode clones, one per band AFTER the first
  let animating = false;

  const phrases = ['> hi_', '> :)_', '> ok_', '> run_', '> yo_'];

  function blinkOnce() {
    eyesDefault.style.opacity = '0';
    eyesBlink.style.opacity = '1';
    blinkBands('0', '1');
    setTimeout(() => {
      eyesDefault.style.opacity = '1';
      eyesBlink.style.opacity = '0';
      blinkBands('1', '0');
    }, 140);
  }

  // Split mode only: the clone bands blink with the original, otherwise just
  // one strip of the face would ever close its eyes. No-op with no clones,
  // which is every single-session moment - see petBands below.
  function blinkBands(defaultOpacity, blinkOpacity) {
    petBands.forEach((band) => {
      band.querySelector('.eyesDefault').style.opacity = defaultOpacity;
      band.querySelector('.eyesBlink').style.opacity = blinkOpacity;
    });
  }

  function scheduleBlink() {
    const delay = 2600 + Math.random() * 2600;
    setTimeout(() => {
      blinkOnce();
      scheduleBlink();
    }, delay);
  }
  scheduleBlink();

  function applyPetScale(pct) {
    petWrap.style.setProperty('--pet-scale', (parseInt(pct, 10) / 100 || 1).toString());
  }

  function handlePetClick() {
    if (animating) return;
    animating = true;
    pet.classList.add('jump');

    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_claude) {
      window.pywebview.api.open_claude();
    }

    eyesDefault.style.opacity = '0';
    eyesHappy.style.opacity = '1';

    heart.style.transition = 'none';
    heart.style.opacity = '1';
    heart.style.transform = 'translateY(0)';
    requestAnimationFrame(() => {
      heart.style.transition = 'opacity 1.1s ease-out, transform 1.1s ease-out';
      heart.style.opacity = '0';
      heart.style.transform = 'translateY(-40px)';
    });

    bubbleText.textContent = phrases[Math.floor(Math.random() * phrases.length)];
    bubbleGroup.style.transition = 'none';
    bubbleGroup.style.opacity = '1';
    setTimeout(() => {
      bubbleGroup.style.transition = 'opacity 0.8s ease-out';
      bubbleGroup.style.opacity = '0';
    }, 1300);

    setTimeout(() => {
      pet.classList.remove('jump');
      eyesHappy.style.opacity = '0';
      eyesDefault.style.opacity = '1';
      animating = false;
    }, 600);
  }

  let dragStartX, dragStartY, isDragging = false, movedDistance = 0;
  const DRAG_THRESHOLD = 6;

  petWrap.addEventListener('mousedown', (e) => {
    if (e.button !== 0) {           // middle/right must not start a drag
      if (e.button === 1) e.preventDefault();  // block middle-click autoscroll
      return;
    }
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    movedDistance = 0;
    isDragging = false;
    if (window.pywebview && window.pywebview.api && window.pywebview.api.start_drag) {
      window.pywebview.api.start_drag();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (dragStartX === undefined) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    movedDistance += Math.abs(dx) + Math.abs(dy);
    if (movedDistance > DRAG_THRESHOLD) {
      isDragging = true;
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drag_move) {
        window.pywebview.api.drag_move(dx, dy);
      }
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    }
  });

  window.addEventListener('mouseup', () => {
    if (dragStartX === undefined) return;
    if (isDragging) {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drop) {
        window.pywebview.api.drop();
      }
    } else {
      handlePetClick();
    }
    dragStartX = undefined;
    isDragging = false;
  });

  // Seed the pet's size from the saved config once the bridge is ready.
  window.addEventListener('pywebviewready', () => {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.get_pet_config) {
      window.pywebview.api.get_pet_config().then((cfg) => {
        if (cfg && cfg.size) applyPetScale(cfg.size);
        if (cfg) applySessionMode(cfg.session_mode);   // unset/unknown -> split
      });
    }
    pollUsage();
    setInterval(pollUsage, 15000);
    pollActivity();
    setInterval(pollActivity, 1200);
  });

  // Live (5h) / weekly (7d) usage gauges, fed by claude-usage-statusline.ps1
  // via usage.json. Hidden (opacity 0) whenever there's no fresh data - no
  // active Claude Code session, or the statusline bridge isn't installed.
  const GAUGE_CIRC = 2 * Math.PI * 19; // matches the gauge circles' r=19

  function gaugeColor(pct) {
    if (pct >= 90) return '#E05C3A';
    if (pct >= 70) return '#F0B94A';
    return '#7CD992';
  }

  // resets_at comes either as epoch seconds (real claude-usage-statusline.ps1
  // output) or an ISO string (test fixtures) - handle both. Factored out of
  // formatResetIn so pollUsage() can also ask "how soon" without
  // reimplementing the epoch/ISO parsing.
  function minutesToReset(resetsAt) {
    if (resetsAt == null) return null;
    const ts = typeof resetsAt === 'number' ? resetsAt * 1000 : Date.parse(resetsAt);
    if (!ts || Number.isNaN(ts)) return null;
    const mins = Math.round((ts - Date.now()) / 60000);
    return mins > 0 ? mins : null;
  }

  // Rendered as "in 3h20m" rather than a bare "3h20m": the countdown sits
  // under a percentage, and without the preposition it reads as another
  // quantity of usage instead of the time until the quota comes back.
  function formatResetIn(resetsAt) {
    const mins = minutesToReset(resetsAt);
    if (mins == null) return '';
    const hrs = Math.floor(mins / 60);
    // h:mm, never "2ש39ד" - Hebrew letters interleaved with digits is exactly
    // what the bidi algorithm tears apart, and it also overflows the pill.
    if (hrs < 24) return 'עוד ' + hrs + ':' + String(mins % 60).padStart(2, '0');
    return 'עוד ' + Math.floor(hrs / 24) + ' ימ׳';
  }

  function setGauge(id, pct, resetsAt) {
    const g = document.getElementById(id);
    if (pct == null) { g.style.opacity = '0'; return; }
    const clamped = Math.max(0, Math.min(100, pct));
    const arc = document.getElementById(id + 'Arc');
    arc.setAttribute('stroke-dasharray', `${(clamped / 100 * GAUGE_CIRC).toFixed(2)} ${GAUGE_CIRC}`);
    arc.setAttribute('stroke', gaugeColor(clamped));
    document.getElementById(id + 'Value').textContent = Math.round(clamped) + '%';
    const reset = formatResetIn(resetsAt);
    document.getElementById(id + 'Reset').textContent = reset;
    // Hide the whole pill, not just blank its text - an empty dark pill under
    // the ring reads as a rendering glitch.
    document.getElementById(id + 'ResetBox').setAttribute('opacity', reset ? '1' : '0');
    g.style.opacity = '1';
  }

  // The body only turns stressed once usage crosses this - a live gauge in
  // the corner already reports every intermediate percentage, so the
  // character reacting all the way from 1% would just be noise.
  const NEAR_LIMIT_PCT = 85;
  // Under this many minutes-to-reset, being near the cap stops reading as
  // "about to run out" and starts reading as "already basically reset" -
  // the pet should anticipate relief, not dread, when the clock is this
  // close. Picked as "the reset pill would show single-digit minutes".
  const RESET_SOON_MINS = 15;
  // The one tier worse than plain near-limit: pegged at (near) 100% AND the
  // reset is nowhere close, so there's no relief to anticipate either.
  const CRITICAL_LIMIT_PCT = 95;

  function pollUsage() {
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.get_usage)) return;
    window.pywebview.api.get_usage().then((u) => {
      const fiveHourPct = u && u.five_hour ? u.five_hour.used_percentage : null;
      const fiveHourResetsAt = u && u.five_hour ? u.five_hour.resets_at : null;
      setGauge('gaugeLive', fiveHourPct, fiveHourResetsAt);
      setGauge('gaugeWeek', u && u.seven_day ? u.seven_day.used_percentage : null, u && u.seven_day ? u.seven_day.resets_at : null);
      const nearLimit = fiveHourPct != null && fiveHourPct >= NEAR_LIMIT_PCT;
      const minsLeft = minutesToReset(fiveHourResetsAt);
      const resettingSoon = nearLimit && minsLeft != null && minsLeft <= RESET_SOON_MINS;
      pet.classList.toggle('near-limit', nearLimit);
      pet.classList.toggle('resetting-soon', resettingSoon);
      // Mutually exclusive with resetting-soon on purpose: relief and dread
      // are opposite reactions to the same "near-limit" state, not a stack.
      pet.classList.toggle('critical-limit', nearLimit && !resettingSoon && fiveHourPct >= CRITICAL_LIMIT_PCT);
    }).catch(() => {});
  }

  // Activity badge: "חושב..." while Claude is reasoning, the tool name while
  // one is running, hidden the rest of the time. Fed by
  // claude-activity-status.ps1 (a hook, not a poller) via activity.json - see
  // pet_app.py's ACTIVITY_STALE_SECS for why 1.2s here is safe (hooks fire
  // multiple times per turn, so real activity never looks stale at this
  // cadence).
  // MCP tool names are fully-qualified and can be very long, e.g.
  // "mcp__claude_ai_Adobe_for_creativity__image_apply_adjustments" - the
  // final "__"-separated segment is the part a human actually reads.
  function shortToolName(tool) {
    const parts = tool.split('__');
    return parts[parts.length - 1] || tool;
  }

  // Tool -> which body animation the pet plays. Matched on the SHORT name, so
  // an MCP tool like mcp__..__browser_navigate lands on the same rule as a
  // built-in one with a similar job. Order matters: first regex that hits
  // wins, and ACT_DEFAULT catches everything unrecognised so a new tool still
  // makes the pet visibly busy instead of looking idle mid-run.
  const ACT_DEFAULT = 'act-busy';
  // The heaviest-used tools get their own rule ahead of the family rule they
  // would otherwise fall into (Edit before Write, Read before Grep,
  // PowerShell before Bash): those pairs run often enough that sharing one
  // animation made the pet look stuck on the same gesture for minutes.
  const ACT_RULES = [
    [/^TodoWrite$/i, 'act-todo'],
    [/^PowerShell$/i, 'act-pwsh'],
    [/^(Bash|Shell|KillShell|BashOutput)$/i, 'act-shell'],
    [/^(AskUserQuestion|ExitPlanMode|EnterPlanMode)$/i, 'act-ask'],
    [/^(Read|NotebookRead)$/i, 'act-read'],
    [/^(Glob|Grep|LS|Explore|search|smart_search|ctx_search)$/i, 'act-search'],
    [/^Edit$/i, 'act-edit'],
    [/^(Write|NotebookEdit|MultiEdit|Artifact)$/i, 'act-write'],
    [/^(WebFetch|WebSearch|fetch|navigate)$/i, 'act-web'],
    [/^(Agent|Task|SendMessage|Skill)$/i, 'act-agent'],
    [/browser|fetch|search/i, 'act-web'],
  ];
  const ALL_ACT_CLASSES = ['act-think', 'act-shell', 'act-git', 'act-pwsh',
                           'act-write', 'act-edit', 'act-search', 'act-read',
                           'act-todo', 'act-mcp', 'act-web', 'act-ask',
                           'act-agent', ACT_DEFAULT];

  // The face changes with the body. Motion alone reads from across the room
  // but is ambiguous up close - "tilting" and "leaning" are the same gesture
  // at a glance - so each activity also gets its own eyes.
  const EYES_IDLE = ['<', '>'];
  const ACT_EYES = {
    'act-think':  ['o', 'o'],   // wide, pondering
    'act-shell':  ['$', '$'],   // a shell prompt in each eye
    'act-git':    ['Y', 'Y'],   // a branch/merge fork, git's own glyph
    'act-pwsh':   ['>', '>'],   // the other shell's prompt
    'act-write':  ['=', '='],   // narrowed, concentrating
    'act-edit':   ['/', '\\'],  // nib strokes, picking at a line
    'act-search': ['@', '@'],   // scanning lenses
    'act-read':   ['[', ']'],   // a page held open
    'act-todo':   ['v', 'v'],   // ticking boxes
    'act-mcp':    ['+', '+'],   // plugged into something external
    'act-web':    ['~', '~'],   // off surfing
    'act-ask':    ['?', '?'],   // waiting on you
    'act-agent':  ['*', '*'],   // handed off, spinning up
    'act-busy':   ['-', '-'],
  };
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');

  function setEyes(cls) {
    const [l, r] = ACT_EYES[cls] || EYES_IDLE;
    eyeL.textContent = l;
    eyeR.textContent = r;
  }

  // Commands worth splitting out of the generic act-shell bucket, checked
  // against a.command (the raw shell text claude-activity-status.ps1 now
  // captures for Bash-family tools). git is the flagship: common enough, and
  // distinctive enough a personality, to earn its own animation. A second
  // command family can join this list later without any new machinery - one
  // more [regex, class] pair here plus a CSS animation for it.
  const ACT_SHELL_SUBRULES = [
    [/^\s*git\b/i, 'act-git'],
  ];

  function activityClass(a) {
    if (!a || a.state === 'idle') return null;
    if (a.state !== 'tool' || !a.tool) return 'act-think';
    const name = shortToolName(a.tool);
    for (const [re, cls] of ACT_RULES) {
      if (!re.test(name)) continue;
      if (cls === 'act-shell' && a.command) {
        for (const [subRe, subCls] of ACT_SHELL_SUBRULES) {
          if (subRe.test(a.command)) return subCls;
        }
      }
      return cls;
    }
    // An MCP tool whose short name matched a rule above keeps that rule on
    // purpose (browser_navigate really is web work). Only the leftovers land
    // here - and "some server is doing something" is still more informative
    // than the generic busy bob.
    if (/^mcp__/i.test(a.tool)) return 'act-mcp';
    return ACT_DEFAULT;
  }

  const HEBREW = /[֐-׿]/;
  const askBubble = document.getElementById('askBubble');

  function setBadge(badge, text) {
    // The badge is dir="ltr" so that "> Bash" doesn't get mirrored into
    // "Bash <" by the RTL page - but a Hebrew label needs the opposite, and
    // the trailing "_" of the terminal-style labels attaches to the wrong end
    // of a Hebrew run. So Hebrew states get rtl and no ASCII decoration.
    badge.setAttribute('dir', HEBREW.test(text) ? 'rtl' : 'ltr');
    badge.textContent = text;
  }

  // Chips for the OTHER live sessions. Rebuilt from scratch only when the
  // text actually changes: re-creating the nodes every 1.2s poll would restart
  // chipPulse mid-beat and the whole stack would twitch in lockstep.
  const sessionsEl = document.getElementById('sessions');
  const MAX_CHIPS = 3;
  let lastChipKey = '';

  function renderSessions(others) {
    const list = others || [];
    const shown = list.slice(0, MAX_CHIPS).map((s) => ({
      label: s.label || 'session',
      tool: s.state === 'tool' && s.tool ? shortToolName(s.tool) : '…',
      thinking: s.state !== 'tool',
    }));
    const extra = list.length - shown.length;
    const key = JSON.stringify([shown, extra]);
    if (key === lastChipKey) return;
    lastChipKey = key;
    sessionsEl.textContent = '';
    shown.forEach((s, i) => {
      const chip = document.createElement('div');
      chip.className = 'sessionChip' + (s.thinking ? ' thinking' : '');
      // Staggered so three busy sessions read as three separate heartbeats.
      chip.style.animationDelay = (i * 0.35) + 's';
      const dot = document.createElement('span');
      dot.className = 'dot';
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(s.label + ' ' + s.tool));
      sessionsEl.appendChild(chip);
    });
    if (extra > 0) {
      const more = document.createElement('div');
      more.className = 'sessionChip';
      more.textContent = '+' + extra;
      sessionsEl.appendChild(more);
    }
  }

  // "Stuck" tracking is entirely client-side: activity.json has no
  // started_at field (that would mean touching the PowerShell hook), but the
  // same tool+session showing up across consecutive 1.2s polls is just as
  // good a signal that it's still the same run, not a new one.
  const STUCK_MS = 30000;
  let lastToolKey = null;
  let toolStartedAt = 0;

  function updateStuck(a) {
    if (!a || a.state !== 'tool' || !a.tool) {
      lastToolKey = null;
      pet.classList.remove('stuck');
      return;
    }
    const key = a.tool + '|' + (a.label || '');
    if (key !== lastToolKey) {
      lastToolKey = key;
      toolStartedAt = Date.now();
    }
    pet.classList.toggle('stuck', Date.now() - toolStartedAt > STUCK_MS);
  }

  // Same house pattern as updateStuck: activity.json has no started_at, so
  // elapsed time is tracked client-side across 1.2s polls. Keyed on
  // tool/label rather than a question id (there isn't one) - a brand new
  // question after you answer the last one still shows up as a fresh
  // AskUserQuestion call, which is enough to restart the clock instead of
  // carrying over a stale escalation from the previous question.
  const ASK_ESCALATE_MS = 60000;
  let lastAskKey = null;
  let askStartedAt = 0;

  function updateAskEscalation(a, cls) {
    if (cls !== 'act-ask') {
      lastAskKey = null;
      askBubble.classList.remove('escalated');
      pet.classList.remove('ask-escalated');
      return;
    }
    const key = (a.tool || '') + '|' + (a.label || '');
    if (key !== lastAskKey) {
      lastAskKey = key;
      askStartedAt = Date.now();
    }
    const escalated = Date.now() - askStartedAt > ASK_ESCALATE_MS;
    askBubble.classList.toggle('escalated', escalated);
    pet.classList.toggle('ask-escalated', escalated);
  }

  // ---------------------------------------------------------------------
  // Several Claude Code sessions at once. Two answers, picked in settings:
  //
  //   'split' (default) - the body is physically divided into one vertical
  //     band per live session, each band animating ITS session's activity.
  //     N is whatever is live right now: 2, 5, 11, no special cases.
  //   'lock' - one session drives the whole body and keeps it until it stops
  //     working, instead of the body hopping to whichever session moved last.
  //
  // Both are pure display policy over the sessions the backend already
  // reports; read_activity() still picks "primary" the same way it always did.
  let sessionMode = 'split';

  function applySessionMode(mode) {
    // Called from Python when the setting changes, so switching modes takes
    // effect without restarting the pet. Anything unknown means split.
    sessionMode = mode === 'lock' ? 'lock' : 'split';
  }

  // The session lock mode is holding on to. Released only when that session
  // stops reporting as working - re-deciding every poll is the exact
  // behaviour lock mode exists to suppress.
  let lockedSessionId = null;

  // Band order is by session id, NOT by recency: two busy sessions swap which
  // one is "newest" every couple of seconds, and ordering bands by that would
  // make the halves of the pet trade places constantly. The id is arbitrary
  // but it holds still.
  function bandOrder(sessions) {
    return sessions.slice().sort((x, y) =>
      String(x.session_id || '').localeCompare(String(y.session_id || '')));
  }

  function pickBodySession(sessions, primary) {
    if (sessions.length < 2) {
      // Lock onto the only session there is, so that when a second one shows
      // up the body stays with the one you were already watching.
      lockedSessionId = sessions.length ? (sessions[0].session_id || null) : null;
      return primary;
    }
    if (sessionMode === 'lock') {
      const held = sessions.find((s) => s.session_id && s.session_id === lockedSessionId);
      if (held) return held;
      lockedSessionId = primary.session_id || null;   // lock died -> adopt the new primary
      return primary;
    }
    // Split: the original svg is band 0 and can't be moved, so the body (and
    // with it the badge, the eyes, the stuck/ask treatment) follows band 0.
    return bandOrder(sessions)[0];
  }

  // Band i of n covers [i/n, (i+1)/n] of the width. Written as insets from
  // each edge: left inset i/n, right inset 1-(i+1)/n. Band i's right edge is
  // then exactly band i+1's left edge, so n bands tile 0%-100% with no gap
  // and no overlap (n=3: 0-33.3, 33.3-66.6, 66.6-100).
  function bandClip(i, n) {
    if (n < 2) return '';   // one session -> no clip at all, the plain pet
    return 'inset(0 ' + (100 - (i + 1) * 100 / n) + '% 0 ' + (i * 100 / n) + '%)';
  }

  function setClip(el, value) {
    if (el.style.clipPath === value) return;
    el.style.clipPath = value;
    // Back to one session -> leave the markup as it was found, not with an
    // empty style="" hanging off the pet.
    if (!el.style.length) el.removeAttribute('style');
  }

  // Whole-pet state that isn't per session: every band should sweat when the
  // usage limit is close, not just the first one.
  const BAND_MIRROR_CLASSES = ['near-limit', 'critical-limit', 'resetting-soon'];

  function syncBands(n) {
    // Clones are only created/destroyed when the session COUNT changes.
    // Rebuilding them every 1.2s poll would restart every band's animation
    // mid-beat - the same stutter lastChipKey avoids for the chips.
    while (petBands.length > n - 1) petWrap.removeChild(petBands.pop());
    while (petBands.length < n - 1) {
      const clone = pet.cloneNode(true);
      clone.removeAttribute('id');   // inner ids stay: the CSS keys off them
      // A clone taken mid-click would keep that click's inline styles (happy
      // eyes, floating heart) frozen forever. Nothing in the markup uses
      // style= , so dropping all of them leaves only the intended state.
      clone.querySelectorAll('[style]').forEach((el) => el.removeAttribute('style'));
      clone.setAttribute('class', 'pet petBand');
      petBands.push(clone);
      petWrap.appendChild(clone);
    }
  }

  function paintBand(band, cls, extraClasses) {
    const want = ['pet', 'petBand'].concat(extraClasses, cls || []).join(' ');
    if (band.getAttribute('class') === want) return;   // same guard as the body's
    band.setAttribute('class', want);
    const [l, r] = ACT_EYES[cls] || EYES_IDLE;
    band.querySelector('.eyeL').textContent = l;
    band.querySelector('.eyeR').textContent = r;
  }

  function renderBands(sessions) {
    const split = sessionMode === 'split' && sessions.length > 1;
    const order = split ? bandOrder(sessions) : [];
    const n = split ? order.length : 1;
    syncBands(n);
    setClip(pet, bandClip(0, n));   // '' when n === 1: the untouched single pet
    const mirror = BAND_MIRROR_CLASSES.filter((c) => pet.classList.contains(c));
    petBands.forEach((band, i) => {
      setClip(band, bandClip(i + 1, n));
      paintBand(band, activityClass(order[i + 1]), mirror);
    });
  }

  function pollActivity() {
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.get_activity)) return;
    window.pywebview.api.get_activity().then((primary) => {
      // primary + others, all the same shape - which one drives the body is a
      // display choice from here on, not the backend's.
      const sessions = primary ? [primary].concat(primary.others || []) : [];
      const a = pickBodySession(sessions, primary);
      renderBands(sessions);
      updateStuck(a);
      const badge = document.getElementById('activityBadge');
      const cls = activityClass(a);
      updateAskEscalation(a, cls);
      renderSessions(sessions.filter((s) => s !== a));
      if (!cls) {
        badge.style.opacity = '0';
        badge.classList.remove('ask');
        askBubble.classList.remove('on');
        pet.classList.remove(...ALL_ACT_CLASSES);
        setEyes(null);
        return;
      }
      // With other sessions on screen the badge alone is ambiguous - it has
      // to say WHICH project the body is currently animating. Alone, the
      // label is just noise, so it only appears when there is a second
      // session to be confused with.
      const prefix = (sessions.length > 1 && a.label) ? a.label + ' ' : '';
      // "git" alone in the badge is fine for the class name but reads as
      // less than the tool name it replaced - "git commit" is the whole
      // reason it got its own animation, so surface that subcommand instead.
      const gitSub = cls === 'act-git' && a.command && a.command.match(/^\s*git\s+(\S+)/i);
      if (cls === 'act-ask') {
        setBadge(badge, 'שאלה בשבילך');
      } else if (gitSub) {
        setBadge(badge, prefix + '> git ' + gitSub[1]);
      } else if (a.state === 'tool' && a.tool) {
        setBadge(badge, prefix + '> ' + shortToolName(a.tool));
      } else {
        setBadge(badge, prefix ? prefix + '> …' : 'חושב…');
      }
      badge.classList.toggle('ask', cls === 'act-ask');
      badge.style.opacity = '1';
      // Re-adding a class that is already there would restart the animation
      // on every 1.2s poll, which turns a smooth loop into a stutter - and
      // for the ask bubble it would replay the pop-in forever.
      if (!pet.classList.contains(cls)) {
        pet.classList.remove(...ALL_ACT_CLASSES);
        pet.classList.add(cls);
        setEyes(cls);
      }
      askBubble.classList.toggle('on', cls === 'act-ask');
    }).catch(() => {});
  }

  // Middle-click the pet -> open settings in its own native window (Python).
  petWrap.addEventListener('auxclick', (e) => {
    if (e.button !== 1) return;
    e.preventDefault();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_settings_window) {
      window.pywebview.api.open_settings_window();
    }
  });
</script>
</body>
</html>
