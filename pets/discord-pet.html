<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>Discord Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  .stage {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: transparent;
  }

  #petWrap {
    transition: transform 0.2s ease-out;
    transform-origin: center bottom;
    transform: scale(var(--pet-scale, 1));
    position: relative;
  }

  svg#discordPetSvg {
    width: 140px;
    height: auto;
    overflow: visible;
    cursor: pointer;
  }

  /* ================= shadow ================= */
  #shadow {
    transform-origin: 150px 236px;
    animation: shadowIdle 3.4s ease-in-out infinite;
  }
  #shadow.jump { animation: shadowHop 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes shadowIdle {
    0%, 100% { transform: scaleX(1);    opacity: 0.32; }
    50%      { transform: scaleX(0.94); opacity: 0.26; }
  }
  @keyframes shadowHop {
    0%   { transform: scaleX(1);    opacity: 0.35; }
    30%  { transform: scaleX(0.55); opacity: 0.14; }
    100% { transform: scaleX(1);    opacity: 0.35; }
  }

  /* ================= outer group: idle sway (always on) ================= */
  #cone-root {
    transform-origin: 150px 236px;
    animation: idleSway 3.4s ease-in-out infinite;
  }
  #cone-root.jump { animation: hopOnce 0.62s cubic-bezier(.36,0,.15,1) 1; }

  @keyframes idleSway {
    0%, 100% { transform: translateY(0)   rotate(0deg); }
    50%      { transform: translateY(-4px) rotate(1.2deg); }
  }
  @keyframes hopOnce {
    0%   { transform: translateY(0)     scale(1, 1)      rotate(0deg); }
    14%  { transform: translateY(2px)   scale(1.07, 0.9)  rotate(0deg); }
    45%  { transform: translateY(-58px) scale(0.94, 1.08) rotate(-3deg); }
    72%  { transform: translateY(0)     scale(1.1, 0.88)  rotate(3deg); }
    86%  { transform: translateY(-5px)  scale(0.98, 1.03) rotate(-1deg); }
    100% { transform: translateY(0)     scale(1, 1)       rotate(0deg); }
  }

  /* ================= inner group: hover response ================= */
  #cone-hover {
    transform-origin: 150px 236px;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    cursor: pointer;
  }
  #cone-hit:hover #cone-hover {
    transform: scale(1.055) rotate(-1.5deg);
  }

  /* Only the pupils react to hover, never the eye whites: the whites have to
     stay registered inside Clyde's own eye cutouts (the mark is painted on top
     of them), so scaling them would slide white out past the hole on one side
     and expose the backing plate on the other. Dilating the pupils reads as
     "noticed you" and keeps the registration exact. */
  #pupils {
    transition: transform 0.3s ease;
    transform-origin: 150px 154px;
  }
  #cone-hit:hover #pupils { transform: scale(1.14); }

  /* ================= blink (independent, continuous) ================= */
  /* squashes the eye whites down to the backing plate, which is body-colored -
     so a blink reads as the cutout closing up rather than as a hole */
  #blink {
    animation: blink 4.2s ease-in-out infinite;
    transform-origin: 150px 152px;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.05); }
    97%           { transform: scaleY(1); }
  }

  #glint { animation: sparkle 2.6s ease-in-out infinite; }
  @keyframes sparkle {
    0%, 100% { opacity: 0.55; }
    22%      { opacity: 1; }
    36%      { opacity: 0.4; }
  }

  /* little dust puffs on landing */
  .puff {
    opacity: 0;
    transform-origin: center;
  }
  .puff.show {
    animation: puff 0.55s ease-out 1;
  }
  @keyframes puff {
    0%   { opacity: 0;   transform: scale(0.2) translateY(0); }
    25%  { opacity: 0.55; }
    100% { opacity: 0;   transform: scale(1.4) translateY(-6px); }
  }

  /* "in a call" indicator: Discord's own online-status-dot convention (solid
     green disc with a dark cutout ring, bottom-right of the mark) plus a
     pulsing halo. Driven by read_discord_voice_state() - see pet_app.py. Best
     effort (Windows' per-app mic-usage tracker), so it stays a quiet dot
     rather than anything that reads as 100% certain. */
  #callRing {
    opacity: 0;
    transition: opacity .25s;
  }
  #callRing.shown { opacity: 1; }
  #callRing.shown #callHalo {
    animation: callPulse 1.1s ease-in-out infinite;
    transform-origin: 210px 200px;
  }
  @keyframes callPulse {
    0%, 100% { transform: scale(0.85); opacity: 0.85; }
    50%      { transform: scale(1.45); opacity: 0;    }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
<div id="petWrap">
<svg id="discordPetSvg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Body gradient straddles Discord blurple #5865F2 rather than starting on
         it and only darkening: the two stops #7C88FF and #3442E5 average to
         exactly rgb(88,101,242) = #5865F2 channel-for-channel, so the mark's
         perceived colour stays the brand colour instead of drifting dark and
         desaturated the way a brand-to-shadow ramp does. -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7C88FF"/>
      <stop offset="100%" stop-color="#3442E5"/>
    </linearGradient>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="puffGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3BE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE3BE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse id="shadow" cx="150" cy="236" rx="66" ry="12" fill="url(#shadowGrad)"/>

  <!-- landing dust puffs -->
  <circle class="puff" id="puffL" cx="108" cy="226" r="14" fill="url(#puffGrad)"/>
  <circle class="puff" id="puffR" cx="192" cy="226" r="14" fill="url(#puffGrad)"/>

  <g id="cone-root">
   <g id="cone-hit">
    <rect x="30" y="0" width="240" height="400" fill="transparent"/>
    <g id="cone-hover">

      <!-- legs: stubby feet tucked behind the mark's lower body, same
           construction as the other brand pets -->
      <rect x="127" y="196" width="22" height="42" rx="10" fill="url(#tileGrad)" stroke="#242A7A" stroke-width="2"/>
      <rect x="151" y="196" width="22" height="42" rx="10" fill="url(#tileGrad)" stroke="#242A7A" stroke-width="2"/>

      <!-- Eye backing plates. Clyde's eyes are real holes in the mark, so over a
           transparent pet window they would punch straight through to the
           wallpaper. These sit behind the mark, slightly larger than each hole
           (hidden everywhere except inside it) and body-coloured, so a closed
           eye reads as body rather than as a gap. -->
      <ellipse cx="120.15" cy="151.84" rx="19.5" ry="21.5" fill="#454FC0"/>
      <ellipse cx="179.96" cy="151.84" rx="19.5" ry="21.5" fill="#454FC0"/>

      <!-- Face. Deliberately no bolted-on face: Clyde already has two large
           eye cutouts and no mouth, and at this render size (~140px, so each
           eye is ~15x17 device px) they are by far the most legible feature on
           the mark. Filling them with a white + pupil + glint makes the logo
           itself the character instead of a logo wearing a mask. Cheeks and a
           smile were tried and read as clutter over the mark's dark rims. -->
      <g id="face">
        <g id="blink">
          <ellipse cx="120.15" cy="151.84" rx="16.2" ry="18.1" fill="#F2F4FF"/>
          <ellipse cx="179.96" cy="151.84" rx="16.2" ry="18.1" fill="#F2F4FF"/>
          <g id="pupils">
            <circle cx="122" cy="155" r="7.6" fill="#232A6E"/>
            <circle cx="182" cy="155" r="7.6" fill="#232A6E"/>
            <circle id="glint" cx="125.5" cy="150" r="3" fill="#FFFFFF"/>
            <circle cx="185.5" cy="150" r="2.6" fill="#FFFFFF" opacity="0.9"/>
          </g>
        </g>
      </g>

      <!-- The pet's whole body IS the Discord ("Clyde") mark - the authentic
           Simple Icons glyph, fetched rather than reconstructed, scaled from its
           native 24x24 viewBox onto the same 180px body box (translate 60,55 /
           180 units wide) that chrome-pet and vscode-pet use, so the shared
           leg/shadow/puff geometry needed no changes. Painted last so its eye
           cutouts frame the eyes above. -->
      <path id="clyde" transform="translate(60,55) scale(7.5)"
            fill="url(#tileGrad)" stroke="#242A7A" stroke-width="0.4" stroke-linejoin="round"
            d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>

      <!-- "in a call": Discord's own status-dot language, bottom-right -->
      <g id="callRing">
        <circle id="callHalo" cx="228" cy="202" r="14" fill="none" stroke="#23A55A" stroke-width="4"/>
        <circle cx="228" cy="202" r="12" fill="#23A55A" stroke="#1B2050" stroke-width="4"/>
      </g>
    </g>
   </g>
  </g>
</svg>
</div>
</div>

<script>
  const pet      = document.getElementById('discordPetSvg');
  const petWrap  = document.getElementById('petWrap');
  const coneRoot = document.getElementById('cone-root');
  const shadow   = document.getElementById('shadow');
  const puffL    = document.getElementById('puffL');
  const puffR    = document.getElementById('puffR');
  const callRing = document.getElementById('callRing');

  function applyPetScale(pct) {
    petWrap.style.setProperty('--pet-scale', (parseInt(pct, 10) / 100 || 1).toString());
  }

  window.addEventListener('pywebviewready', () => {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.get_pet_config) {
      window.pywebview.api.get_pet_config().then((cfg) => {
        if (cfg && cfg.size) applyPetScale(cfg.size);
      });
    }
    pollVoice();
    setInterval(pollVoice, 1200);
  });

  // Polled from Python's read_discord_voice_state() - best-effort, see the
  // comment on #callRing and on read_discord_voice_state() in pet_app.py.
  function pollVoice() {
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.get_discord_voice)) return;
    window.pywebview.api.get_discord_voice().then((v) => {
      callRing.classList.toggle('shown', !!(v && v.in_call));
    }).catch(() => {});
  }

  function triggerJump() {
    coneRoot.classList.remove('jump');
    shadow.classList.remove('jump');
    puffL.classList.remove('show');
    puffR.classList.remove('show');
    void coneRoot.offsetWidth;

    coneRoot.classList.add('jump');
    shadow.classList.add('jump');

    setTimeout(() => {
      puffL.classList.add('show');
      puffR.classList.add('show');
    }, 430);
  }

  coneRoot.addEventListener('animationend', (e) => {
    if (e.animationName === 'hopOnce') {
      coneRoot.classList.remove('jump');
      shadow.classList.remove('jump');
    }
  });

  function handlePetClick() {
    triggerJump();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_app) {
      window.pywebview.api.open_app();
    }
  }

  let dragStartX, dragStartY, isDragging = false, movedDistance = 0;
  const DRAG_THRESHOLD = 6;

  pet.addEventListener('mousedown', (e) => {
    if (e.button !== 0) {
      if (e.button === 1) e.preventDefault();
      return;
    }
    dragStartX = e.screenX;
    dragStartY = e.screenY;
    movedDistance = 0;
    isDragging = false;
    if (window.pywebview && window.pywebview.api && window.pywebview.api.start_drag) {
      window.pywebview.api.start_drag();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (dragStartX === undefined) return;
    const dx = e.screenX - dragStartX;
    const dy = e.screenY - dragStartY;
    movedDistance += Math.abs(dx) + Math.abs(dy);
    if (movedDistance > DRAG_THRESHOLD) {
      isDragging = true;
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drag_move) {
        window.pywebview.api.drag_move(dx, dy);
      }
      dragStartX = e.screenX;
      dragStartY = e.screenY;
    }
  });

  window.addEventListener('mouseup', () => {
    if (dragStartX === undefined) return;
    if (isDragging) {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.drop) {
        window.pywebview.api.drop();
      }
    } else {
      handlePetClick();
    }
    dragStartX = undefined;
    isDragging = false;
  });

  pet.addEventListener('auxclick', (e) => {
    if (e.button !== 1) return;
    e.preventDefault();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_settings_window) {
      window.pywebview.api.open_settings_window();
    }
  });
</script>
</body>
</html>
