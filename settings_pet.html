<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>הגדרות חיה</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #FAECE7;
    font-family: 'Courier New', monospace;
    color: #4A1B0C;
    overflow: hidden;
  }
  #card {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    padding: 20px 22px 22px;
  }
  #settingsHeader {
    margin: 0 0 16px;
  }
  #settingsHeader h2 {
    margin: 0;
    font-size: 17px;
  }
  #modeToggle {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .modeBtn {
    flex: 1;
    border: 2px solid #D2703C;
    background: transparent;
    color: #B94A24;
    border-radius: 12px;
    padding: 12px 6px;
    font-family: inherit;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.16s ease-out, color 0.16s ease-out, transform 0.12s ease-out;
  }
  .modeBtn:active { transform: scale(0.96); }
  .modeBtn.active {
    background: #D2703C;
    color: #FFF7F0;
  }
  .settingsSection {
    margin-bottom: 18px;
    overflow: hidden;
  }
  .settingsSection p.hint {
    font-size: 11.5px;
    line-height: 1.55;
    margin: 0 0 10px;
    color: #7A3A20;
  }
  .settingsSection label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .settingsSection input[type=range] {
    width: 100%;
    accent-color: #D2703C;
  }
  .settingsValue {
    font-size: 12px;
    color: #B94A24;
    margin-top: 6px;
  }
  #settingsSave {
    width: 100%;
    background: #D2703C;
    color: #FFF7F0;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-family: inherit;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
    transition: transform 0.12s ease-out;
  }
  #settingsSave:active { transform: scale(0.97); }
</style>
</head>
<body>
<div id="card">
  <div id="settingsHeader">
    <h2>🐾 הגדרות חיה</h2>
  </div>

  <div id="modeToggle">
    <button class="modeBtn" data-mode="desktop" type="button">🖥️ שולחן עבודה</button>
    <button class="modeBtn" data-mode="taskbar" type="button">📌 שורת המשימות</button>
  </div>

  <div id="taskbarSection" class="settingsSection">
    <p class="hint">גררי את החיה עד שהיא יושבת בול על שורת המשימות</p>
    <label>גובה מעל שורת המשימות</label>
    <input id="calSlider" type="range" min="-80" max="180" value="46" />
    <div id="calValue" class="settingsValue">46px</div>
  </div>

  <div id="desktopSection" class="settingsSection" style="display:none;">
    <p class="hint">גררי את החיה לכל מקום על שולחן העבודה — היא תישאר בדיוק שם.</p>
  </div>

  <div class="settingsSection">
    <label>גודל החיה</label>
    <input id="sizeSlider" type="range" min="70" max="130" value="100" />
    <div id="sizeValue" class="settingsValue">100%</div>
  </div>

  <button id="settingsSave" type="button">שמור ✓</button>
</div>

<script>
  // This page runs in its own, genuinely separate pywebview window (see
  // open_settings_window / SettingsApi in pet_app.py). It talks to the
  // pet sprite (which lives in a different window) only through Python -
  // every call here goes through window.pywebview.api, backed by
  // SettingsApi, which forwards to the pet's own Api instance.

  const modeButtons = Array.from(document.querySelectorAll('.modeBtn'));
  const taskbarSection = document.getElementById('taskbarSection');
  const desktopSection = document.getElementById('desktopSection');
  const calSlider = document.getElementById('calSlider');
  const calValueLabel = document.getElementById('calValue');
  const sizeSlider = document.getElementById('sizeSlider');
  const sizeValueLabel = document.getElementById('sizeValue');
  const saveBtn = document.getElementById('settingsSave');

  function callApi(method, value) {
    if (window.pywebview && window.pywebview.api && window.pywebview.api[method]) {
      window.pywebview.api[method](value);
    }
  }

  function setMode(mode) {
    modeButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.mode === mode));
    taskbarSection.style.display = mode === 'taskbar' ? 'block' : 'none';
    desktopSection.style.display = mode === 'desktop' ? 'block' : 'none';
  }

  modeButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      setMode(btn.dataset.mode);
      callApi('set_mode', btn.dataset.mode);
    });
  });

  sizeSlider.addEventListener('input', () => {
    const pct = parseInt(sizeSlider.value, 10);
    sizeValueLabel.textContent = pct + '%';
    callApi('set_scale', pct);
  });

  calSlider.addEventListener('input', () => {
    const margin = parseInt(calSlider.value, 10);
    calValueLabel.textContent = margin + 'px';
    callApi('set_calibration_margin', margin);
  });

  function populateSettings(state) {
    state = state || {};
    setMode(state.mode || 'taskbar');

    const margin = (state.taskbar_margin !== undefined && state.taskbar_margin !== null)
      ? state.taskbar_margin
      : 46;
    calSlider.value = margin;
    calValueLabel.textContent = margin + 'px';

    const pct = state.scale_pct || 100;
    sizeSlider.value = pct;
    sizeValueLabel.textContent = pct + '%';
  }

  // Called directly from Python (see Api.open_settings_window in
  // pet_app.py) every time this window is shown again, since - unlike a
  // freshly created window - it only ever loads this page once and is
  // then just shown/hidden from then on, so 'pywebviewready' alone
  // wouldn't be enough to keep it in sync with settings changed elsewhere.
  window.__applySettings = populateSettings;

  saveBtn.addEventListener('click', () => {
    callApi('finish_calibration', parseInt(calSlider.value, 10));
    callApi('close');
  });

  window.addEventListener('pywebviewready', () => {
    if (window.pywebview.api && window.pywebview.api.get_settings) {
      window.pywebview.api.get_settings().then(populateSettings).catch((e) => {
        console.error('get_settings failed', e);
        populateSettings({});
      });
    } else {
      populateSettings({});
    }
  });
</script>
</body>
</html>
